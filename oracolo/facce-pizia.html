<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scegli il volto della Pizia</title>
<style>
  body { margin: 0; background: #101925; color: #f3e7cb; font-family: system-ui, sans-serif; }
  h1 { text-align: center; font-size: 28px; font-weight: 560; margin: 28px 16px 8px; }
  p.lead { text-align: center; color: #c9c3b4; margin: 0 16px 28px; }
  .row { display: grid; grid-template-columns: repeat(5, minmax(180px, 1fr)); gap: 18px; padding: 0 24px 40px; }
  article { background: #182433; border: 1px solid #8d7854; padding: 14px 12px 18px; text-align: center; }
  .letter { font-size: 13px; letter-spacing: 2px; color: #e8c17b; margin: 0; }
  h2 { font-size: 22px; margin: 4px 0 12px; font-weight: 560; }
  canvas { width: 168px; height: 224px; image-rendering: pixelated; background: #1a2840; }
  .poses { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .poses canvas { width: 72px; height: 96px; }
  .note { color: #b7b1a4; font-size: 13px; line-height: 1.45; min-height: 58px; }
  @media (max-width: 980px) { .row { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; } }
</style>
</head>
<body>
<h1>Quale volto teniamo?</h1>
<p class="lead">Il ritratto grande è a riposo. Sotto, a sinistra chiude gli occhi e a destra parla.</p>
<div class="row" id="gallery"></div>
<script src="js/pythia-sprites.js"></script>
<script src="js/pythia-face-options.js"></script>
<script>
const notes = {
  a: 'Viso rotondo, occhi grandi e guance morbide.',
  b: 'Ovale equilibrato, espressione calma.',
  c: 'Sorriso evidente, pensata per l’Open Day.',
  d: 'Tratti grandi e semplici, stile arcade.',
  e: 'Volto pieno e gentile, senza mento appuntito.'
};
const gallery = document.getElementById('gallery');
for (const id of ['a','b','c','d','e']) {
  const card = document.createElement('article');
  card.innerHTML = `<p class="letter">VERSIONE ${id.toUpperCase()}</p><h2>${PiziaFaces.names[id]}</h2><canvas data-face="${id}" data-pose="idle" width="120" height="160"></canvas><div class="poses"><canvas data-face="${id}" data-pose="waiting" width="120" height="160"></canvas><canvas data-face="${id}" data-pose="speaking" width="120" height="160"></canvas></div><p class="note">${notes[id]}</p>`;
  gallery.appendChild(card);
}
for (const canvas of document.querySelectorAll('canvas')) {
  const sprite = new PiziaSprite(canvas, true);
  sprite.face = canvas.dataset.face;
  sprite.setState(canvas.dataset.pose);
  if (canvas.dataset.pose === 'speaking') sprite.setMouth(2);
}
</script>
</body>
</html>
