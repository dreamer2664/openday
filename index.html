<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#070b16" />
  <title>OPERAZIONE EIPASS — Il Casardi in 8 Bit</title>
  <style>
    :root {
      --bg-deep: #070b16;
      --bg-deck: #0d1528;
      --bg-panel: #11192e;
      --gold: #ffd147;
      --cyan: #38bdf8;
      --crimson: #991b1b;
      --text: #f8fafc;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: radial-gradient(circle at center, #141f3b 0%, #070b16 82%);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", "Courier New", Courier, monospace, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #cabinet {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 100%;
      max-width: 1380px;
      padding: calc(6px + var(--safe-top)) calc(10px + var(--safe-right)) calc(6px + var(--safe-bottom)) calc(10px + var(--safe-left));
    }

    /* =========================================================================
       BARRA SUPERIORE MOBILE COMPATTA (Visibile su Telefono / Modalità Touch)
       ========================================================================= */
    #mobile-topbar {
      display: none;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      padding: 4px 6px;
      background: rgba(11, 18, 34, 0.95);
      border: 1px solid #334155;
      border-radius: 6px;
    }

    .m-top-btn {
      flex: 1;
      background: #17233b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 5px;
      padding: 6px 4px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .m-top-btn.primary {
      background: #c2410c;
      border-color: var(--gold);
      color: #ffffff;
    }

    .m-top-btn:active {
      transform: scale(0.96);
      background: #0284c7;
    }

    /* =========================================================================
       SCHERMO 16:9 PIXEL-ART NITIDO (480x270 nativo)
       ========================================================================= */
    #screen-frame {
      position: relative;
      border: 3px solid var(--gold);
      box-shadow: 0 0 0 3px #1e293b, 0 14px 38px rgba(0, 0, 0, 0.78);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    canvas#game-canvas {
      display: block;
      width: min(94vw, calc((100dvh - 82px) * (16 / 9)));
      height: auto;
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
      touch-action: none;
    }

    /* =========================================================================
       BARRA DESKTOP / KIOSK OPEN DAY
       ========================================================================= */
    #kiosk-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 12px;
    }

    .kiosk-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.12s, border-color 0.12s;
    }

    .kiosk-btn:hover {
      background: #0284c7;
      border-color: var(--gold);
    }

    .kiosk-btn.primary {
      background: #c2410c;
      border-color: var(--gold);
      color: #fff;
    }

    .key-hint {
      color: #cbd5e1;
      font-size: 11px;
      padding: 0 4px;
    }

    .key-hint b {
      color: var(--gold);
    }

    /* =========================================================================
       SELETTORE RAPIDO EROI + CONTROLLER TOUCH HANDHELD PER TELEFONO / TABLET
       ========================================================================= */
    #mobile-hero-strip {
      display: none;
      width: 100%;
      max-width: 540px;
      gap: 6px;
      justify-content: space-between;
    }

    .hero-pill {
      flex: 1;
      min-height: 32px;
      background: #131e35;
      border: 2px solid #334155;
      border-radius: 7px;
      color: #cbd5e1;
      padding: 7px 2px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      letter-spacing: -0.2px;
      touch-action: none;
      transition: transform 0.08s, border-color 0.12s, background 0.12s;
    }

    .hero-pill.active[data-char="ranaldo"] { background: #1e3a5f; border-color: #ffd147; color: #fff; }
    .hero-pill.active[data-char="carlo"]   { background: #7c2d12; border-color: #fb923c; color: #fff; }
    .hero-pill.active[data-char="daniele"] { background: #7a1f4d; border-color: #f472b6; color: #fff; }
    .hero-pill.active[data-char="ruggero"] { background: #7f1d1d; border-color: #f87171; color: #fff; }
    .hero-pill.active[data-char="francesco"] { background: #0f4c5c; border-color: #38e2d8; color: #fff; }

    .hero-pill.locked {
      opacity: 0.42;
    }

    #touch-deck {
      display: none;
      width: 100%;
      max-width: 620px;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      gap: 12px;
      touch-action: none;
    }

    /* D-PAD CROCE 2D CON TRASCINAMENTO CONTINUO DEL POLLICE (SX/DX/SU/GIU + DIAGONALI!) */
    #touch-dpad {
      position: relative;
      width: 148px;
      height: 148px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 41, 59, 0.92) 0%, rgba(11, 17, 32, 0.96) 76%);
      border: 2px solid #334155;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.65), 0 6px 18px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
      touch-action: none;
    }

    .dpad-arm {
      position: absolute;
      background: #1e293b;
      border: 2px solid #475569;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
      transition: background 0.06s, border-color 0.06s, color 0.06s;
    }

    .dpad-arm.up    { left: 49px; top: 8px;    width: 50px; height: 46px; border-radius: 8px 8px 3px 3px; }
    .dpad-arm.down  { left: 49px; bottom: 8px; width: 50px; height: 46px; border-radius: 3px 3px 8px 8px; }
    .dpad-arm.left  { left: 8px;  top: 49px;   width: 46px; height: 50px; border-radius: 8px 3px 3px 8px; }
    .dpad-arm.right { right: 8px; top: 49px;   width: 46px; height: 50px; border-radius: 3px 8px 8px 3px; }

    .dpad-center {
      position: absolute;
      left: 51px;
      top: 51px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid #334155;
      pointer-events: none;
    }

    .dpad-arm.pressed {
      background: #0284c7;
      border-color: var(--gold);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.65);
    }

    /* PULSANTIERA DESTRA A 4 TASTI ARCADE MULTI-TOUCH */
    #touch-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      width: 176px;
      height: 148px;
      flex-shrink: 0;
      touch-action: none;
    }

    .act-btn {
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.32);
      color: #ffffff;
      font-family: inherit;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.55), 0 8px 16px rgba(0, 0, 0, 0.4);
      touch-action: none;
      cursor: pointer;
    }

    .act-btn .main-lbl {
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    .act-btn .sub-lbl {
      font-size: 9px;
      opacity: 0.88;
      color: #fef08a;
    }

    .act-btn.btn-interact {
      background: linear-gradient(180deg, #ca8a04 0%, #854d0e 100%);
      border-color: #fde047;
    }

    .act-btn.btn-special {
      background: linear-gradient(180deg, #ea580c 0%, #9a3412 100%);
      border-color: #fdba74;
    }

    .act-btn.btn-assist {
      background: linear-gradient(180deg, #0d9488 0%, #115e59 100%);
      border-color: #5eead4;
    }

    .act-btn.btn-jump {
      background: linear-gradient(180deg, #0284c7 0%, #1e3a8a 100%);
      border-color: #7dd3fc;
    }

    .act-btn.pressed {
      transform: translateY(3px) scale(0.96);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.6);
      filter: brightness(1.2);
    }

    @keyframes pulseInteract {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 209, 71, 0.8), 0 5px 0 rgba(0, 0, 0, 0.55); }
      50%      { box-shadow: 0 0 16px 4px rgba(255, 209, 71, 0.95), 0 5px 0 rgba(0, 0, 0, 0.55); }
    }

    .act-btn.glow-ready {
      animation: pulseInteract 1.1s infinite;
      border-color: #ffffff;
    }

    /* =========================================================================
       LAYOUT ATTIVO QUANDO IL GIOCO È SU TELEFONO / TOUCH (VERTICALE E ORIZZONTALE!)
       ========================================================================= */
    body.touch-enabled #kiosk-bar {
      display: none;
    }

    body.touch-enabled #mobile-topbar {
      display: flex;
    }

    body.touch-enabled #touch-deck {
      display: flex;
    }

    /* 0. TELEFONI MOLTO STRETTI (< 400px): barra utility compattata, niente overflow */
    @media (max-width: 400px) {
      body.touch-enabled #mobile-topbar {
        padding: 3px 4px;
        gap: 3px;
      }
      body.touch-enabled .m-top-btn {
        font-size: 9px;
        padding: 5px 2px;
        letter-spacing: -0.3px;
      }
    }

    /* 1. TELEFONO IN VERTICALE (PORTRAIT): Stile Console Portatile Game Boy / GBA! */
    @media (orientation: portrait) {
      body.touch-enabled #cabinet {
        justify-content: space-between;
        gap: 8px;
        padding: calc(6px + var(--safe-top)) 8px calc(10px + var(--safe-bottom)) 8px;
      }

      body.touch-enabled #screen-frame {
        width: 100%;
        border-width: 2px;
      }

      body.touch-enabled canvas#game-canvas {
        width: 100%;
        max-height: 52dvh;
      }

      body.touch-enabled #mobile-hero-strip {
        display: flex;
      }

      body.touch-enabled #touch-deck {
        flex: 1;
        max-height: none;
        min-height: 220px;
        background: rgba(13, 21, 40, 0.88);
        border: 1px solid #263554;
        border-radius: 18px;
        padding: 10px 12px;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      /* Comandi fluidi in verticale: entrano anche sui 360px più stretti */
      body.touch-enabled #touch-dpad {
        width: 138px;
        height: 138px;
      }

      body.touch-enabled .dpad-arm.up    { left: 46px; top: 6px;    width: 46px; height: 44px; }
      body.touch-enabled .dpad-arm.down  { left: 46px; bottom: 6px; width: 46px; height: 44px; }
      body.touch-enabled .dpad-arm.left  { left: 6px;  top: 46px;   width: 44px; height: 46px; }
      body.touch-enabled .dpad-arm.right { right: 6px; top: 46px;   width: 44px; height: 46px; }
      body.touch-enabled .dpad-center    { left: 46px; top: 46px;   width: 46px; height: 46px; }

      body.touch-enabled #touch-actions {
        width: 148px;
        height: 138px;
        gap: 8px;
      }

      body.touch-enabled .act-btn { border-radius: 12px; }
      body.touch-enabled .act-btn .main-lbl { font-size: 12px; letter-spacing: 0; }
      body.touch-enabled .act-btn .sub-lbl  { font-size: 9px; }
    }

    /* 2. TELEFONO IN ORIZZONTALE (LANDSCAPE): Schermo gigante + Comandi flottanti ai lati! */
    @media (orientation: landscape) and (max-height: 620px) {
      body.touch-enabled #cabinet {
        position: relative;
        justify-content: flex-start;
        gap: 4px;
        padding: calc(3px + var(--safe-top)) calc(8px + var(--safe-right)) calc(3px + var(--safe-bottom)) calc(8px + var(--safe-left));
      }

      body.touch-enabled #mobile-topbar {
        max-width: 680px;
        padding: 2px 6px;
        z-index: 25;
      }

      body.touch-enabled .m-top-btn {
        padding: 3px 5px;
        font-size: 10px;
      }

      body.touch-enabled #screen-frame {
        border-width: 2px;
      }

      body.touch-enabled canvas#game-canvas {
        height: calc(100dvh - 42px - var(--safe-top) - var(--safe-bottom));
        width: auto;
        max-width: 98vw;
      }

      body.touch-enabled #touch-deck {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(4px + var(--safe-bottom));
        max-width: none;
        padding: 0 calc(10px + var(--safe-right)) 0 calc(10px + var(--safe-left));
        pointer-events: none;
        z-index: 30;
        /* Niente sfondo né bordo: in orizzontale i comandi devono restare TRASPARENTI
           e non coprire il pannello del dialogo. */
        background: none !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        min-height: 0 !important;
        max-height: none !important;
      }

      /* D-Pad e tasti più piccoli e semi-trasparenti: la scena resta leggibile */
      body.touch-enabled #touch-dpad {
        width: 116px !important;
        height: 116px !important;
        opacity: 0.7;
      }
      body.touch-enabled #touch-actions {
        width: 132px !important;
        height: 116px !important;
        gap: 6px !important;
        opacity: 0.74;
      }
      body.touch-enabled .act-btn {
        padding: 2px 4px !important;
        border-radius: 10px !important;
      }
      body.touch-enabled .act-btn .main-lbl { font-size: 10px !important; }
      body.touch-enabled .act-btn .sub-lbl  { font-size: 8px !important; }

      body.touch-enabled #touch-dpad,
      body.touch-enabled #touch-actions {
        pointer-events: auto;
        opacity: 0.82;
      }

      body.touch-enabled #touch-dpad {
        width: 128px;
        height: 128px;
      }

      body.touch-enabled .dpad-arm.up    { left: 38px; top: 4px;    width: 40px; height: 37px; }
      body.touch-enabled .dpad-arm.down  { left: 38px; bottom: 4px; width: 40px; height: 37px; }
      body.touch-enabled .dpad-arm.left  { left: 4px;  top: 38px;   width: 37px; height: 40px; }
      body.touch-enabled .dpad-arm.right { right: 4px; top: 38px;   width: 37px; height: 40px; }
      body.touch-enabled .dpad-center    { left: 38px; top: 38px;   width: 40px; height: 40px; }

      body.touch-enabled #touch-actions {
        width: 156px;
        height: 128px;
        gap: 8px;
      }
    }

    /* 3. MODALITÀ TOUCH ATTIVATA MANUALMENTE SU TABLET GRANDE / LIM / DESKTOP */
    @media (orientation: landscape) and (min-height: 621px) {
      body.touch-enabled canvas#game-canvas {
        width: min(92vw, calc((100dvh - 210px) * (16 / 9)));
      }
      body.touch-enabled #mobile-hero-strip {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="cabinet">
    <!-- Barra compatta per Telefono / Tablet -->
    <div id="mobile-topbar">
      <button class="m-top-btn primary" id="m-btn-openday">★ Open Day</button>
      <button class="m-top-btn" id="m-btn-switch">CAMBIA EROE</button>
      <button class="m-top-btn" id="m-btn-pause">II PAUSA</button>
      <button class="m-top-btn" id="m-btn-mute">AUDIO: ON</button>
      <button class="m-top-btn" id="m-btn-fullscreen">[ ] FULL</button>
      <button class="m-top-btn" id="m-btn-keyboard" title="Nascondi il controller touch e usa la tastiera">⌨ TASTI</button>
    </div>

    <!-- Schermo 16:9 480x270 -->
    <div id="screen-frame">
      <canvas id="game-canvas" width="480" height="270" tabindex="0" aria-label="Schermo di gioco Operazione EIPASS"></canvas>
    </div>

    <!-- Striscia rapida selezione 4 Protagonisti (Telefono Verticale / Tablet) -->
    <div id="mobile-hero-strip">
      <button class="hero-pill active" data-char="ranaldo" data-action="hero1">1: RAN</button>
      <button class="hero-pill" data-char="carlo" data-action="hero2">2: CAR</button>
      <button class="hero-pill" data-char="daniele" data-action="hero3">3: DAN</button>
      <button class="hero-pill" data-char="ruggero" data-action="hero4">4: RUG</button>
      <button class="hero-pill" data-char="francesco" data-action="hero5">5: FRA</button>
    </div>

    <!-- Console Touch Ergonomica Multi-Touch (D-Pad 2D Continuo + 4 Tasti Azione) -->
    <div id="touch-deck" aria-label="Comandi Touch Mobile">
      <div id="touch-dpad">
        <div class="dpad-arm up" id="dpad-up"><svg width="16" height="12" viewBox="0 0 16 12"><polygon points="8,1 15,11 1,11" fill="currentColor"/></svg></div>
        <div class="dpad-arm down" id="dpad-down"><svg width="16" height="12" viewBox="0 0 16 12"><polygon points="8,11 15,1 1,1" fill="currentColor"/></svg></div>
        <div class="dpad-arm left" id="dpad-left"><svg width="12" height="16" viewBox="0 0 12 16"><polygon points="1,8 11,1 11,15" fill="currentColor"/></svg></div>
        <div class="dpad-arm right" id="dpad-right"><svg width="12" height="16" viewBox="0 0 12 16"><polygon points="11,8 1,1 1,15" fill="currentColor"/></svg></div>
        <div class="dpad-center"></div>
      </div>

      <div id="touch-actions">
        <button class="act-btn btn-interact" data-hold="interact" id="btn-touch-interact">
          <span class="main-lbl" id="lbl-interact">USA [E]</span>
          <span class="sub-lbl" id="sub-interact">Parla/Apri</span>
        </button>
        <button class="act-btn btn-special" data-hold="special" id="btn-touch-special">
          <span class="main-lbl">ABILITÀ</span>
          <span class="sub-lbl">Ballo / Tiro</span>
        </button>
        <button class="act-btn btn-assist" data-hold="assist" id="btn-touch-assist">
          <span class="main-lbl">ASSIST</span>
          <span class="sub-lbl">Squadra [C]</span>
        </button>
        <button class="act-btn btn-jump" data-hold="jump" id="btn-touch-jump">
          <span class="main-lbl" id="lbl-jump">SALTA</span>
          <span class="sub-lbl" id="sub-jump">Tieni=Alto</span>
        </button>
      </div>
    </div>

    <!-- Barra Kiosk Desktop -->
    <div id="kiosk-bar">
      <button class="kiosk-btn primary" id="btn-openday" title="Avvia subito la missione dimostrativa Open Day (7-10 min)">
        ★ Demo Open Day
      </button>
      <button class="kiosk-btn" id="btn-campaign" title="Avvia la Campagna Completa a 6 Capitoli">
        ▶ Campagna Completa
      </button>
      <button class="kiosk-btn" id="btn-pause" title="Apri Pausa, Dossier Fiducia e Mixer Audio [P]">
        ⏸ Pausa / Dossier
      </button>
      <button class="kiosk-btn" id="btn-mute" title="Attiva/Disattiva Musica ed Effetti [M]">
        🔊 Audio ON/OFF
      </button>
      <button class="kiosk-btn" id="btn-touch-toggle" title="Mostra/Nascondi il Controller Touch per Telefono/LIM">
        📱 Comandi Touch
      </button>
      <button class="kiosk-btn" id="btn-reset" title="Reset immediato per il prossimo visitatore [F9]">
        ↻ Nuovo Visitatore (F9)
      </button>
      <button class="kiosk-btn" id="btn-fullscreen" title="Attiva schermo intero per postazione Open Day">
        ⛶ Schermo Intero
      </button>
      <span class="key-hint">
        <b>Frecce/AD</b> Muovi · <b>Spazio</b> Salta · <b>X</b> Abilità · <b>C</b> Assist · <b>E</b> Interagisci · <b>1-5/Q</b> Eroe
      </span>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const getApp = () => window.__CASARDI_GAME__;
      const focusCanvas = () => {
        const cv = document.getElementById("game-canvas");
        if (!cv) return;
        try {
          cv.focus({ preventScroll: true });
        } catch (_e) {
          cv.focus();
        }
      };
      const haptic = (ms = 8) => {
        try {
          if (navigator.vibrate) navigator.vibrate(ms);
        } catch (_e) {}
      };

      // 1. Rilevamento automatico Telefono / Tablet + attivazione immediata al primo tocco
      // Rilevamento: pointer coarse (o touch reale) => controller touch.
      // NIENTE override forzato: la barra kiosk con "Comandi Touch" deve restare raggiungibile.
      const coarseQuery = window.matchMedia ? window.matchMedia("(pointer: coarse)") : null;
      const isLikelyMobile = () =>
        !!coarseQuery?.matches ||
        ((navigator.maxTouchPoints || 0) > 0 && !window.matchMedia?.("(pointer: fine)").matches) ||
        window.innerWidth <= 820;

      let manualTouchOverride = null;
      const syncTouchMode = () => {
        const enable = manualTouchOverride !== null ? manualTouchOverride : isLikelyMobile();
        document.body.classList.toggle("touch-enabled", !!enable);
        const kb = document.getElementById("m-btn-keyboard");
        if (kb) kb.style.display = enable ? "" : "none";
      };
      syncTouchMode();
      coarseQuery?.addEventListener?.("change", syncTouchMode);
      // Il resize NON deve rifare il rilevamento (evita di riattivare il touch dopo averlo spento)
      window.addEventListener(
        "touchstart",
        () => {
          if (manualTouchOverride === null) {
            document.body.classList.add("touch-enabled");
          }
          getApp()?.audio.unlock();
        },
        { passive: true }
      );

      // Blocca pinch-zoom e doppio-tap zoom su iOS Safari
      document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
      document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });

      // 2. Pulsanti Utility (sia Desktop Kiosk sia Mobile Topbar)
      const triggerOpenDay = () => {
        const app = getApp();
        if (app) {
          app.audio.unlock();
          app.startMode("openday", false);
        }
        focusCanvas();
      };
      const triggerPause = () => {
        const app = getApp();
        if (app && (app.scene === "playing" || app.scene === "paused")) {
          app.audio.unlock();
          app.scene = app.scene === "playing" ? "paused" : "playing";
        }
        focusCanvas();
      };
      const triggerMute = () => {
        const app = getApp();
        if (app) {
          app.audio.unlock();
          app.state.audioPrefs.muted = app.audio.toggleMute();
          app.state.saveAudioPrefs();
        }
        focusCanvas();
      };
      const triggerFullscreen = () => {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          req?.call(el)?.catch?.(() => {});
        } else {
          exit?.call(document)?.catch?.(() => {});
        }
        focusCanvas();
      };

      // Qualsiasi click su un pulsante della pagina restituisce il focus al canvas
      document.addEventListener("click", (e) => {
        if (e.target instanceof HTMLButtonElement) focusCanvas();
      });
      document.addEventListener("pointerup", (e) => {
        if (e.target instanceof HTMLButtonElement) focusCanvas();
      });

      document.getElementById("btn-openday")?.addEventListener("click", triggerOpenDay);
      document.getElementById("m-btn-openday")?.addEventListener("click", triggerOpenDay);
      document.getElementById("btn-pause")?.addEventListener("click", triggerPause);
      document.getElementById("m-btn-pause")?.addEventListener("click", triggerPause);
      document.getElementById("btn-mute")?.addEventListener("click", triggerMute);
      document.getElementById("m-btn-mute")?.addEventListener("click", triggerMute);
      document.getElementById("btn-fullscreen")?.addEventListener("click", triggerFullscreen);
      document.getElementById("m-btn-fullscreen")?.addEventListener("click", triggerFullscreen);

      document.getElementById("m-btn-switch")?.addEventListener("click", () => {
        const app = getApp();
        if (app) {
          app.audio.unlock();
          app.input.pulseVirtualAction("switch");
          haptic(10);
        }
      });

      document.getElementById("btn-campaign")?.addEventListener("click", () => {
        const app = getApp();
        if (app) {
          app.audio.unlock();
          app.startMode("campaign", false);
        }
        focusCanvas();
      });

      document.getElementById("btn-reset")?.addEventListener("click", () => {
        const app = getApp();
        if (app) {
          app.audio.unlock();
          app.instantOpenDayVisitorReset();
        }
        focusCanvas();
      });

      document.getElementById("btn-touch-toggle")?.addEventListener("click", () => {
        manualTouchOverride = !document.body.classList.contains("touch-enabled");
        syncTouchMode();
        focusCanvas();
      });

      // Da telefono: torna alla tastiera fisica (utile su LIM / tablet con tastiera)
      document.getElementById("m-btn-keyboard")?.addEventListener("click", () => {
        manualTouchOverride = false;
        syncTouchMode();
        focusCanvas();
      });

      // 3. D-PAD 2D CONTINUO MULTI-TOUCH (scorrimento fluido pollice sinistro + diagonali [SU+X]!)
      const dpad = document.getElementById("touch-dpad");
      const armEls = {
        up: document.getElementById("dpad-up"),
        down: document.getElementById("dpad-down"),
        left: document.getElementById("dpad-left"),
        right: document.getElementById("dpad-right"),
      };
      let dpadTouchId = null;
      let dpadMouseDown = false;
      const curDirs = { up: false, down: false, left: false, right: false };

      const applyDpadDirs = (next) => {
        const app = getApp();
        ["up", "down", "left", "right"].forEach((dir) => {
          if (curDirs[dir] !== next[dir]) {
            curDirs[dir] = next[dir];
            armEls[dir]?.classList.toggle("pressed", next[dir]);
            app?.input.setVirtualAction(dir, next[dir]);
            if (next[dir]) haptic(6);
          }
        });
      };

      const computeDpadFromPoint = (clientX, clientY) => {
        if (!dpad) return;
        const r = dpad.getBoundingClientRect();
        const dx = clientX - (r.left + r.width / 2);
        const dy = clientY - (r.top + r.height / 2);
        const dist = Math.hypot(dx, dy);
        if (dist < r.width * 0.1) {
          applyDpadDirs({ up: false, down: false, left: false, right: false });
          return;
        }
        const angle = (Math.atan2(dy, dx) * 180) / Math.PI; // -180..180 (0=DX, -90=SU, 90=GIU)
        applyDpadDirs({
          right: angle > -65 && angle < 65,
          left: angle > 115 || angle < -115,
          up: angle > -155 && angle < -25,
          down: angle > 25 && angle < 155,
        });
      };

      if (dpad) {
        dpad.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            getApp()?.audio.unlock();
            if (dpadTouchId === null && e.changedTouches.length > 0) {
              const t = e.changedTouches[0];
              dpadTouchId = t.identifier;
              computeDpadFromPoint(t.clientX, t.clientY);
            }
          },
          { passive: false }
        );
        dpad.addEventListener(
          "touchmove",
          (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
              const t = e.changedTouches[i];
              if (t.identifier === dpadTouchId) {
                computeDpadFromPoint(t.clientX, t.clientY);
                break;
              }
            }
          },
          { passive: false }
        );
        const endDpadTouch = (e) => {
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === dpadTouchId) {
              dpadTouchId = null;
              applyDpadDirs({ up: false, down: false, left: false, right: false });
              break;
            }
          }
        };
        dpad.addEventListener("touchend", endDpadTouch, { passive: false });
        dpad.addEventListener("touchcancel", endDpadTouch, { passive: false });

        // Fallback mouse per testare il D-Pad anche su PC/LIM!
        dpad.addEventListener("mousedown", (e) => {
          dpadMouseDown = true;
          getApp()?.audio.unlock();
          computeDpadFromPoint(e.clientX, e.clientY);
        });
        window.addEventListener("mousemove", (e) => {
          if (dpadMouseDown) computeDpadFromPoint(e.clientX, e.clientY);
        });
        window.addEventListener("mouseup", () => {
          if (dpadMouseDown) {
            dpadMouseDown = false;
            applyDpadDirs({ up: false, down: false, left: false, right: false });
          }
        });
      }

      // 4. PULSANTI AZIONE DESTRI MULTI-TOUCH INDIPENDENTI (SALTA, ABILITÀ, USA [E], ASSIST [C])
      document.querySelectorAll(".act-btn[data-hold]").forEach((btn) => {
        const action = btn.getAttribute("data-hold");
        const activeTouches = new Set();

        const setBtnState = (down) => {
          btn.classList.toggle("pressed", down);
          getApp()?.input.setVirtualAction(action, down);
          if (down) haptic(10);
        };

        btn.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            getApp()?.audio.unlock();
            for (let i = 0; i < e.changedTouches.length; i++) {
              activeTouches.add(e.changedTouches[i].identifier);
            }
            setBtnState(true);
          },
          { passive: false }
        );

        const releaseTouch = (e) => {
          e.preventDefault();
          for (let i = 0; i < e.changedTouches.length; i++) {
            activeTouches.delete(e.changedTouches[i].identifier);
          }
          if (activeTouches.size === 0) setBtnState(false);
        };
        btn.addEventListener("touchend", releaseTouch, { passive: false });
        btn.addEventListener("touchcancel", releaseTouch, { passive: false });

        btn.addEventListener("mousedown", (e) => {
          e.preventDefault();
          getApp()?.audio.unlock();
          setBtnState(true);
        });
        btn.addEventListener("mouseup", () => setBtnState(false));
        btn.addEventListener("mouseleave", () => {
          if (activeTouches.size === 0 && btn.classList.contains("pressed")) setBtnState(false);
        });
      });

      // 5. PILLOLE SELEZIONE RAPIDA DEI 4 PROTAGONISTI (1-4)
      document.querySelectorAll(".hero-pill[data-action]").forEach((pill) => {
        const act = pill.getAttribute("data-action");
        const fire = (e) => {
          e.preventDefault();
          const app = getApp();
          if (app) {
            app.audio.unlock();
            app.input.pulseVirtualAction(act);
            haptic(10);
          }
        };
        pill.addEventListener("touchstart", fire, { passive: false });
        pill.addEventListener("mousedown", fire);
      });

      // 6. Sincronizzazione visiva live tra Stato di Gioco e Pulsantiera Mobile!
      const btnInteract = document.getElementById("btn-touch-interact");
      const btnAssist = document.getElementById("btn-touch-assist");
      const lblInteract = document.getElementById("lbl-interact");
      const subInteract = document.getElementById("sub-interact");
      const mMute = document.getElementById("m-btn-mute");
      const heroPills = Array.from(document.querySelectorAll(".hero-pill[data-char]"));

      setInterval(() => {
        const app = getApp();
        if (!app || !app.getTouchContextState) return;
        const st = app.getTouchContextState();

        if (btnInteract) {
          btnInteract.classList.toggle("glow-ready", st.hasInteract || st.inDialogueOrQuiz);
        }
        if (btnAssist) {
          btnAssist.style.opacity = st.assistReady ? "1" : "0.62";
        }
        if (lblInteract && subInteract) {
          if (st.inDialogueOrQuiz || st.scene === "title" || st.scene === "paused") {
            lblInteract.textContent = "OK / AVANTI";
            subInteract.textContent = "Conferma";
          } else if (st.hasInteract) {
            lblInteract.textContent = "USA [E] ★";
            subInteract.textContent = "Attiva Ora!";
          } else {
            lblInteract.textContent = "USA [E]";
            subInteract.textContent = "Parla/Apri";
          }
        }
        if (mMute) {
          mMute.textContent = st.muted ? "AUDIO: OFF" : "AUDIO: ON";
        }
        heroPills.forEach((pill) => {
          const cid = pill.getAttribute("data-char");
          const unlocked = st.unlockedChars.includes(cid);
          pill.classList.toggle("active", st.activeChar === cid);
          pill.classList.toggle("locked", !unlocked);
        });
      }, 120);
    });
  </script>
</body>
</html>
