<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#070b16" />
  <title>OPERAZIONE EIPASS — Il Casardi in 8 Bit (Versione Telefono)</title>
  <style>
    :root {
      --bg-deep: #070b16;
      --bg-deck: #0d1528;
      --bg-panel: #11192e;
      --gold: #ffd147;
      --cyan: #38bdf8;
      --crimson: #991b1b;
      --text: #f8fafc;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: radial-gradient(circle at center, #141f3b 0%, #070b16 82%);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", "Courier New", Courier, monospace, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #cabinet {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 100%;
      /* §3.3: un contenuto più alto del viewport spingeva #mobile-topbar in top negativo
         (misurato -10 px a 1024x768 e -24 px a 1440x900). Ora il contenuto si comprime
         invece di sfondare la pagina: la barra resta sempre interamente visibile. */
      min-height: 0;
      overflow: hidden;
      max-width: 1380px;
      padding: calc(6px + var(--safe-top)) calc(10px + var(--safe-right)) calc(6px + var(--safe-bottom)) calc(10px + var(--safe-left));
    }

    /* =========================================================================
       BARRA SUPERIORE MOBILE COMPATTA (Visibile su Telefono / Modalità Touch)
       ========================================================================= */
    #mobile-topbar {
      display: none;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      padding: 4px 6px;
      background: rgba(11, 18, 34, 0.95);
      border: 1px solid #334155;
      border-radius: 6px;
    }

    .m-top-btn {
      flex: 1;
      background: #17233b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 5px;
      padding: 6px 4px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .m-top-btn.primary {
      background: #c2410c;
      border-color: var(--gold);
      color: #ffffff;
    }

    .m-top-btn:active {
      transform: scale(0.96);
      background: #0284c7;
    }

    /* =========================================================================
       SCHERMO 16:9 PIXEL-ART NITIDO (480x270 nativo)
       ========================================================================= */
    #screen-frame {
      position: relative;
      border: 3px solid var(--gold);
      box-shadow: 0 0 0 3px #1e293b, 0 14px 38px rgba(0, 0, 0, 0.78);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    canvas#game-canvas {
      display: block;
      /* §3.2: con la sola riserva di 82 px, a 850x470 e 900x500 (zoom 125% dei portatili)
         il canvas partiva a y=-11 e l'HUD finiva fuori schermo. La riserva copre davvero
         la barra kiosk (fino a 2 righe di pulsanti) + l'hint comandi. */
      width: min(94vw, calc((100dvh - 190px) * (16 / 9)));
      height: auto;
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
      touch-action: none;
    }

    /* =========================================================================
       BARRA DESKTOP / KIOSK OPEN DAY
       ========================================================================= */
    #kiosk-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 12px;
    }

    .kiosk-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.12s, border-color 0.12s;
    }

    .kiosk-btn:hover {
      background: #0284c7;
      border-color: var(--gold);
    }

    .kiosk-btn.primary {
      background: #c2410c;
      border-color: var(--gold);
      color: #fff;
    }

    .key-hint {
      color: #cbd5e1;
      font-size: 11px;
      padding: 0 4px;
    }

    .key-hint b {
      color: var(--gold);
    }

    /* =========================================================================
       SELETTORE RAPIDO EROI + CONTROLLER TOUCH HANDHELD PER TELEFONO / TABLET
       ========================================================================= */
    #mobile-hero-strip {
      display: none;
      width: 100%;
      max-width: 540px;
      gap: 6px;
      justify-content: space-between;
    }

    .hero-pill {
      flex: 1;
      min-height: 32px;
      background: #131e35;
      border: 2px solid #334155;
      border-radius: 7px;
      color: #cbd5e1;
      padding: 7px 2px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      letter-spacing: -0.2px;
      touch-action: none;
      transition: transform 0.08s, border-color 0.12s, background 0.12s;
    }

    .hero-pill.active[data-char="ranaldo"] { background: #1e3a5f; border-color: #ffd147; color: #fff; }
    .hero-pill.active[data-char="carlo"]   { background: #7c2d12; border-color: #fb923c; color: #fff; }
    .hero-pill.active[data-char="daniele"] { background: #7a1f4d; border-color: #f472b6; color: #fff; }
    .hero-pill.active[data-char="ruggero"] { background: #7f1d1d; border-color: #f87171; color: #fff; }
    .hero-pill.active[data-char="francesco"] { background: #0f4c5c; border-color: #38e2d8; color: #fff; }

    .hero-pill.locked {
      opacity: 0.42;
    }

    #touch-deck {
      display: none;
      width: 100%;
      max-width: 620px;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      gap: 12px;
      touch-action: none;
    }

    /* D-PAD CROCE 2D CON TRASCINAMENTO CONTINUO DEL POLLICE (SX/DX/SU/GIU + DIAGONALI!) */
    #touch-dpad {
      position: relative;
      width: 148px;
      height: 148px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 41, 59, 0.92) 0%, rgba(11, 17, 32, 0.96) 76%);
      border: 2px solid #334155;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.65), 0 6px 18px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
      touch-action: none;
    }

    .dpad-arm {
      position: absolute;
      background: #1e293b;
      border: 2px solid #475569;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
      transition: background 0.06s, border-color 0.06s, color 0.06s;
    }

    .dpad-arm.up    { left: 49px; top: 8px;    width: 50px; height: 46px; border-radius: 8px 8px 3px 3px; }
    .dpad-arm.down  { left: 49px; bottom: 8px; width: 50px; height: 46px; border-radius: 3px 3px 8px 8px; }
    .dpad-arm.left  { left: 8px;  top: 49px;   width: 46px; height: 50px; border-radius: 8px 3px 3px 8px; }
    .dpad-arm.right { right: 8px; top: 49px;   width: 46px; height: 50px; border-radius: 3px 8px 8px 3px; }

    .dpad-center {
      position: absolute;
      left: 51px;
      top: 51px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid #334155;
      pointer-events: none;
    }

    .dpad-arm.pressed {
      background: #0284c7;
      border-color: var(--gold);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.65);
    }

    /* PULSANTIERA DESTRA A 4 TASTI ARCADE MULTI-TOUCH */
    #touch-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      width: 176px;
      height: 148px;
      flex-shrink: 0;
      touch-action: none;
    }

    .act-btn {
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.32);
      color: #ffffff;
      font-family: inherit;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.55), 0 8px 16px rgba(0, 0, 0, 0.4);
      touch-action: none;
      cursor: pointer;
    }

    .act-btn .main-lbl {
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    .act-btn .sub-lbl {
      font-size: 9px;
      opacity: 0.88;
      color: #fef08a;
    }

    .act-btn.btn-interact {
      background: linear-gradient(180deg, #ca8a04 0%, #854d0e 100%);
      border-color: #fde047;
    }

    .act-btn.btn-special {
      background: linear-gradient(180deg, #ea580c 0%, #9a3412 100%);
      border-color: #fdba74;
    }

    .act-btn.btn-assist {
      background: linear-gradient(180deg, #0d9488 0%, #115e59 100%);
      border-color: #5eead4;
    }

    .act-btn.btn-jump {
      background: linear-gradient(180deg, #0284c7 0%, #1e3a8a 100%);
      border-color: #7dd3fc;
    }

    .act-btn.pressed {
      transform: translateY(3px) scale(0.96);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.6);
      filter: brightness(1.2);
    }

    @keyframes pulseInteract {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 209, 71, 0.8), 0 5px 0 rgba(0, 0, 0, 0.55); }
      50%      { box-shadow: 0 0 16px 4px rgba(255, 209, 71, 0.95), 0 5px 0 rgba(0, 0, 0, 0.55); }
    }

    .act-btn.glow-ready {
      animation: pulseInteract 1.1s infinite;
      border-color: #ffffff;
    }

    /* §3.2: sotto i 620 px di altezza la barra kiosk si compatta (2 righe, testo piccolo)
       così il canvas 16:9 non viene spinto fuori dal bordo superiore. */
    @media (max-height: 620px) and (pointer: fine) {
      .kiosk-btn { padding: 3px 7px; font-size: 11px; }
      .key-hint { display: none; }
      #kiosk-bar { gap: 5px; padding: 4px 8px; }
    }

    /* =========================================================================
       LAYOUT ATTIVO QUANDO IL GIOCO È SU TELEFONO / TOUCH (VERTICALE E ORIZZONTALE!)
       ========================================================================= */
    body.touch-enabled #kiosk-bar {
      display: none;
    }

    body.touch-enabled #mobile-topbar {
      display: flex;
    }

    body.touch-enabled #touch-deck {
      display: flex;
    }

    /* 0. TELEFONI MOLTO STRETTI (< 400px): barra utility compattata, niente overflow */
    @media (max-width: 400px) {
      body.touch-enabled #mobile-topbar {
        padding: 3px 4px;
        gap: 3px;
      }
      body.touch-enabled .m-top-btn {
        font-size: 9px;
        padding: 5px 2px;
        letter-spacing: -0.3px;
      }
    }

    /* 1. TELEFONO IN VERTICALE (PORTRAIT): Stile Console Portatile Game Boy / GBA! */
    @media (orientation: portrait) {
      body.touch-enabled #cabinet {
        justify-content: space-between;
        gap: 8px;
        padding: calc(6px + var(--safe-top)) 8px calc(10px + var(--safe-bottom)) 8px;
      }

      body.touch-enabled #screen-frame {
        width: 100%;
        border-width: 2px;
      }

      body.touch-enabled canvas#game-canvas {
        width: 100%;
        /* §3.1: `max-height` da solo deformava il canvas (800x600 dava 784x558, ratio 1.405).
           Con `height:auto` l'aspect-ratio 16:9 resta sempre rispettato. */
        height: auto;
        max-height: 48dvh;
        aspect-ratio: 16 / 9;
      }

      body.touch-enabled #mobile-hero-strip {
        display: flex;
      }

      body.touch-enabled #touch-deck {
        flex: 1 1 auto;
        /* §3.1: prima la console occupava 529 px su 844 (63% dello schermo) */
        max-height: 46dvh;
        min-height: 168px;
        background: rgba(13, 21, 40, 0.88);
        border: 1px solid #263554;
        border-radius: 18px;
        padding: 10px 12px;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      /* Comandi fluidi in verticale: entrano anche sui 360px più stretti */
      body.touch-enabled #touch-dpad {
        width: 138px;
        height: 138px;
      }

      body.touch-enabled .dpad-arm.up    { left: 46px; top: 6px;    width: 46px; height: 44px; }
      body.touch-enabled .dpad-arm.down  { left: 46px; bottom: 6px; width: 46px; height: 44px; }
      body.touch-enabled .dpad-arm.left  { left: 6px;  top: 46px;   width: 44px; height: 46px; }
      body.touch-enabled .dpad-arm.right { right: 6px; top: 46px;   width: 44px; height: 46px; }
      body.touch-enabled .dpad-center    { left: 46px; top: 46px;   width: 46px; height: 46px; }

      body.touch-enabled #touch-actions {
        width: 148px;
        height: 138px;
        gap: 8px;
      }

      body.touch-enabled .act-btn { border-radius: 12px; }
      body.touch-enabled .act-btn .main-lbl { font-size: 12px; letter-spacing: 0; }
      body.touch-enabled .act-btn .sub-lbl  { font-size: 9px; }
    }

    /* 2. TELEFONO IN ORIZZONTALE (LANDSCAPE): Schermo gigante + Comandi flottanti ai lati! */
    @media (orientation: landscape) and (max-height: 620px) {
      body.touch-enabled #cabinet {
        position: relative;
        justify-content: flex-start;
        gap: 4px;
        padding: calc(3px + var(--safe-top)) calc(8px + var(--safe-right)) calc(3px + var(--safe-bottom)) calc(8px + var(--safe-left));
      }

      body.touch-enabled #mobile-topbar {
        max-width: 680px;
        padding: 2px 6px;
        z-index: 25;
      }

      body.touch-enabled .m-top-btn {
        padding: 3px 5px;
        font-size: 10px;
      }

      body.touch-enabled #screen-frame {
        border-width: 2px;
      }

      body.touch-enabled canvas#game-canvas {
        /* §3.1: con height fissa + max-width il rapporto veniva ignorato (800x600 -> 784x558,
           ratio 1.405). Ora larghezza e altezza derivano dalla STESSA formula 16:9. */
        width: min(96vw, calc((100dvh - 42px - var(--safe-top) - var(--safe-bottom)) * (16 / 9)));
        height: auto;
        max-width: 96vw;
        aspect-ratio: 16 / 9;
      }

      /* §3.6: in orizzontale basso (390-620 px di altezza) il canvas occupa già tutta
         l'altezza e non resta spazio per la striscia eroe: resta nascosta e si cambia
         eroe con il pulsante "CAMBIA EROE" della barra o con i tasti 1-5 / Q.
         (CONTROLLI.md dice esattamente questo, senza promettere una barra che non c'è.) */

      body.touch-enabled #touch-deck {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(4px + var(--safe-bottom));
        max-width: none;
        padding: 0 calc(10px + var(--safe-right)) 0 calc(10px + var(--safe-left));
        pointer-events: none;
        z-index: 30;
        /* Niente sfondo né bordo: in orizzontale i comandi devono restare TRASPARENTI
           e non coprire il pannello del dialogo. */
        background: none !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        min-height: 0 !important;
        max-height: none !important;
      }

      /* D-Pad e tasti più piccoli e semi-trasparenti: la scena resta leggibile */
      body.touch-enabled #touch-dpad {
        width: 116px !important;
        height: 116px !important;
        opacity: 0.7;
      }
      body.touch-enabled #touch-actions {
        width: 132px !important;
        height: 116px !important;
        gap: 6px !important;
        opacity: 0.74;
      }
      body.touch-enabled .act-btn {
        padding: 2px 4px !important;
        border-radius: 10px !important;
      }
      body.touch-enabled .act-btn .main-lbl { font-size: 10px !important; }
      body.touch-enabled .act-btn .sub-lbl  { font-size: 8px !important; }

      body.touch-enabled #touch-dpad,
      body.touch-enabled #touch-actions {
        pointer-events: auto;
        opacity: 0.82;
      }

      body.touch-enabled #touch-dpad {
        width: 128px;
        height: 128px;
      }

      body.touch-enabled .dpad-arm.up    { left: 38px; top: 4px;    width: 40px; height: 37px; }
      body.touch-enabled .dpad-arm.down  { left: 38px; bottom: 4px; width: 40px; height: 37px; }
      body.touch-enabled .dpad-arm.left  { left: 4px;  top: 38px;   width: 37px; height: 40px; }
      body.touch-enabled .dpad-arm.right { right: 4px; top: 38px;   width: 37px; height: 40px; }
      body.touch-enabled .dpad-center    { left: 38px; top: 38px;   width: 40px; height: 40px; }

      body.touch-enabled #touch-actions {
        width: 156px;
        height: 128px;
        gap: 8px;
      }
    }

    /* 3. MODALITÀ TOUCH ATTIVATA MANUALMENTE SU TABLET GRANDE / LIM / DESKTOP */
    @media (orientation: landscape) and (min-height: 621px) {
      body.touch-enabled canvas#game-canvas {
        /* §3.3: con la sola riserva di 210 px, a 1024x768 e 1440x900 il contenuto
           superava l'altezza e #mobile-topbar finiva a top -10 / -24 (pulsanti tagliati). */
        width: min(92vw, calc((100dvh - 300px) * (16 / 9)));
      }
      body.touch-enabled #mobile-hero-strip {
        display: flex;
      }
    }
  </style>
</head>
<body class="touch-enabled">
  <div id="cabinet">
    <!-- Barra compatta per Telefono / Tablet -->
    <div id="mobile-topbar">
      <button type="button" class="m-top-btn primary" id="m-btn-openday" aria-label="Avvia la modalità Open Day">★ Open Day</button>
      <button type="button" class="m-top-btn" id="m-btn-switch" aria-label="Cambia eroe attivo (ciclo)">CAMBIA EROE</button>
      <button type="button" class="m-top-btn" id="m-btn-pause" aria-label="Pausa e Dossier">II PAUSA</button>
      <button type="button" class="m-top-btn" id="m-btn-mute" aria-label="Attiva o disattiva audio">AUDIO: ON</button>
      <button type="button" class="m-top-btn" id="m-btn-fullscreen" aria-label="Schermo intero">[ ] FULL</button>
      <button type="button" class="m-top-btn" id="m-btn-keyboard" title="Nascondi il controller touch e usa la tastiera" aria-label="Nascondi i comandi touch e usa la tastiera">⌨ TASTI</button>
    </div>

    <!-- Schermo 16:9 480x270 -->
    <div id="screen-frame">
      <canvas id="game-canvas" width="480" height="270" tabindex="0" aria-label="Schermo di gioco Operazione EIPASS"></canvas>
    </div>

    <!-- Striscia rapida selezione 5 Protagonisti (Telefono Verticale / Tablet).
         Ordine identico a HERO_BASE_ORDER dell'HUD e ai tasti 1-5: 1=CAR (Carlo), 2=RAN (Ranaldo). -->
    <div id="mobile-hero-strip" role="group" aria-label="Selezione rapida eroe (1-5)">
      <button type="button" class="hero-pill active" data-char="carlo" data-action="hero1" aria-label="Tasto 1: Carlo">1: CAR</button>
      <button type="button" class="hero-pill" data-char="ranaldo" data-action="hero2" aria-label="Tasto 2: Ranaldo">2: RAN</button>
      <button type="button" class="hero-pill" data-char="daniele" data-action="hero3" aria-label="Tasto 3: Daniele">3: DAN</button>
      <button type="button" class="hero-pill" data-char="ruggero" data-action="hero4" aria-label="Tasto 4: Ruggero">4: RUG</button>
      <button type="button" class="hero-pill" data-char="francesco" data-action="hero5" aria-label="Tasto 5: Francesco">5: FRA</button>
    </div>

    <!-- Console Touch Ergonomica Multi-Touch (D-Pad 2D Continuo + 4 Tasti Azione) -->
    <div id="touch-deck" aria-label="Comandi Touch Mobile">
      <div id="touch-dpad">
        <div class="dpad-arm up" id="dpad-up"><svg width="16" height="12" viewBox="0 0 16 12"><polygon points="8,1 15,11 1,11" fill="currentColor"/></svg></div>
        <div class="dpad-arm down" id="dpad-down"><svg width="16" height="12" viewBox="0 0 16 12"><polygon points="8,11 15,1 1,1" fill="currentColor"/></svg></div>
        <div class="dpad-arm left" id="dpad-left"><svg width="12" height="16" viewBox="0 0 12 16"><polygon points="1,8 11,1 11,15" fill="currentColor"/></svg></div>
        <div class="dpad-arm right" id="dpad-right"><svg width="12" height="16" viewBox="0 0 12 16"><polygon points="11,8 1,1 1,15" fill="currentColor"/></svg></div>
        <div class="dpad-center"></div>
      </div>

      <div id="touch-actions">
        <button type="button" class="act-btn btn-interact" data-hold="interact" id="btn-touch-interact" aria-label="Interagisci / parla / apri (E)">
          <span class="main-lbl" id="lbl-interact">USA [E]</span>
          <span class="sub-lbl" id="sub-interact">Parla/Apri</span>

const STORAGE_KEY = "casardi_8bit_eipass_save_v3";
const AUDIO_PREF_KEY = "casardi_8bit_audio_prefs_v3";

const memoryFallback = {};
const SafeStorage = {
  get(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (_) {
      return memoryFallback[key] || null;
    }
  },
  set(key, val) {
    try {
      window.localStorage.setItem(key, val);
    } catch (_) {
      memoryFallback[key] = val;
    }
  },
  remove(key) {
    try {
      window.localStorage.removeItem(key);
    } catch (_) {
      delete memoryFallback[key];
    }
  },
};

const TRUST_DISPLAY_NAMES = {
  carlo: "Carlo",
  ranaldo: "Prof. Ranaldo",
  daniele: "Daniele",
  ruggero: "Ruggero",
  francesco: "Francesco",
};
function createFreshState(mode = "openday") {
  return {
    mode, // 'openday' | 'campaign'
    chapterIndex: 0,
    roomIndex: 0,
    activeChar: "carlo",
    unlockedChars: ["carlo", "ranaldo"],
    hp: 5,
    maxHp: 5,
    shield: 0,
    score: 0,
    coins: 0,
    playTimeSec: 0,
    deaths: 0,
    enemiesDefeated: 0,
    assistsUsed: 0,
    subRoomsVisited: [],

    trust: {
      // §1.4 della review: con questi valori la soglia "Bonus >=70%" del Dossier era
      // praticamente irraggiungibile in una run Open Day (si fermava a 56-67%).
      carlo: 66,
      ranaldo: 60,
      daniele: 60,
      ruggero: 60,
      francesco: 60,
    },
    eipassScore: 50,
    eipassAnswered: 0,
    eipassCorrect: 0,
    eipassWrong: 0,
    modulesCleared: [false, false, false, false, false, false, false],

    pegasoCollected: [],
    clearedTerminals: [],
    completedMinigames: [],
    triggeredDialogues: [],
    unlockedDoors: [],
    flags: {},
    decisionsLog: [],
    checkpoint: null,
  };
}
class GameStateManager {
  constructor() {
    this.data = createFreshState("openday");
    this.audioPrefs = this.loadAudioPrefs();
    this.consequenceQueue = [];
  }

  pushConsequence(text, color = "#ffd147") {
    this.consequenceQueue.push({ text, color, ttl: 190 });
    if (this.consequenceQueue.length > 3) {
      this.consequenceQueue.shift();
    }
  }

  loadAudioPrefs() {
    const raw = SafeStorage.get(AUDIO_PREF_KEY);
    if (raw) {
      try {
        return { musicVol: 0.7, sfxVol: 0.85, muted: false, crt: false, followTeam: false, ...JSON.parse(raw) };
      } catch (_) {}
    }
    return { musicVol: 0.7, sfxVol: 0.85, muted: false, crt: false, followTeam: false };
  }

  saveAudioPrefs() {
    SafeStorage.set(AUDIO_PREF_KEY, JSON.stringify(this.audioPrefs));
  }

  reset(mode = "openday") {
    this.data = createFreshState(mode);
    this.consequenceQueue = [];
    return this.data;
  }

  hasSavedCampaign() {
    const raw = SafeStorage.get(STORAGE_KEY);
    if (!raw) return false;
    try {
      const parsed = JSON.parse(raw);
      return parsed && parsed.mode === "campaign";
    } catch (_) {
      return false;
    }
  }

  saveCampaign() {
    if (this.data.mode !== "campaign") return;
    SafeStorage.set(STORAGE_KEY, JSON.stringify(this.data));
  }

  loadCampaign() {
    const raw = SafeStorage.get(STORAGE_KEY);
    if (!raw) return false;
    try {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.mode === "campaign") {
        const fresh = createFreshState("campaign");
        this.data = Object.assign(fresh, parsed);
        this.data.trust = Object.assign(fresh.trust, parsed.trust || {});
        if (!Array.isArray(this.data.unlockedChars) || this.data.unlockedChars.length === 0) {
          this.data.unlockedChars = ["carlo", "ranaldo"];
        }
        return true;
      }
    } catch (_) {}
    return false;
  }

  clearSavedCampaign() {
    SafeStorage.remove(STORAGE_KEY);
  }

  unlockCharacter(charId) {
    if (!this.data.unlockedChars.includes(charId)) {
      this.data.unlockedChars.push(charId);
      const label = TRUST_DISPLAY_NAMES[charId] || charId;
      this.pushConsequence(`${label} si unisce al gruppo`, "#38e2d8");
      // §1.3: il bonus "+1 energia massima per compagno" della sinergia ora è REALE
      // (prima il campo esisteva ma non veniva mai applicato: restava a 5 cuori per sempre).
      this.applyTeamSynergyHp();
    }
  }

  /** Energia massima = 5 cuori base + 1 per ogni compagno oltre il primo (max 6 = cap HUD).
   *  Riflette main.teamSynergy().maxHpBonus espresso in cuori invece che in "punti". */
  applyTeamSynergyHp(bonusHearts = null) {
    const bonus =
      bonusHearts === null
        ? Math.min(1, Math.max(0, (this.data.unlockedChars?.length || 2) - 2))
        : Math.max(0, Math.min(1, bonusHearts | 0));
    const wanted = Math.min(6, 5 + bonus);
    if (this.data.maxHp !== wanted) {
      this.data.maxHp = Math.max(this.data.maxHp, wanted);
      this.data.hp = Math.min(this.data.maxHp, this.data.hp + 1);
    }
    return this.data.maxHp;
  }

  modifyTrust(charId, delta) {
    if (this.data.trust[charId] === undefined) return;
    const prev = this.data.trust[charId];
    this.data.trust[charId] = Math.max(0, Math.min(100, prev + delta));
    if (charId === "ranaldo" && this.data.trust.ranaldo >= 75 && this.data.maxHp < 6) {
      this.data.maxHp = 6;
      this.data.hp = Math.min(this.data.maxHp, this.data.hp + 1);
      this.pushConsequence("Intesa col Prof. Ranaldo: +1 Energia massima", "#4ade80");
    }
  }

  recordChoice(id, label, summary, effects = {}) {
    this.data.flags[id] = effects.flagValue !== undefined ? effects.flagValue : true;
    this.data.decisionsLog.push({ id, label, summary });

    let topChar = null;
    let topAbs = 0;
    let topDelta = 0;

    if (effects.trust) {
      for (const [cid, delta] of Object.entries(effects.trust)) {
        this.modifyTrust(cid, delta);
        if (Math.abs(delta) > topAbs) {
          topAbs = Math.abs(delta);
          topChar = cid;
          topDelta = delta;
        }
      }
    }

    if (topChar && topAbs >= 4) {
      const who = TRUST_DISPLAY_NAMES[topChar] || topChar;
      const sign = topDelta > 0 ? `+${topDelta}%` : `${topDelta}%`;
      this.pushConsequence(
        `Fiducia ${who}: ${sign}`,
        topDelta > 0 ? "#ffd147" : "#f87171"
      );
    }

    if (effects.eipassDelta) {
      this.data.eipassScore = Math.max(0, Math.min(100, this.data.eipassScore + effects.eipassDelta));
      this.pushConsequence(
        effects.eipassDelta > 0
          ? `Padronanza EIPASS +${effects.eipassDelta}%`
          : `Imprecisione digitale ${effects.eipassDelta}%`,
        effects.eipassDelta > 0 ? "#38bdf8" : "#f87171"
      );
    }
    if (effects.hpDelta) {
      if (effects.hpDelta < 0) {
        this.data.hp = Math.max(1, this.data.hp + effects.hpDelta);
      } else {
        this.data.hp = Math.min(this.data.maxHp, this.data.hp + effects.hpDelta);
      }
    }
    if (effects.shieldDelta) {
      this.data.shield = Math.max(0, Math.min(3, this.data.shield + effects.shieldDelta));
    }
    if (effects.scoreDelta) {
      this.data.score += effects.scoreDelta;
    }
    this.saveCampaign();
  }

  recordQuizOutcome(quizId, moduleIndex, isCorrect) {
    // In "clearedTerminals" finiscono SOLO le postazioni superate:
    // una risposta sbagliata non indebolisce il boss finale e non sblocca varchi.
    if (isCorrect && !this.data.clearedTerminals.includes(quizId)) {
      this.data.clearedTerminals.push(quizId);
    }
    this.data.eipassAnswered += 1;
    if (isCorrect) {
      this.data.eipassCorrect += 1;
      this.data.eipassScore = Math.min(100, this.data.eipassScore + 9);
      this.data.score += 350;
      if (moduleIndex >= 1 && moduleIndex <= 7) {
        this.data.modulesCleared[moduleIndex - 1] = true;
      }
      this.modifyTrust("ranaldo", 5);
      this.modifyTrust("daniele", 4);
      this.pushConsequence(`Modulo EIPASS ${moduleIndex} verificato (+Scudo)`, "#4ade80");
    } else {
      this.data.eipassWrong += 1;
      this.data.eipassScore = Math.max(0, this.data.eipassScore - 7);
      this.data.hp = Math.max(1, this.data.hp - 1);
      this.modifyTrust("ranaldo", -3);
      this.pushConsequence(`Errore su Modulo ${moduleIndex}: controllo da rivedere`, "#f87171");
    }
    this.saveCampaign();
  }

  collectPegaso(pegasoId) {
    if (!this.data.pegasoCollected.includes(pegasoId)) {
      this.data.pegasoCollected.push(pegasoId);
      this.data.score += 500;
      this.data.hp = Math.min(this.data.maxHp, this.data.hp + 1);
      this.pushConsequence("Recuperata una pagina d'archivio di Pegaso", "#fde047");
      this.saveCampaign();
      return true;
    }
    return false;
  }

  addBitToken(amount = 1) {
    this.data.coins += amount;
    this.data.score += 25 * amount;
    if (this.data.coins >= 25) {
      this.data.coins -= 25;
      if (this.data.hp < this.data.maxHp) {
        this.data.hp += 1;

  constructor(prefs = { musicVol: 0.7, sfxVol: 0.85, muted: false }) {

    this.musicGain = null;
    this.sfxGain = null;
    this.noiseBuffer = null;

    this.musicVol = prefs.musicVol ?? 0.7;
    this.sfxVol = prefs.sfxVol ?? 0.85;
    this.muted = !!prefs.muted;
    this.ducked = false;

    this.currentTrackKey = null;
    this.stepIndex = 0;
    this.nextStepTime = 0;
    this.schedulerId = null;
    this.unlocked = false;

    if (typeof document !== "undefined") {
      document.addEventListener("visibilitychange", () => {
        if (!this.ctx) return;

          if (this.ctx.state === "running") this.ctx.suspend().catch(() => {});
        } else if (!this.muted && this.unlocked) {
          this.ctx.resume().catch(() => {});
        }
      });
    }
  }

  unlock() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return false;
      this.ctx = new AudioCtx();
      this.musicGain = this.ctx.createGain();
      this.sfxGain = this.ctx.createGain();
      this.musicGain.connect(this.ctx.destination);
      this.sfxGain.connect(this.ctx.destination);
      this.buildNoiseBuffer();
      this.applyVolumes();
    }
    if (this.ctx.state === "suspended" || this.ctx.state === "interrupted") {
      try {
        const silent = this.ctx.createBuffer(1, 1, 22050);
        const src = this.ctx.createBufferSource();
        src.buffer = silent;
        src.connect(this.ctx.destination);
        src.start(0);
      } catch (_e) {}
      this.ctx
        .resume()
        .then(() => {
          this.unlocked = this.ctx && this.ctx.state === "running";
          this.applyVolumes();
          if (this.currentTrackKey && !this.schedulerId) {
            this.startScheduler();
          }
        })
        .catch(() => {});
    }
    this.unlocked = this.ctx.state === "running";
    if (this.currentTrackKey && !this.schedulerId && this.unlocked) {
      this.startScheduler();
    }
    return this.unlocked;
  }

  buildNoiseBuffer() {
    if (!this.ctx) return;
    const len = this.ctx.sampleRate * 0.4;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    let lfsr = 0x53a1;
    for (let i = 0; i < len; i++) {
      lfsr = (lfsr >> 1) ^ (-(lfsr & 1) & 0xb400);
      data[i] = lfsr & 1 ? 0.8 : -0.8;
    }
    this.noiseBuffer = buf;
  }

  applyVolumes() {
    if (!this.ctx || !this.musicGain || !this.sfxGain) return;
    const now = this.ctx.currentTime;
    const duckMult = this.ducked ? 0.36 : 1.0;
    const mTarget = this.muted ? 0.0001 : Math.max(0.0001, this.musicVol * 0.25 * duckMult);
    const sTarget = this.muted ? 0.0001 : Math.max(0.0001, this.sfxVol * 0.4);
    this.musicGain.gain.setTargetAtTime(mTarget, now, 0.045);
    this.sfxGain.gain.setTargetAtTime(sTarget, now, 0.02);
  }

  setMusicVolume(v) {
    this.musicVol = Math.max(0, Math.min(1, v));
    this.applyVolumes();
  }

  setSfxVolume(v) {
    this.sfxVol = Math.max(0, Math.min(1, v));
    this.applyVolumes();
  }

  toggleMute() {
    this.muted = !this.muted;
    this.applyVolumes();
    return this.muted;
  }

  setDucking(active) {
    if (this.ducked !== active) {
      this.ducked = active;
      this.applyVolumes();
    }
  }

  playTrack(trackKey, keepBeatAlignment = false) {
    if (!TRACKS[trackKey]) return;
    if (this.currentTrackKey === trackKey && this.schedulerId) return;

    // Morbida micro-dissolvenza sul cambio traccia per evitare stacchi bruschi
    if (this.ctx && this.musicGain && !this.muted && this.currentTrackKey) {
      const now = this.ctx.currentTime;
      const duckMult = this.ducked ? 0.36 : 1.0;
      const target = Math.max(0.0001, this.musicVol * 0.25 * duckMult);
      this.musicGain.gain.setTargetAtTime(Math.max(0.0001, target * 0.35), now, 0.025);
      this.musicGain.gain.setTargetAtTime(target, now + 0.07, 0.06);
    }

    this.currentTrackKey = trackKey;
    if (!keepBeatAlignment) {
      this.stepIndex = 0;
    }
    if (this.ctx) {
      if (!this.schedulerId) {
        this.nextStepTime = this.ctx.currentTime + 0.03;
        this.startScheduler();
      }
    }
  }

  setBossMusicPhase(phase = 1) {
    const target = phase >= 3 ? "boss_p3" : phase === 2 ? "boss_p2" : "boss";
    if (this.currentTrackKey !== target) {
      this.playTrack(target, true);
    }
  }

  stopTrack() {
    this.currentTrackKey = null;
    if (this.schedulerId) {
      clearInterval(this.schedulerId);
      this.schedulerId = null;
    }
  }

  startScheduler() {
    if (this.schedulerId) clearInterval(this.schedulerId);
    this.nextStepTime = this.ctx.currentTime + 0.04;
    this.schedulerId = setInterval(() => this.scheduleSteps(), 35);
  }

  scheduleSteps() {
    if (!this.ctx || !this.currentTrackKey || this.ctx.state !== "running") return;
    const track = TRACKS[this.currentTrackKey];
    if (!track) return;

    const stepDur = 60.0 / track.bpm / 4.0;
    const totalSteps = track.lead.length;

    while (this.nextStepTime < this.ctx.currentTime + 0.14) {
      const idx = this.stepIndex % totalSteps;
      this.scheduleVoiceNote(track.lead, idx, this.nextStepTime, stepDur, track.leadWave, 0.23);
      this.scheduleVoiceNote(track.harm, idx, this.nextStepTime, stepDur, track.harmWave, 0.13);
      this.scheduleVoiceNote(track.bass, idx, this.nextStepTime, stepDur, "triangle", 0.33);
      // v3.1 — due strumenti in più per una colonna sonora meno "beep":
      // pad lungo (4a voce, regge l'accordo) e arpeggio di ottavi (movimento).
      // Sono opzionali e attivi per traccia (pad: true / arp: true), quindi le
      // tracce esistenti non cambiano di una nota.
      if (track.pad) this.schedulePadNote(track.harm, idx, this.nextStepTime, stepDur);
      if (track.arp) this.scheduleArpeggio(track, idx, this.nextStepTime, stepDur);
      this.scheduleDrum(track.drums[idx % track.drums.length], this.nextStepTime);

      this.nextStepTime += stepDur;
      this.stepIndex = (this.stepIndex + 1) % totalSteps;
    }
  }

  scheduleVoiceNote(seq, idx, time, stepDur, waveType, gainLevel) {
    const token = seq[idx];
    if (!token || token === "-" || token === "R") return;
    const freq = NOTE_HZ[token];
    if (!freq) return;

    let hold = 1;
    while (idx + hold < seq.length && seq[idx + hold] === "-") {
      hold++;
    }
    const dur = stepDur * hold * 0.94;

    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = waveType;
    osc.frequency.setValueAtTime(freq, time);

    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(gainLevel, time + 0.009);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, gainLevel * 0.56), time + dur * 0.84);
    g.gain.linearRampToValueAtTime(0.0001, time + dur);

    osc.connect(g);
    g.connect(this.musicGain);
    osc.start(time);
    osc.stop(time + dur + 0.01);
  }

  /** Pad armonico: accordo tenuto e morbido (2 oscillatori leggermente scordati). */
  schedulePadNote(seq, idx, time, stepDur) {
    const token = seq[idx];
    if (!token || token === "-" || token === "R") return;
    const freq = NOTE_HZ[token];
    if (!freq) return;
    let hold = 1;
    while (idx + hold < seq.length && seq[idx + hold] === "-") hold++;
    const dur = stepDur * hold * 2.2; // il pad "sborda" dolcemente sotto la melodia
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(0.055, time + dur * 0.35);
    g.gain.linearRampToValueAtTime(0.0001, time + dur);
    g.connect(this.musicGain);
    for (const detune of [-6, 6]) {
      const osc = this.ctx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freq, time);
      osc.detune.setValueAtTime(detune, time);
      const lp = this.ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(1400, time);
      osc.connect(lp);
      lp.connect(g);
      osc.start(time);
      osc.stop(time + dur + 0.02);
    }
  }

  /** Arpeggio di ottavi costruito sull'accordo del basso: dà movimento ritmico. */
  scheduleArpeggio(track, idx, time, stepDur) {
    const bass = track.bass[idx];
    if (!bass || bass === "-" || bass === "R") return;
    const freq = NOTE_HZ[bass];
    if (!freq) return;
    // terza e quinta prendendo l'armonia corrente come riferimento
    const harm = NOTE_HZ[track.harm[idx]] || freq * 2;
    const pattern = [freq * 2, harm, freq * 4, harm];
    pattern.forEach((f, i) => {
      const t = time + i * (stepDur / 2);
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.038, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + stepDur * 0.4);
      osc.connect(g);
      g.connect(this.musicGain);
      osc.start(t);
      osc.stop(t + stepDur * 0.45);
    });
  }

  scheduleDrum(symbol, time) {
    if (!symbol || symbol === ".") return;
    if (symbol === "K") {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(142, time);
      osc.frequency.exponentialRampToValueAtTime(42, time + 0.075);
      g.gain.setValueAtTime(0.3, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
      osc.connect(g);
      g.connect(this.musicGain);
      osc.start(time);
      osc.stop(time + 0.085);
    } else if ((symbol === "S" || symbol === "h") && this.noiseBuffer) {
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = symbol === "S" ? "bandpass" : "highpass";
      filter.frequency.setValueAtTime(symbol === "S" ? 1800 : 5600, time);
      const g = this.ctx.createGain();
      const dur = symbol === "S" ? 0.072 : 0.026;
      g.gain.setValueAtTime(symbol === "S" ? 0.15 : 0.065, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + dur);
      src.connect(filter);
      filter.connect(g);
      g.connect(this.musicGain);
      src.start(time);
      src.stop(time + dur + 0.01);
    }
  }

  /**
   * Sintetizzatore Pianoforte a Coda Cromatico per Francesco (accetta indice 0..7 oppure nota es. "Eb4", "F#4", "C5")
   */
  playPianoNote(noteOrScaleIdx, duration = 0.45) {
    if (!this.ctx || this.muted) return;
    let noteName = "C4";
    if (typeof noteOrScaleIdx === "string") {
      noteName = noteOrScaleIdx;
    } else {
      const item = PIANO_SCALE[Math.max(0, Math.min(PIANO_SCALE.length - 1, noteOrScaleIdx))];
      noteName = item ? item.note : "C4";
    }
    const freq = NOTE_HZ[noteName] || 261.63;
    const now = this.ctx.currentTime;

    const osc1 = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    const g2 = this.ctx.createGain();

    osc1.type = "triangle";
    osc2.type = "sine";
    osc1.frequency.setValueAtTime(freq, now);
    osc2.frequency.setValueAtTime(freq * 2, now);

    g2.gain.setValueAtTime(0.22, now);
    g2.gain.exponentialRampToValueAtTime(0.008, now + duration * 0.65);

    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.56, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, now + duration);

    osc1.connect(g);
    osc2.connect(g2);
    g2.connect(g);
    g.connect(this.sfxGain);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + duration + 0.025);
    osc2.stop(now + duration + 0.025);
  }

  playSfx(type, customFreq = 320) {
    if (!this.ctx || this.muted) return;
    if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
    const now = this.ctx.currentTime;

    const tone = (f0, f1, dur, wave = "square", vol = 0.36, delay = 0) => {
      const t = now + delay;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(25, f1), t + dur);
      }
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g);
      g.connect(this.sfxGain);
      osc.start(t);
      osc.stop(t + dur + 0.01);
    };

    switch (type) {
      case "jump":
        tone(215, 585, 0.12, "square", 0.32);
        break;
      case "land":
        tone(135, 62, 0.05, "triangle", 0.26);
        break;
      case "collect":
        tone(587.33, 587.33, 0.048, "square", 0.28);
        tone(880.0, 880.0, 0.085, "square", 0.3, 0.048);
        break;
      case "pegaso":
        [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) =>
          tone(f, f, 0.08, "triangle", 0.38, i * 0.055)
        );
        break;
      case "damage":
        tone(260, 78, 0.2, "sawtooth", 0.42);
        break;
      case "interact":
        tone(440, 660, 0.07, "triangle", 0.3);
        break;
      case "confirm":
        tone(523.25, 783.99, 0.085, "triangle", 0.32);
        break;
      case "blip":
        tone(customFreq, customFreq * 1.05, 0.03, "triangle", 0.16);
        break;
      case "correct":
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
          tone(f, f, 0.075, "triangle", 0.38, i * 0.052)
        );
        break;
      case "wrong":
        tone(277.18, 233.08, 0.11, "sawtooth", 0.34, 0);
        tone(220.0, 164.81, 0.18, "sawtooth", 0.36, 0.11);
        break;
      case "door":
        [196, 261.63, 329.63, 392].forEach((f, i) =>
          tone(f, f, 0.065, "triangle", 0.36, i * 0.052)
        );
        break;
      case "mechanism":
        tone(330, 660, 0.075, "triangle", 0.3, 0);
        tone(440, 880, 0.095, "triangle", 0.3, 0.068);
        break;
      case "basket_bounce":
        tone(235, 98, 0.085, "triangle", 0.4);
        break;
      case "basket_swish":
        tone(784, 1175, 0.1, "triangle", 0.36, 0);
        tone(1046.5, 1318.5, 0.13, "triangle", 0.34, 0.065);
        break;
      case "sprint_dash":
      case "football_kick":
        tone(240, 680, 0.085, "triangle", 0.36, 0);
        tone(520, 320, 0.07, "square", 0.24, 0.04);
        break;
      case "hurdle_clear":
      case "goal":
        [587.33, 783.99, 987.77, 1174.66].forEach((f, i) =>
          tone(f, f, 0.085, "triangle", 0.38, i * 0.055)
        );
        break;
      case "salsa_step":
      case "diag_pulse":
        // Conga + clave sintetica: il suono ritmico di Daniele
        tone(523.25, 1046.5, 0.06, "triangle", 0.3, 0);
        tone(1760, 1320, 0.045, "square", 0.16, 0.02);
        tone(783.99, 1174.66, 0.07, "sine", 0.22, 0.05);
        break;
      case "clave":
        tone(2200, 1900, 0.035, "square", 0.18);
        break;
      case "telegraph":
        tone(440, 554.37, 0.055, "triangle", 0.2);
        break;
      case "resonance":
        this.playPianoNote("C4", 0.3);
        setTimeout(() => this.playPianoNote("E4", 0.3), 42);
        setTimeout(() => this.playPianoNote("G4", 0.36), 84);
        break;
      case "stomp":
        tone(180, 420, 0.095, "square", 0.34);
        break;
      case "assist":
        [392.0, 523.25, 659.25, 783.99].forEach((f, i) =>
          tone(f, f * 1.03, 0.06, "triangle", 0.34, i * 0.038)
        );
        break;
      case "portal":
        tone(320, 640, 0.1, "triangle", 0.34, 0);
        tone(480, 960, 0.11, "triangle", 0.26, 0.055);
        break;
      case "midboss_hit":
        tone(140, 65, 0.13, "sawtooth", 0.4, 0);
        tone(420, 210, 0.085, "square", 0.28, 0.03);
        break;
      default:
        tone(440, 440, 0.05, "triangle", 0.22);
    }
  }

  playCharMotif(charId) {
    if (!this.ctx || this.muted) return;
    if (charId === "carlo") {
      this.playSfx("blip", 329.63);
      setTimeout(() => this.playSfx("blip", 440.0), 42);
      setTimeout(() => this.playSfx("blip", 523.25), 84);
    } else if (charId === "ranaldo") {
      this.playSfx("blip", 261.63);
      setTimeout(() => this.playSfx("blip", 392.0), 45);
    } else if (charId === "daniele") {
      this.playSfx("blip", 392.0);
      setTimeout(() => this.playSfx("blip", 587.33), 42);
    } else if (charId === "ruggero") {
      this.playSfx("blip", 349.23);
      setTimeout(() => this.playSfx("blip", 523.25), 38);
      setTimeout(() => this.playSfx("blip", 659.25), 76);
    } else if (charId === "francesco") {
      this.playPianoNote("E4", 0.2);
      setTimeout(() => this.playPianoNote("G4", 0.24), 48);
    }
  }
}


// === MODULE: src/config/input.js ===
// Gestore Input Unificato v3.0: Tastiera + Gamepad + Controlli Touch Essenziali (5 Personaggi)
class InputController {
  constructor(onAnyInteraction) {
    this.keys = new Set();
    this.justPressed = new Set();
    this.onAnyInteraction = onAnyInteraction;

    this.left = false;
    this.right = false;
    this.up = false;
    this.down = false;
    this.jumpDown = false;
    this.specialDown = false;

    this.leftPressed = false;
    this.rightPressed = false;
    this.upPressed = false;
    this.downPressed = false;
    this.jumpPressed = false;
    this.specialPressed = false;
    this.assistPressed = false;
    this.interactPressed = false;
    this.confirmPressed = false;
    this.pausePressed = false;
    this.mutePressed = false;
    this.crtTogglePressed = false;
    this.switchCyclePressed = false;
    this.replayPressed = false;
    this.quickResetPressed = false;
    this.numberPressed = 0; // 1..8
    this.fullscreenPressed = false;
    this.helpPressed = false;
    this.teamTogglePressed = false;

    this._prevGpButtons = [];
    this.bindEvents();
  }

  bindEvents() {
    // I test girano in Node senza DOM: se manca window si salta il binding.
    if (typeof window === "undefined" || !window.addEventListener) return;
    window.addEventListener("keydown", (e) => {
      if (this.onAnyInteraction) this.onAnyInteraction();
      const code = e.code;
      if (
        ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Tab", "F9"].includes(code)
      ) {
        e.preventDefault();
      }
      if (!this.keys.has(code)) {
        this.justPressed.add(code);
      }
      this.keys.add(code);
    });

    window.addEventListener("keyup", (e) => {
      this.keys.delete(e.code);
    });

    window.addEventListener("blur", () => {
      this.keys.clear();
      this.justPressed.clear();
    });

    window.addEventListener("pointerdown", () => {
      if (this.onAnyInteraction) this.onAnyInteraction();
    });

    window.addEventListener(
      "touchstart",
      () => {
        if (this.onAnyInteraction) this.onAnyInteraction();
      },
      { passive: true }
    );

    window.addEventListener(
      "touchend",
      () => {
        if (this.onAnyInteraction) this.onAnyInteraction();
      },
      { passive: true }
    );
  }

  setVirtualAction(action, isDown) {
    if (this.onAnyInteraction && isDown) this.onAnyInteraction();
    const map = {
      left: "ArrowLeft",
      right: "ArrowRight",
      up: "ArrowUp",
      down: "ArrowDown",
      jump: "Space",
      special: "KeyX",
      interact: "KeyE",
      assist: "KeyC",
      pause: "KeyP",
      switch: "KeyQ",
      replay: "KeyR",
      crt: "KeyV",
      hero1: "Digit1",
      hero2: "Digit2",
      hero3: "Digit3",
      hero4: "Digit4",
      hero5: "Digit5",
    };
    const code = map[action];
    if (!code) return;
    if (isDown) {
      if (!this.keys.has(code)) {
        this.justPressed.add(code);
      }
      this.keys.add(code);
    } else {
      this.keys.delete(code);
    }
  }

  pulseVirtualAction(action) {
    if (this.onAnyInteraction) this.onAnyInteraction();
    const map = {
      interact: "KeyE",
      confirm: "Enter",
      jump: "Space",
      special: "KeyX",
      assist: "KeyC",
      pause: "KeyP",
      switch: "KeyQ",
      replay: "KeyR",
      crt: "KeyV",
      hero1: "Digit1",
      hero2: "Digit2",
      hero3: "Digit3",
      hero4: "Digit4",
      hero5: "Digit5",
    };
    const code = map[action];
    if (code) this.justPressed.add(code);
  }

  clearVirtualDirections() {
    this.keys.delete("ArrowLeft");
    this.keys.delete("ArrowRight");
    this.keys.delete("ArrowUp");
    this.keys.delete("ArrowDown");
  }

  poll() {
    const k = this.keys;
    const jp = this.justPressed;

    let gpLeft = false,
      gpRight = false,
      gpUp = false,
      gpDown = false,
      gpJump = false,
      gpSpec = false,
      gpJumpJust = false,
      gpSpecJust = false,
      gpAssistJust = false,
      gpIntJust = false,
      gpPauseJust = false,
      gpSwitchJust = false;

    const pads = typeof navigator !== "undefined" && navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = pads && pads[0];
    if (gp) {
      const axX = gp.axes[0] || 0;
      const axY = gp.axes[1] || 0;
      gpLeft = axX < -0.4 || !!gp.buttons[14]?.pressed;
      gpRight = axX > 0.4 || !!gp.buttons[15]?.pressed;
      gpUp = axY < -0.4 || !!gp.buttons[12]?.pressed;
      gpDown = axY > 0.4 || !!gp.buttons[13]?.pressed;
      gpJump = !!gp.buttons[0]?.pressed;
      gpSpec = !!gp.buttons[2]?.pressed || !!gp.buttons[1]?.pressed;

      const curBtns = gp.buttons.map((b) => !!b.pressed);
      const was = (idx) => !!this._prevGpButtons[idx];
      if (curBtns[0] && !was(0)) gpJumpJust = true;
      if ((curBtns[2] && !was(2)) || (curBtns[1] && !was(1))) gpSpecJust = true;
      if (curBtns[5] && !was(5)) gpAssistJust = true;
      if (curBtns[3] && !was(3)) gpIntJust = true;
      if (curBtns[9] && !was(9)) gpPauseJust = true;
      if (curBtns[4] && !was(4)) gpSwitchJust = true;
      this._prevGpButtons = curBtns;

    this.left = k.has("ArrowLeft") || k.has("KeyA") || gpLeft;
    this.right = k.has("ArrowRight") || k.has("KeyD") || gpRight;
    // "up" = direzione pura (angoli, vertici, corsie). Il vecchio tasto virtuale "salto" resta distinto.
    this.up = k.has("ArrowUp") || k.has("KeyW") || gpUp;
    this.down = k.has("ArrowDown") || k.has("KeyS") || gpDown;

    this.jumpDown = k.has("Space") || k.has("KeyZ") || gpJump;
    this.specialDown =
      k.has("KeyX") || k.has("KeyK") || k.has("ShiftLeft") || k.has("ShiftRight") || gpSpec;

    this.leftPressed = jp.has("ArrowLeft") || jp.has("KeyA");
    this.rightPressed = jp.has("ArrowRight") || jp.has("KeyD");
    this.upPressed = jp.has("ArrowUp") || jp.has("KeyW");
    this.downPressed = jp.has("ArrowDown") || jp.has("KeyS");

    this.jumpPressed = jp.has("Space") || jp.has("KeyZ") || gpJumpJust;
    this.specialPressed =
      jp.has("KeyX") || jp.has("KeyK") || jp.has("ShiftLeft") || jp.has("ShiftRight") || gpSpecJust;
    this.assistPressed = jp.has("KeyC") || jp.has("KeyL") || gpAssistJust;
    this.interactPressed = jp.has("KeyE") || jp.has("Enter") || jp.has("KeyF") || gpIntJust;
    this.confirmPressed = jp.has("Enter") || jp.has("Space") || jp.has("KeyE") || gpJumpJust;
    // --- SCORCIATOIE GLOBALI (una sola definizione: nessun comando senza tasto) ---
    this.pausePressed = jp.has("KeyP") || jp.has("Escape") || gpPauseJust; // P / ESC / START
    this.mutePressed = jp.has("KeyM");                                       // M
    this.crtTogglePressed = jp.has("KeyV");                                  // V
    this.switchCyclePressed = jp.has("KeyQ") || jp.has("Tab") || gpSwitchJust; // Q / TAB / LB
    this.replayPressed = jp.has("KeyR");                                     // R (Riascolta)
    this.quickResetPressed = jp.has("F9");                                   // F9
    this.fullscreenPressed = jp.has("KeyY");                                 // Y = schermo intero
    this.helpPressed = jp.has("F1") || jp.has("Slash") || jp.has("NumpadDivide"); // F1 / ?  -> guida comandi
    this.teamTogglePressed = jp.has("KeyG");                                 // G -> squadra al seguito

    this.numberPressed = 0;
    for (let n = 1; n <= 8; n++) {
      if (jp.has(`Digit${n}`) || jp.has(`Numpad${n}`)) {
        this.numberPressed = n;
        break;
      }
    }

    this.justPressed.clear();
  }
}

// Precompila ogni glifo in una lista di rettangoli orizzontali [rx, ry, rw] per rendering ultra-rapido
const COMPILED_GLYPHS = {};
for (const [ch, rows] of Object.entries(GLYPHS_5X7)) {
  const runs = [];
  for (let ry = 0; ry < rows.length; ry++) {
    const line = rows[ry];
    let rx = 0;
    while (rx < line.length) {
      if (line[rx] === "1") {
        let rw = 1;
        while (rx + rw < line.length && line[rx + rw] === "1") rw++;
        runs.push([rx, ry, rw]);
        rx += rw;
      } else {
        rx++;
      }
    }
  }
  COMPILED_GLYPHS[ch] = runs;
}

/** Larghezza reale in pixel (glifo 5px + 1px di spaziatura). */
/** Risolve un carattere nel glifo giusto: mai un "?" al posto di una lettera accentata. */
function resolveGlyph(ch) {
  if (COMPILED_GLYPHS[ch]) return COMPILED_GLYPHS[ch];
  const lower = ch.toLowerCase();
  if (COMPILED_GLYPHS[lower]) return COMPILED_GLYPHS[lower];
  const upper = ch.toUpperCase();
  if (COMPILED_GLYPHS[upper]) return COMPILED_GLYPHS[upper];
  // Accentate e lettere speciali -> lettera base senza segno diacritico
  const base = ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  if (COMPILED_GLYPHS[base]) return COMPILED_GLYPHS[base];
  if (COMPILED_GLYPHS[base.toUpperCase()]) return COMPILED_GLYPHS[base.toUpperCase()];
  if (COMPILED_GLYPHS[base.toLowerCase()]) return COMPILED_GLYPHS[base.toLowerCase()];
  return COMPILED_GLYPHS["?"];
}
function measurePixelText(text, scale = 1) {
  const str = String(text ?? "");
  if (!str.length) return 0;
  return (str.length * 6 - 1) * scale;
}

/**
 * Manda a capo il testo in base ai pixel disponibili.
 * `hyphenate = true` spezza anche le parole troppo lunghe per la riga
 * (così niente più testo tagliato fuori dal pannello).
 */
function wrapPixelText(text, maxWidthPx, scale = 1, hyphenate = true) {
  const limit = Math.max(6 * scale, Math.floor(maxWidthPx));
  const maxChars = Math.max(1, Math.floor((limit + scale) / (6 * scale)));
  const words = String(text ?? "").split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = "";

  const pushWord = (w) => {
    if (!w) return;
    const test = cur ? `${cur} ${w}` : w;
    if (measurePixelText(test, scale) <= limit) {
      cur = test;
      return;
    }
    if (cur) {
      lines.push(cur);
      cur = "";
    }
    let rest = w;
    while (rest.length > maxChars) {
      if (!hyphenate) break;
      lines.push(`${rest.slice(0, maxChars - 1)}-`);
      rest = rest.slice(maxChars - 1);
    }
    cur = rest;
  };

  for (const w of words) pushWord(w);
  if (cur) lines.push(cur);
  return lines.length ? lines : [""];
}

/**
 * Testo con "coda" centrata: restituisce le righe che ci stanno davvero
 * nell'altezza disponibile, senza mai lasciare metà pannello vuoto.
 */
function fitPixelText(text, maxWidthPx, maxLines, scale = 1) {
  const lines = wrapPixelText(text, maxWidthPx, scale, true);
  if (lines.length <= maxLines) return lines;
  const kept = lines.slice(0, maxLines);
  const lastIdx = kept.length - 1;
  const lastMax = Math.max(6 * scale, Math.floor(maxWidthPx));
  const budget = Math.max(1, Math.floor((lastMax + scale) / (6 * scale)));
  let last = kept[lastIdx];
  if (last.length > budget - 1) last = last.slice(0, budget - 1);
  kept[lastIdx] = `${last.replace(/[\s,-]+$/, "")}…`;
  return kept;
}

/** Riduce automaticamente la scala finché il testo entra nello spazio dato. */
function autoScaleFor(text, maxWidthPx, baseScale = 1, minScale = 1) {
  let scale = baseScale;
  while (scale > minScale && wrapPixelText(text, maxWidthPx / scale, 1, false).length > 1) {
    scale -= 1;
  }
  return Math.max(minScale, scale);
}

/** true se il carattere ha un glifo proprio o risolvibile (accenti comprese). */
/** Vero solo se il carattere ha davvero un glifo disegnabile (niente quadratini vuoti). */
function glyphAvailable(ch) {
  if (!ch || ch === " ") return true;
  if (COMPILED_GLYPHS[ch]) return true;
  const lower = ch.toLowerCase();
  const upper = ch.toUpperCase();
  const base = ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return !!(
    COMPILED_GLYPHS[lower] ||
    COMPILED_GLYPHS[upper] ||
    (base !== ch && (COMPILED_GLYPHS[base] || COMPILED_GLYPHS[base.toUpperCase()]))
  );
}

/** Elenca i caratteri di un testo che il font non sa disegnare (usato dai QA). */
function missingGlyphs(text) {
  const out = new Set();
  for (const ch of text) if (!glyphAvailable(ch)) out.add(ch);
  return [...out];
}

/**
 * Disegna testo bitmap 8-bit nitidissimo al pixel (coordinate top-left x, y).
 */
function drawPixelText(ctx, text, x, y, color = "#f8fafc", scale = 1, shadowColor = "#090d1a") {
  const str = String(text ?? "");
  if (!str) return;
  const ix = Math.round(x);
  const iy = Math.round(y);
  const step = 6 * scale;

  if (shadowColor) {
    ctx.fillStyle = shadowColor;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      const runs = resolveGlyph(ch);
      const gx = ix + i * step + 1;
      const gy = iy + 1;
      for (let r = 0; r < runs.length; r++) {
        const [rx, ry, rw] = runs[r];
        ctx.fillRect(gx + rx * scale, gy + ry * scale, rw * scale, scale);
      }
    }
  }

  ctx.fillStyle = color;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    const runs = resolveGlyph(ch);
    const gx = ix + i * step;
    for (let r = 0; r < runs.length; r++) {
      const [rx, ry, rw] = runs[r];
      ctx.fillRect(gx + rx * scale, iy + ry * scale, rw * scale, scale);
    }
  }
}
function drawPixelTextCentered(ctx, text, centerX, y, color = "#f8fafc", scale = 1, shadowColor = "#090d1a") {
  const w = measurePixelText(text, scale);
  drawPixelText(ctx, text, Math.round(centerX - w / 2), y, color, scale, shadowColor);
}

/**
 * Disegna una cornice arcade pixel-art a doppio bordo smussato 8-bit!
 */
function drawPixelPanel(ctx, x, y, w, h, bg = "rgba(11, 17, 32, 0.94)", border = "#ffd147", inner = "#1e293b") {
  const rx = Math.round(x);
  const ry = Math.round(y);
  const rw = Math.round(w);
  const rh = Math.round(h);
  // Ombra solida pixel
  ctx.fillStyle = "rgba(4, 7, 15, 0.78)";
  ctx.fillRect(rx + 3, ry + 3, rw, rh);
  // Bordo esterno
  ctx.fillStyle = "#090d1a";
  ctx.fillRect(rx, ry, rw, rh);
  ctx.fillStyle = border;
  ctx.fillRect(rx + 1, ry + 1, rw - 2, rh - 2);
  // Bordo interno + sfondo
  ctx.fillStyle = inner;
  ctx.fillRect(rx + 3, ry + 3, rw - 6, rh - 6);
  ctx.fillStyle = bg;
  ctx.fillRect(rx + 4, ry + 4, rw - 8, rh - 8);
  // Rivetti angolari 8-bit
  ctx.fillStyle = border;
  ctx.fillRect(rx + 3, ry + 3, 2, 2);
  ctx.fillRect(rx + rw - 5, ry + 3, 2, 2);
  ctx.fillRect(rx + 3, ry + rh - 5, 2, 2);
  ctx.fillRect(rx + rw - 5, ry + rh - 5, 2, 2);
}
