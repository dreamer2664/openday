      } else if (pr.kind === "music_note") {
        drawPixelText(ctx, "♪", px - 3, py - 4, "#38e2d8", 1);
      } else if (pr.kind === "golden_compass") {
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(px - 5, py - 5, 10, 10);
        ctx.fillStyle = "#fde047";
        ctx.fillRect(px - 4, py - 4, 8, 2);
        ctx.fillRect(px - 4, py - 4, 2, 8);
        ctx.fillRect(px - 2, py - 2, 4, 4);
      } else if (pr.kind === "harmonic_wave") {
        ctx.strokeStyle = "#38e2d8";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, py, pr.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 1;
      } else if (pr.kind === "sound_ring") {
        ctx.strokeStyle = "#f472b6";
        ctx.lineWidth = 2;
        ctx.strokeRect(px - 5, py - 7, 10, 14);
        ctx.lineWidth = 1;
      } else if (pr.kind === "enemy_orb") {
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(px - 5, py - 5, 10, 10);
        ctx.fillStyle = "#e879f9";
        ctx.fillRect(px - 4, py - 4, 8, 8);
        ctx.fillStyle = "#22d3ee";
        ctx.fillRect(px - 2, py - 2, 4, 4);
      }
    }
  }
}


// === MODULE: src/ui/hudAndMenus.js ===
// Interfaccia Utente Pixel-Art v2.0: Font Bitmap 8-Bit, Ritratti 64x64 a 6 Espressioni,
// Notifiche Stile Telltale, Banter in Tempo Reale, Postazioni Interattive EIPASS e Filtro CRT Arcade!




// Ordine righe del portraits_sheet.png (8 righe x 6 espressioni, 64x64):
// generato da tools/generate_assets.py -> ["ranaldo","carlo","francesco","ruggero","daniele","sofista","sofia","mimmo"]
const PORTRAIT_ROWS = {
  ranaldo: 0,
  carlo: 1,
  francesco: 2,
  ruggero: 3,
  daniele: 4,
  sofista: 5,
  sofia: 6,
  mimmo: 7,
};

const SPEAKER_NAMES = {
  ranaldo: "PROF. RANALDO (Matematica)",
  carlo: "CARLO (Basket)",
  francesco: "FRANCESCO (Pianoforte)",
  ruggero: "RUGGERO (Atletica Leggera)",
  daniele: "DANIELE (Ballerino Latino-Americano)",
  sofista: "IL SOFISTA DIGITALE 404-Ω",
  sofia: "SOFIA (Caporedattrice Pegaso)",
  mimmo: "MIMMO (Collaboratore Storico)",
};

// L'HUD segue l'ordine ufficiale (CHAR_ORDER): tasto mostrato == tasto che risponde.
const HUD_SLOT_ORDER = CHAR_ORDER;
class UIManager {
  constructor(spriteImages) {
    // true quando il controller touch è visibile sopra il canvas (orizzontale): riserva l'angolo
    this.touchSafe = false;
    this.imgs = spriteImages;
    this.bannerText = "";
    this.bannerSub = "";
    this.bannerTimer = 0;
    this.tick = 0;
  }

  showRoomBanner(title, subtitle = "") {
    this.bannerText = title;
    this.bannerSub = subtitle;
    this.bannerTimer = 185;
  }

  // ===========================================================================
  // MENU PRINCIPALE — FACCIATA VIVA + 4 PROTAGONISTI ANIMATI + PULSANTI ARCADE
  // ===========================================================================
  renderTitleMenu(ctx, renderer, menuIndex, options, audio, _hasSave) {
    // tick del titolo: avanzato in stepHUD (animazione costante a 60 Hz su ogni schermo)
    // Centra perfettamente la vista sulle due grandi colonne bianche e sul portale di Via d'Aragona 100!
    renderer.drawEnvironmentBackground(ctx, "facade", Math.sin(this.tick * 0.007) * 14, 0);

    // 1. Marquee Superiore Compatta: lascia 100% visibili colonne, bandiere IT/UE e portale!
    drawPixelPanel(ctx, 14, 5, SCREEN_W - 28, 49, "rgba(9, 14, 28, 0.93)", "#ffd147", "#1e3a8a");
    drawPixelTextCentered(ctx, "OPERAZIONE EIPASS", SCREEN_W / 2, 11, "#ffd147", 2);
    drawPixelTextCentered(
      ctx,
      "★ IL CASARDI IN 8 BIT • Liceo 'A. Casardi' Barletta ★",
      SCREEN_W / 2,
      30,
      "#38bdf8",
      1
    );
    drawPixelTextCentered(
      ctx,
      `Carlo • Ranaldo • Daniele • Ruggero • Francesco   ${GAME_VERSION}`,
      SCREEN_W / 2,
      42,
      "#fde047",
      1
    );

    // 2. Pedana in basso a sinistra con i 5 Protagonisti 32x36 animati
    drawPixelPanel(ctx, 6, 176, 178, 70, "rgba(11, 17, 32, 0.91)", "#ffd147", "#1e293b");
    drawPixelTextCentered(ctx, "SQUADRA DEL CASARDI", 95, 180, "#fde047", 1);
    if (this.imgs.characters) {
      const pose = Math.floor(this.tick / 14) % 4;
      // 5 sprite da 26px dentro un pannello largo 178: 5*26 = 130px, sempre dentro
      const slotW = 26;
      const squadW = CHAR_ORDER.length * slotW;
      const startX = 6 + Math.max(4, Math.round((178 - squadW) / 2));
      CHAR_ORDER.forEach((cid, i) => {
        const meta = CHARACTERS[cid];
        ctx.drawImage(
          this.imgs.characters,
          pose * CHAR_SPRITE_W,
          meta.row * CHAR_SPRITE_H,
          CHAR_SPRITE_W,
          CHAR_SPRITE_H,
          startX + i * slotW,
          190,
          CHAR_SPRITE_W,
          CHAR_SPRITE_H
        );
      });
      // Sigle allineate SOTTO il proprio sprite, nell'ordine reale dei 5 slot
      CHAR_ORDER.forEach((cid, i) => {
        const sig = CHARACTERS[cid].shortName.slice(0, 3).toUpperCase();
        const cx = startX + i * slotW + slotW / 2;
        drawPixelText(ctx, sig, Math.round(cx - measurePixelText(sig, 1) / 2), 230, CHARACTERS[cid].color || "#cbd5e1", 1);
      });
    }

    // 3. Pannello Selezione Modalità compatto in basso a destra (lascia respirare tutta la facciata!)
    // Il pannello si dimensiona sul numero REALE di voci: nessuna voce fuori cornice
    const PANEL_X = 190;
    const PANEL_W = SCREEN_W - PANEL_X - 6;
    const stepH = 27;
    const panelH = Math.min(SCREEN_H - 24, 8 + options.length * stepH + 4);
    const panelY = SCREEN_H - 20 - panelH - 3;
    drawPixelPanel(ctx, PANEL_X - 6, panelY, PANEL_W + 6, panelH, "rgba(11, 17, 32, 0.93)", "#38bdf8", "#1e293b");

    const labelMaxW = PANEL_W - 24;
    const subMaxW = PANEL_W - 32;

    options.forEach((opt, idx) => {
      const y = panelY + 5 + idx * stepH;
      const sel = idx === menuIndex;
      const isOpenDayBtn = opt.id === "openday";

      const bg = sel ? (isOpenDayBtn ? "#c2410c" : "#0369a1") : isOpenDayBtn ? "#431407" : "#162038";
      const brd = sel ? "#ffd147" : isOpenDayBtn ? "#fb923c" : "#475569";
      drawPixelPanel(ctx, PANEL_X, y, PANEL_W - 4, stepH - 2, bg, brd, "#0f172a");

      // Etichetta e sottotitolo si adattano ai pixel disponibili (con "…" se serve)
      const pre = `${sel ? "▶ " : "  "}`;
      const label = `${pre}${opt.label}`;
      const maxChars = Math.max(10, Math.floor((labelMaxW + 1) / 6));
      drawPixelText(
        ctx,
        label.length > maxChars ? `${label.slice(0, maxChars - 1).trimEnd()}…` : label,
        PANEL_X + 6,
        y + 3,
        sel ? "#ffffff" : "#e2e8f0",
        1
      );
      drawPixelText(ctx, fitPixelText(opt.sub, subMaxW, 1, 1)[0], PANEL_X + 14, y + 13, sel ? "#fef08a" : "#94a3b8", 1);
    });

    // Barra inferiore stato audio & tasti rapidi Open Day
    ctx.fillStyle = "rgba(7, 10, 20, 0.96)";
    ctx.fillRect(0, SCREEN_H - 20, SCREEN_W, 20);
    ctx.fillStyle = "#ffd147";
    ctx.fillRect(0, SCREEN_H - 20, SCREEN_W, 1);
    const audioStr = audio.muted ? "[M] AUDIO:OFF" : "♪ [M] AUDIO:ON";
    drawPixelText(
      ctx,
      `FRECCE+INVIO: Avvia | ${audioStr} | [V] CRT | [F9] Reset Open Day`,
      14,
      SCREEN_H - 13,
      "#fde047",
      1
    );
  }

  // ===========================================================================
  // HUD IN PARTITA + NOTIFICHE TELLTALE + BANTER DI SQUADRA
  // ===========================================================================
  /**
   * Avanzamento temporale del HUD: va chiamato SOLO dallo step fisso a 60 Hz.
   * (Prima tick/banner/notifiche avanzavano ad ogni frame: a 120/144 Hz andavano al doppio.)
   */
  stepHUD(state) {
    this.tick++;
    for (let i = state.consequenceQueue.length - 1; i >= 0; i--) {
      state.consequenceQueue[i].ttl--;
      if (state.consequenceQueue[i].ttl <= 0) state.consequenceQueue.splice(i, 1);
    }
    if (this.bannerTimer > 0) this.bannerTimer--;
  }

  renderHUD(ctx, state, world, audio) {
    const d = state.data;

    // Fascia HUD superiore
    ctx.fillStyle = "rgba(9, 13, 26, 0.94)";
    ctx.fillRect(0, 0, SCREEN_W, 27);
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(0, 26, SCREEN_W, 1);

    // Energia (Cuori scolpiti) + Scudo
    for (let i = 0; i < d.maxHp; i++) {
      const hx = 7 + i * 13;
      const full = i < d.hp;
      ctx.fillStyle = "#090d1a";
      ctx.fillRect(hx - 1, 6, 12, 11);
      ctx.fillStyle = full ? "#ef4444" : "#334155";
      ctx.fillRect(hx, 7, 4, 4);
      ctx.fillRect(hx + 6, 7, 4, 4);
      ctx.fillRect(hx, 9, 10, 4);
      ctx.fillRect(hx + 2, 13, 6, 2);
      ctx.fillRect(hx + 4, 15, 2, 1);
      if (full) {
        ctx.fillStyle = "#fecaca";
        ctx.fillRect(hx + 1, 8, 2, 2);
      }
    }
    // §4.1: il contatore scudo finiva SOTTO il riquadro dell'eroe attivo (con 5 cuori
    // il testo partiva da x=73 e le pillole da x=94). Ora sta su una micro-riga dedicata
    // sotto i cuori (y=18), dove c'è spazio reale e non si sovrappone a niente.
    if (d.shield > 0) {
      drawPixelText(ctx, `SCUDO x${d.shield}`, 7, 18, "#38bdf8", 1);
    }

    // Selettore rapido dei Protagonisti: 1=Carlo, 2=Ranaldo, poi gli altri acquisiti.
    // Lo stesso ordine usato dai tasti numerici (main.heroSlotOrder), così non si sfalsano.
    const baseOrder = HERO_BASE_ORDER;
    const rosterKey = (d.unlockedChars || []).join(",");
    if (this._rosterCacheKey !== rosterKey) {
      this._rosterCacheKey = rosterKey;
      this._rosterOrder = baseOrder.concat(
        (d.unlockedChars || []).filter((c) => !baseOrder.includes(c) && CHARACTERS[c])
      );
    }
    const slotOrder = this._rosterOrder;
    const SLOT_W = 42;
    const SLOT_PITCH = 45;
    const SLOT_X0 = 94;
    slotOrder.forEach((cid, idx) => {
      const unlocked = d.unlockedChars.includes(cid);
      const active = d.activeChar === cid;
      const meta = CHARACTERS[cid];
      const sx = SLOT_X0 + idx * SLOT_PITCH;

      ctx.fillStyle = active ? meta.accent : unlocked ? "#1e293b" : "#0f172a";
      ctx.fillRect(sx, 3, SLOT_W, 20);
      ctx.strokeStyle = active ? meta.color : unlocked ? "#475569" : "#1e293b";
      ctx.strokeRect(sx, 3, SLOT_W, 20);

      const label = unlocked ? `${idx + 1}:${meta.shortName.slice(0, 3)}` : `${idx + 1}:??`;
      drawPixelText(ctx, label, sx + 2, 6, unlocked ? (active ? "#ffffff" : "#cbd5e1") : "#475569", 1);
      if (world && unlocked && !active) {
        // hint discreto: le pillole degli altri compagni si possono cliccare col mouse
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(sx + 3, 21, SLOT_W - 6, 1);
      }

      if (active && world) {
        const ratio = Math.max(0, 1 - world.player.cooldown / meta.cooldownMax);
        ctx.fillStyle = meta.color;
        ctx.fillRect(sx + 2, 18, Math.round((SLOT_W - 4) * ratio), 3);
      }
    });

    // Indicatore Assist [C]
    if (world) {
      const assistReady = world.player.assistCooldown <= 0 && d.unlockedChars.length > 1;
      drawPixelText(ctx, assistReady ? "[C]OK" : "[C]..", 320, 5, assistReady ? "#4ade80" : "#64748b", 1);
    }

    // Indicatori EIPASS, Pegaso e Punti
    const totalPeg = d.mode === "openday" ? 3 : 12;
    drawPixelText(ctx, `PEG:${d.pegasoCollected.length}/${totalPeg}`, 320, 15, "#fde047", 1);
    drawPixelText(ctx, `EIP:${d.eipassScore}%`, 386, 5, "#38bdf8", 1);
    drawPixelText(ctx, `PT:${d.score}`, 386, 15, "#f8fafc", 1);
    drawPixelText(ctx, "[P]", 456, 10, "#ffd147", 1);

    // 1) Notifiche Narrative Stile Telltale ("★ Carlo si ricorderà di questo!") in alto a sinistra!
    //    (i TTL avanzano in stepHUD, non qui: niente velocità doppia sugli schermi 120/144 Hz)
    if (state.consequenceQueue.length > 0) {
      const topNote = state.consequenceQueue[state.consequenceQueue.length - 1];
      const w = Math.min(SCREEN_W - 20, topNote.text.length * 6 + 18);
      drawPixelPanel(ctx, 8, 31, w, 19, "rgba(11, 17, 32, 0.95)", topNote.color, "#1e293b");
      drawPixelText(ctx, topNote.text.slice(0, 74), 15, 37, topNote.color, 1);
    } else if (this.bannerTimer > 0) {
      // 2) Banner ingresso Zona/Capitolo
      const alpha = Math.min(1, this.bannerTimer / 28);
      ctx.save();
      ctx.globalAlpha = alpha;
      drawPixelPanel(ctx, 64, 32, 400, 34, "rgba(11, 17, 32, 0.93)", "#ffd147", "#1e3a8a");
      // §4.4: pannello allargato a 400 px e testo MISURATO con ellissi di parola,
      // così i nomi dei boss ("Il Sofista Ω", 455 px) non escono più dal bordo.
      drawPixelTextCentered(ctx, fitPixelText(this.bannerText, 396, 1, 1)[0], SCREEN_W / 2, 38, "#ffd147", 1);
      if (this.bannerSub) {
        drawPixelTextCentered(ctx, fitPixelText(this.bannerSub, 396, 1, 1)[0], SCREEN_W / 2, 51, "#cbd5e1", 1);
      }
      ctx.restore();
    }

    // 3) Fumetto Banter non bloccante mentre si corre nei livelli!
    if (world && world.activeBanter && this.bannerTimer <= 0 && state.consequenceQueue.length === 0) {
      const bn = world.activeBanter;
      const pRow = PORTRAIT_ROWS[bn.speaker] ?? 0;
      drawPixelPanel(ctx, 8, 31, 344, 34, "rgba(11, 17, 32, 0.92)", CHARACTERS[bn.speaker]?.color || "#38bdf8", "#1e293b");
      if (this.imgs.portraits) {
        ctx.drawImage(this.imgs.portraits, 1 * PORTRAIT_SIZE, pRow * PORTRAIT_SIZE, PORTRAIT_SIZE, PORTRAIT_SIZE, 13, 35, 26, 26);
      }
      const lines = wrapPixelText(bn.text, 292, 1);
      lines.slice(0, 2).forEach((ln, li) => {
        drawPixelText(ctx, ln, 45, 37 + li * 11, "#f8fafc", 1);
      });
    }
  }

  // ===========================================================================
  // DIALOGO CINEMATOGRAFICO CON RITRATTI 64x64 A 6 ESPRESSIONI
  // ===========================================================================
  renderDialogue(ctx, dlgState) {
    const node = dlgState.currentNode;
    if (!node) return;

    const hasChoices = !!node.choices;
    const boxY = hasChoices ? 96 : 166;
    const boxH = SCREEN_H - boxY - 6;

    const borderCol = node.speaker === "sofista" ? "#d946ef" : CHARACTERS[node.speaker]?.color || "#ffd147";
    drawPixelPanel(ctx, 8, boxY, SCREEN_W - 16, boxH, "rgba(8, 12, 24, 0.96)", borderCol, "#1e293b");

    // Ritratto nativo 64x64 pixel-perfect!
    const pRow = PORTRAIT_ROWS[node.speaker] ?? 0;
    const expr = Math.max(0, Math.min(5, node.expr ?? 0));
    if (this.imgs.portraits) {
      ctx.drawImage(
        this.imgs.portraits,
        expr * PORTRAIT_SIZE,
        pRow * PORTRAIT_SIZE,
        PORTRAIT_SIZE,
        PORTRAIT_SIZE,
        16,
        boxY + 10,
        PORTRAIT_SIZE,
        PORTRAIT_SIZE
      );
    }

    drawPixelText(
      ctx,
      SPEAKER_NAMES[node.speaker] || node.speaker.toUpperCase(),
      88,
      boxY + 10,
      node.speaker === "sofista" ? "#f0abfc" : "#ffd147",
      1
    );

    // --- TESTO DIALOGO: righe misurate sul pannello reale (niente più testo tagliato) ---
    // Con i comandi touch sopra lo schermo si riserva l'angolo in basso a destra
    const touchReserve = this.touchSafe ? 96 : 0;
    const textMaxW = SCREEN_W - 106 - touchReserve;
    const textTop = boxY + 24;
    const lineH = 11;
    const maxTextLines = hasChoices ? 4 : 9;
    const textBottomLimit = boxY + boxH - 14;
    const maxByHeight = Math.max(2, Math.floor((textBottomLimit - textTop) / lineH) + 1);
    const shownText = node.text.slice(0, Math.floor(dlgState.charCount));
    const allLines = wrapPixelText(shownText, textMaxW, 1, true);
    const usedLines = Math.min(allLines.length, maxTextLines, maxByHeight);
    allLines.slice(0, usedLines).forEach((ln, i) => {
      drawPixelText(ctx, ln, 88, textTop + i * lineH, "#f8fafc", 1);
    });
    // Indicatore di scorrimento se il testo supera lo spazio disponibile
    if (allLines.length > usedLines) {
      drawPixelText(ctx, "▼", SCREEN_W - 24, textTop + (usedLines - 1) * lineH, "#fde047", 1);
    }

    // Nomi "sussurrati" al centro del pannello (stile Telltale) per la voce NON in scena
    if (node.speaker !== node.focus && !hasChoices) {
      const whisper = SPEAKER_NAMES[node.focus] || "";
      if (whisper) {
        drawPixelTextCentered(ctx, whisper.toLowerCase(), SCREEN_W / 2, boxY + 34, "#475569", 1);
      }
    }

    if (hasChoices && dlgState.charCount >= node.text.length) {
      const choiceStep = 18;
      const choiceTop = SCREEN_H - 12 - (node.choices.length * choiceStep) + 2;
      node.choices.forEach((ch, idx) => {
        const cy = choiceTop + idx * choiceStep;
        const sel = idx === dlgState.choiceIndex;
        drawPixelPanel(
          ctx,
          12,
          cy,
          SCREEN_W - 24,
          16,
          sel ? "#0369a1" : "#131c31",
          sel ? "#ffd147" : "#475569",
          "#0f172a"
        );
        // Etichetta scelta: si accorcia con "…" in base alla larghezza REALE del pannello
        const prefix = `${sel ? "▶" : " "} [${idx + 1}] `;
        const availPx = SCREEN_W - 24 - 16 - measurePixelText(prefix, 1) - (this.touchSafe ? 96 : 0);
        const maxChars = Math.max(8, Math.floor((availPx + 1) / 6));
        const label = ch.label.length > maxChars ? `${ch.label.slice(0, maxChars - 1).trimEnd()}…` : ch.label;
        drawPixelText(ctx, `${prefix}${label}`, 18, cy + 5, sel ? "#ffffff" : "#cbd5e1", 1);
      });
    } else {
      drawPixelText(
        ctx,
        "[SPAZIO / INVIO / E] Continua ▶",
        this.touchSafe ? 24 : SCREEN_W - 204,
        SCREEN_H - 18,
        "#fde047",
        1
      );
    }
  }

  // ===========================================================================
  // POSTAZIONI INTERATTIVE EIPASS (SIMULATORE LIVE DEI 7 MODULI!)
  // ===========================================================================
  renderQuiz(ctx, qState) {
    const q = qState.challenge;
    drawPixelPanel(ctx, 10, 10, SCREEN_W - 20, SCREEN_H - 20, "rgba(8, 13, 26, 0.97)", "#38bdf8", "#1e3a8a");

    // Barra Titolo Postazione EIPASS
    ctx.fillStyle = "#0369a1";
    ctx.fillRect(15, 15, SCREEN_W - 30, 27);
    // §4.2: badge e titolo su DUE righe misurate (la barra passa da 19 a 28 px):
    // i 10 titoli su 12 che prima finivano con "…" ora si leggono per intero.
    drawPixelText(ctx, fitPixelText(q.badge, SCREEN_W - 44, 1, 1)[0], 22, 18, "#bae6fd", 1);
    drawPixelText(ctx, fitPixelText(q.title, SCREEN_W - 44, 1, 1)[0], 22, 28, "#fef08a", 1);

    if (!qState.answered) {
      // Pannello Simulatore Visivo Dinamico in tempo reale (y = 37..111)!
      this.renderQuizLiveSimulator(ctx, q, qState.selectedIndex);

      const pLines = wrapPixelText(q.prompt, SCREEN_W - 40, 1, true);
      pLines.slice(0, 2).forEach((pln, pi) => {
        drawPixelText(ctx, pln, 20, 118 + pi * 10, "#bae6fd", 1);
      });

      // Le opzioni si dimensionano sul testo reale: nessuna etichetta tagliata a metà
      const rects = this.getQuizOptionRects(qState);
      q.options.forEach((opt, idx) => {
        const sel = idx === qState.selectedIndex;
        const rect = rects[idx];
        drawPixelPanel(
          ctx,
          18,
          rect.y,
          SCREEN_W - 36,
          rect.h,
          sel ? "#0369a1" : "#151f36",
          sel ? "#ffd147" : "#475569",
          "#0f172a"
        );
        rect.lines.forEach((ln, li) => {
          drawPixelText(ctx, ln, 25, rect.y + 5 + li * 9, sel ? "#ffffff" : "#cbd5e1", 1);
        });
      });

      drawPixelText(
        ctx,
        "SU/GIU o [1-3]: Anteprima live | INVIO/SPAZIO: Conferma",
        20,
        243,
        "#94a3b8",
        1
      );
    } else {
      const ok = qState.wasCorrect;
      drawPixelPanel(
        ctx,
        22,
        42,
        SCREEN_W - 44,
        36,
        ok ? "#14532d" : "#7f1d1d",
        ok ? "#4ade80" : "#f87171",
        "#090d1a"
      );
      drawPixelText(
        ctx,
        ok ? "✓ PROCEDURA EIPASS VERIFICATA!" : "✗ ANOMALIA RILEVATA DAL SISTEMA!",
        32,
        49,
        "#ffffff",
        1
      );
      drawPixelText(ctx, fitPixelText(ok ? q.rewardDesc : q.penaltyDesc, SCREEN_W - 64, 1, 1)[0], 32, 62, ok ? "#bbf7d0" : "#fecaca", 1);

      const spk = ok ? q.speakerRight : q.speakerWrong;
      const pRow = PORTRAIT_ROWS[spk] ?? 0;
      if (this.imgs.portraits) {
        ctx.drawImage(
          this.imgs.portraits,
          (ok ? 1 : 2) * PORTRAIT_SIZE,
          pRow * PORTRAIT_SIZE,
          PORTRAIT_SIZE,
          PORTRAIT_SIZE,
          24,
          92,
          PORTRAIT_SIZE,
          PORTRAIT_SIZE
        );
      }
      drawPixelText(ctx, SPEAKER_NAMES[spk] || spk, 98, 96, "#ffd147", 1);

      const fbLines = wrapPixelText(ok ? q.feedbackRight : q.feedbackWrong, SCREEN_W - 122, 1);
      fbLines.slice(0, 5).forEach((ln, i) => {
        drawPixelText(ctx, ln, 98, 112 + i * 12, "#f8fafc", 1);
      });

      drawPixelTextCentered(ctx, "Premi [SPAZIO / INVIO / E] per continuare ▶", SCREEN_W / 2, 232, "#fde047", 1);
    }
  }

  /** Geometria UNICA delle opzioni quiz: la usano sia il disegno sia il tocco. */
  getQuizOptionRects(qState) {
    const q = qState.challenge;
    const optTop = 137;
    const optAvail = 240 - optTop;
    const wrapped = q.options.map((opt, idx) =>
      wrapPixelText(`[${idx + 1}] ${opt.label}`, SCREEN_W - 54, 1, false).slice(0, 3)
    );
    const wanted = wrapped.map((ls) => ls.length * 10 + 10);
    const totalWanted = wanted.reduce((a, b) => a + b, 0);
    const scale = totalWanted > optAvail ? optAvail / totalWanted : 1;
    let oy = optTop;
    return q.options.map((_, idx) => {
      const h = Math.max(20, Math.round(wanted[idx] * scale));
      const rect = { y: oy, h, lines: wrapped[idx] };
      oy += h + 3;
      return rect;
    });
  }

  renderQuizLiveSimulator(ctx, q, selIdx) {
    const opt = q.options[selIdx] || q.options[0];
    const sx = 20;
    const sy = 46;
    const sw = SCREEN_W - 40;
    const sh = 68;

    drawPixelPanel(ctx, sx, sy, sw, sh, "#0b1120", "#475569", "#162038");

    if (q.uiMode === "spreadsheet_live" && q.simData) {
      // Griglia Foglio di Calcolo interattiva con calcolo live in B6!
      ctx.fillStyle = "#14532d";
      ctx.fillRect(sx + 6, sy + 5, 200, 12);
      drawPixelText(ctx, `fx: ${opt.label.slice(0, 26)}`, sx + 10, sy + 8, "#bbf7d0", 1);

      q.simData.rows.forEach((r, ri) => {
        const ry = sy + 20 + ri * 12;
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(sx + 6, ry, 116, 11);
        ctx.fillRect(sx + 124, ry, 82, 11);
        drawPixelText(ctx, r[0], sx + 10, ry + 2, "#cbd5e1", 1);
        drawPixelText(ctx, r[1], sx + 128, ry + 2, "#f8fafc", 1);
      });

      // Cella Risultato Live a destra!
      drawPixelPanel(
        ctx,
        sx + 216,
        sy + 6,
        216,
        62,
        opt.correct ? "#0d3b2e" : "#3b1219",
        opt.correct ? "#4ade80" : "#f87171",
        "#090d1a"
      );
      drawPixelText(ctx, q.simData.resultLabel, sx + 224, sy + 12, "#93c5fd", 1);
      drawPixelText(ctx, opt.calcPreview || "---", sx + 224, sy + 24, opt.correct ? "#4ade80" : "#fda4af", 1);
      const tagWrapped = wrapPixelText(opt.previewTag || "", 200, 1);
      tagWrapped.slice(0, 2).forEach((tl, ti) => {
        drawPixelText(ctx, tl, sx + 224, sy + 38 + ti * 10, "#fde047", 1);
      });
    } else if (q.uiMode === "layout_studio" && q.simData) {
      // Anteprima Split-Screen Documento / Slide Aula Magna!
      const clean = opt.layoutState === "clean";
      const pageBg =
        q.simData.docKind === "slide"
          ? clean
            ? "#1e3a8a"
            : "#ffffff"
          : "#fefce8";
      ctx.fillStyle = pageBg;
      ctx.fillRect(sx + 8, sy + 7, 172, 64);
      ctx.strokeStyle = "#94a3b8";
      ctx.strokeRect(sx + 8, sy + 7, 172, 64);

      if (q.simData.docKind === "slide") {
        if (clean) {
          ctx.fillStyle = "#ffd147";
          ctx.fillRect(sx + 14, sy + 13, 160, 12);
          drawPixelText(ctx, "OPEN DAY CASARDI", sx + 20, sy + 16, "#090d1a", 1, null);
          drawPixelText(ctx, "• Classico & Biomedico", sx + 16, sy + 32, "#ffffff", 1);
          drawPixelText(ctx, "• Musicale & EIPASS", sx + 16, sy + 45, "#bae6fd", 1);
        } else {
          // Testo illeggibile giallo su bianco o caos!
          drawPixelText(ctx, "TESTO GIALLO ILLEGGIBILE!!", sx + 14, sy + 18, "#fef08a", 1, null);
          for (let ly = 30; ly < 64; ly += 5) {
            ctx.fillStyle = "#fde047";
            ctx.fillRect(sx + 14, ly, 152, 2);
          }
        }
      } else {
        // Catalogo 8.000 Volumi o Giornale Pegaso
        drawPixelText(
          ctx,
          q.simData.docTitle.slice(0, 24),
          sx + 14,
          sy + 12,
          clean ? "#7c2d12" : "#94a3b8",
          1,
          null
        );
        for (let r = 0; r < 3; r++) {
          const indent = clean ? 14 : 14 + (r % 2) * 26;
          ctx.fillStyle = clean ? "#1e293b" : "#ef4444";
          ctx.fillRect(sx + indent, sy + 28 + r * 12, clean ? 110 : 78, 4);
          if (clean) {
            ctx.fillStyle = "#0284c7";
            ctx.fillRect(sx + 150, sy + 28 + r * 12, 18, 4);
          }
        }
      }

      drawPixelText(ctx, "STATO ANTEPRIMA LIVE:", sx + 192, sy + 16, "#93c5fd", 1);
      const tagLines = wrapPixelText(opt.previewTag || "", 236, 1);
      tagLines.forEach((ln, i) => {
        drawPixelText(ctx, ln, sx + 192, sy + 32 + i * 13, clean ? "#4ade80" : "#fca5a5", 1);
      });
    } else if (q.uiMode === "phishing_inspector" && q.simData) {
      drawPixelText(ctx, `DA: ${q.simData.from}`, sx + 10, sy + 10, "#fca5a5", 1);
      drawPixelText(ctx, `ALLEGATO: ${q.simData.attachment}`, sx + 10, sy + 24, "#fde047", 1);
      ctx.fillStyle = opt.correct ? "#14532d" : "#7f1d1d";
      ctx.fillRect(sx + 10, sy + 42, sw - 20, 26);
      drawPixelText(ctx, opt.previewTag || "", sx + 16, sy + 51, "#ffffff", 1);
    } else if (q.uiMode === "mail_composer" && q.simData) {
      drawPixelText(ctx, `DESTINATARI: ${q.simData.recipients}`, sx + 10, sy + 10, "#e2e8f0", 1);
      drawPixelText(ctx, `OGGETTO: ${q.simData.subject}`, sx + 10, sy + 24, "#93c5fd", 1);
      ctx.fillStyle = opt.correct ? "#14532d" : "#7f1d1d";
      ctx.fillRect(sx + 10, sy + 42, sw - 20, 26);
      drawPixelText(ctx, opt.previewTag || "", sx + 16, sy + 51, "#ffffff", 1);
    } else {
      // Browser HTTPS o Centralina Hardware
      const topLine = q.simData?.url || (q.simData?.nodes || []).join("  |  ");
      drawPixelText(ctx, fitPixelText(topLine, sw - 24, 1, 1)[0], sx + 10, sy + 12, "#38bdf8", 1);
      if (q.simData?.alert || q.simData?.cardTitle) {
        drawPixelText(ctx, q.simData.alert || q.simData.cardTitle, sx + 10, sy + 27, "#fde047", 1);
      }
      ctx.fillStyle = opt.correct ? "#14532d" : "#45121b";
      ctx.fillRect(sx + 10, sy + 43, sw - 20, 25);
      drawPixelText(ctx, opt.previewTag || "", sx + 16, sy + 52, opt.correct ? "#4ade80" : "#fca5a5", 1);
    }
  }

  // ===========================================================================
  // MENU PAUSA, DOSSIER VARIABILI NARRATIVE, PEGASO E MIXER AUDIO
  // ===========================================================================
  renderPauseAndDossier(ctx, state, audio, pauseIndex, pauseItems, showControlsModal, freeChallengeMenu = null) {
    ctx.fillStyle = "rgba(6, 10, 22, 0.95)";
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

    if (showControlsModal) {
      this.renderControlsScreen(ctx, audio);
      return;
    }

    if (freeChallengeMenu && freeChallengeMenu.open) {
      this.renderFreeChallengeMenu(ctx, freeChallengeMenu.index);
      return;
    }

    drawPixelPanel(ctx, 10, 10, SCREEN_W - 20, SCREEN_H - 20, "#0d1528", "#ffd147", "#1e293b");
    drawPixelText(ctx, "PAUSA & DOSSIER SQUADRA LICEO CASARDI", 22, 19, "#ffd147", 1);

    pauseItems.forEach((it, idx) => {
      const y = 34 + idx * 27;
      const sel = idx === pauseIndex;
      drawPixelPanel(
        ctx,
        20,
        y,
        212,
        23,
        sel ? "#0369a1" : "#162038",
        sel ? "#ffd147" : "#475569",
        "#0f172a"
      );
      drawPixelText(ctx, `${sel ? "▶ " : "  "}${it.label.slice(0, 31)}`, 26, y + 8, "#f8fafc", 1);
    });

    const d = state.data;
    drawPixelPanel(ctx, 240, 34, 220, 206, "#131d36", "#38bdf8", "#0f172a");
    drawPixelText(ctx, "FIDUCIA SQUADRA (Bonus >=70%):", 248, 42, "#38bdf8", 1);

    // 5 eroi: righe da 15px per entrare tutti e 5 prima del blocco EIPASS
    CHAR_ORDER.forEach((cid, i) => {
      const meta = CHARACTERS[cid];
      const val = d.trust[cid] ?? 50;
      const y = 54 + i * 15;
      drawPixelText(ctx, meta.shortName.slice(0, 3), 248, y + 1, "#cbd5e1", 1);
      ctx.fillStyle = "#090d1a";
      ctx.fillRect(302, y, 112, 9);
      ctx.fillStyle = val >= 70 ? "#4ade80" : meta.color;
      ctx.fillRect(302, y, Math.round(val * 1.12), 9);
      drawPixelText(ctx, `${val}%`, 418, y + 1, "#f8fafc", 1);
    });

    drawPixelText(ctx, `COMPETENZA EIPASS: ${d.eipassScore}%`, 248, 133, "#fde047", 1);
    EIPASS_MODULES.forEach((mod, i) => {
      const mx = 248 + i * 29;
      const ok = d.modulesCleared[i];
      ctx.fillStyle = ok ? "#16a34a" : "#334155";
      ctx.fillRect(mx, 144, 26, 14);
      drawPixelText(ctx, mod.icon, mx + 4, 148, ok ? "#ffffff" : "#94a3b8", 1);
    });

    drawPixelText(ctx, `PAGINE DI PEGASO: ${d.pegasoCollected.length}`, 248, 164, "#f8fafc", 1);
    if (d.pegasoCollected.length > 0) {
      const lastId = d.pegasoCollected[d.pegasoCollected.length - 1];
      const lore = PEGASO_LORE.find((l) => l.id === lastId);
      if (lore) {
        drawPixelText(ctx, fitPixelText(lore.title, 208, 1, 1)[0], 248, 175, "#fde047", 1);
        // Il testo della pagina si adatta alla larghezza reale: 4 righe piene, nessun "…" a metà frase
        const lns = fitPixelText(lore.text, 212, 5, 1);
        lns.forEach((ln, li) => drawPixelText(ctx, ln, 248, 186 + li * 9, "#cbd5e1", 1));
      }
    } else {
      drawPixelText(ctx, "Esplora balconate e aule interne", 248, 186, "#94a3b8", 1);
      drawPixelText(ctx, "per scoprire i numeri di PEGASO!", 248, 198, "#94a3b8", 1);
    }

    drawPixelTextCentered(
      ctx,
      "SU/GIU: Voce | SX/DX: Volume | INVIO: Conferma | [V] CRT | ESC: Gioca",
      SCREEN_W / 2,
      248,
      "#94a3b8",
      1
    );
  }

  /** Elenco delle sfide libere (greco, latino, storia, calcio, operazioni a tempo). */
  renderFreeChallengeMenu(ctx, index) {
    drawPixelPanel(ctx, 10, 10, SCREEN_W - 20, SCREEN_H - 20, "#0d1528", "#38e2d8", "#1e293b");
    drawPixelText(ctx, "SFIDE LIBERE — CULTURA E SPORT", 22, 19, "#38e2d8", 1);
    drawPixelText(ctx, "Non servono eroi: sono sfide extra del Liceo Classico.", 22, 31, "#94a3b8", 1);

    FREE_CHALLENGES.forEach((ch, i) => {
      const y = 46 + i * 34;
      const sel = i === index;
      drawPixelPanel(ctx, 20, y, SCREEN_W - 40, 31, sel ? "#0369a1" : "#162038", sel ? "#ffd147" : "#475569", "#0f172a");
      drawPixelText(ctx, fitPixelText(`${sel ? "▶ " : "  "}${ch.title}`, SCREEN_W - 70, 1, 1)[0], 28, y + 5, sel ? "#ffffff" : "#e2e8f0", 1);
      drawPixelText(ctx, fitPixelText(ch.sub, SCREEN_W - 70, 1, 1)[0], 28, y + 16, sel ? "#fef08a" : "#94a3b8", 1);
    });

    const cur = FREE_CHALLENGES[index];
    if (cur) drawPixelTextCentered(ctx, fitPixelText(cur.desc, SCREEN_W - 60, 1, 1)[0], SCREEN_W / 2, 226, "#9adfd6", 1);
    drawPixelTextCentered(ctx, "SU/GIU: scegli | INVIO: gioca | P/ESC: torna", SCREEN_W / 2, 244, "#ffd147", 1);
  }

  renderControlsScreen(ctx, audio) {
    drawPixelPanel(ctx, 12, 10, SCREEN_W - 24, SCREEN_H - 20, "#0b1326", "#38bdf8", "#1e293b");
    drawPixelTextCentered(ctx, "COMANDI DI GIOCO & MIXER AUDIO CHIPTUNE", SCREEN_W / 2, 20, "#ffd147", 1);

    // 12 voci, 15px per riga: ogni descrizione sta su UNA riga del pannello reale
    CONTROLS_HELP.forEach((c, i) => {
      const y = 30 + i * 15;
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(24, y, 136, 13);
      ctx.strokeStyle = "#475569";
      ctx.strokeRect(24, y, 136, 13);
      const keysTxt = fitPixelText(c.keys, 130, 1, 1)[0];
      drawPixelText(ctx, keysTxt, 29, y + 4, "#38bdf8", 1);
      const desc = fitPixelText(c.action, SCREEN_W - 24 - 168 - 8, 1, 1)[0];
      drawPixelText(ctx, desc, 168, y + 4, "#f8fafc", 1);
    });

    const mPct = Math.round(audio.musicVol * 100);
    const sPct = Math.round(audio.sfxVol * 100);
    drawPixelTextCentered(
      ctx,
      `Musica ${mPct}% (SX/DX) | Effetti ${sPct}% (SU/GIU) | [M] Muto: ${audio.muted ? "SI" : "NO"}`,
      SCREEN_W / 2,
      213,
      "#fde047",
      1
    );
    drawPixelTextCentered(
      ctx,
      "Premi [ESC / INVIO / SPAZIO] per tornare",
      SCREEN_W / 2,
      228,
      "#4ade80",
      1
    );
  }

  // ===========================================================================
  // SCHERMATA DI VITTORIA / EPILOGO DINAMICO (POSA 11 VITTORIA DEI 5 EROI!)
  // ===========================================================================
  renderEndingScreen(ctx, state) {
    // tick avanzato in stepHUD
    const d = state.data;
    const ending = state.computeEnding();

    ctx.fillStyle = "#080e1e";
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    drawPixelPanel(ctx, 8, 8, SCREEN_W - 16, SCREEN_H - 16, "#0d162c", "#ffd147", "#1e3a8a");

    ctx.fillStyle = "#1e3a8a";
    ctx.fillRect(14, 14, SCREEN_W - 28, 34);
    const head =
      d.mode === "openday"
        ? "★ MISSIONE OPEN DAY COMPLETATA! - LICEO CASARDI ★"
        : `★ FINALE SBLOCCATO [${ending.rank}] ★`;
    drawPixelTextCentered(ctx, head, SCREEN_W / 2, 20, "#ffd147", 1);
    drawPixelTextCentered(ctx, ending.title, SCREEN_W / 2, 34, "#e0f2fe", 1);

    // I 5 Protagonisti in posa di Vittoria (pose = 11 nel foglio 32x36!)
    if (this.imgs.characters) {
      const bounce = Math.round(Math.abs(Math.sin(this.tick * 0.1)) * 3);
      // 5 sprite da 30px nella colonna sinistra (x 14..176): mai sotto il riquadro statistiche (x>=182)
      const squadW = CHAR_ORDER.length * 30;
      const startX = 14 + Math.max(0, Math.round((162 - squadW) / 2));
      CHAR_ORDER.forEach((cid, i) => {
        const meta = CHARACTERS[cid];
        ctx.drawImage(
          this.imgs.characters,
          11 * CHAR_SPRITE_W,
          meta.row * CHAR_SPRITE_H,
          CHAR_SPRITE_W,
          CHAR_SPRITE_H,
          startX + i * 30,
          54 - (i % 2 === 0 ? bounce : 0),
          CHAR_SPRITE_W,
          CHAR_SPRITE_H
        );
      });
    }

    const mins = Math.floor(d.playTimeSec / 60);
    const secs = String(Math.floor(d.playTimeSec % 60)).padStart(2, "0");
    drawPixelPanel(ctx, 182, 54, 282, 46, "#131f3a", "#38bdf8", "#0f172a");
    drawPixelText(ctx, `Punteggio: ${d.score}  |  Tempo: ${mins}m ${secs}s`, 190, 61, "#f8fafc", 1);
    drawPixelText(
      ctx,
      `EIPASS: ${d.eipassScore}% (${d.eipassCorrect}/${d.eipassAnswered} OK)`,
      190,
      73,
      "#4ade80",
      1
    );
    drawPixelText(
      ctx,
      `Fiducia Squadra: ${state.getAverageTrust()}% | Pegaso: ${d.pegasoCollected.length}`,
      190,
      85,
      "#fde047",
      1
    );

    const sLines = fitPixelText(ending.summary, SCREEN_W - 44, 6, 1);
    sLines.forEach((ln, i) => drawPixelText(ctx, ln, 22, 110 + i * 12, "#f8fafc", 1));

    if (d.mode === "openday") {
      drawPixelPanel(ctx, 20, 188, SCREEN_W - 40, 34, "#14532d", "#4ade80", "#052e16");
      drawPixelTextCentered(
        ctx,
        "PROVA ORA LA CAMPAGNA COMPLETA (6 CAPITOLI • 18 LIVELLI)!",
        SCREEN_W / 2,
        195,
        "#fef08a",
        1
      );
      drawPixelTextCentered(
        ctx,
        "Biblioteca 8.000 Volumi, Redazione Pegaso, 2 Mid-Boss e 4 Finali!",
        SCREEN_W / 2,
        208,
        "#dcfce7",
        1
      );
    } else if (d.decisionsLog.length > 0) {
      drawPixelText(
        ctx,
        `Scelte: ${d.decisionsLog.map((x) => x.label.slice(0, 30)).slice(0, 2).join(" • ")}`,
        22,
        204,
        "#fde047",
        1
      );
    }

    drawPixelTextCentered(
      ctx,
      "[INVIO / SPAZIO] Menu Principale  |  [F9] Reset Nuovo Visitatore",
      SCREEN_W / 2,
      242,
      "#ffd147",
      1
    );
  }

  /**
   * Filtro opzionale Scanline CRT Arcade attivabile/disattivabile col tasto [V]
   */
  renderCRTFilter(ctx) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.14)";
    for (let y = 0; y < SCREEN_H; y += 2) {
      ctx.fillRect(0, y, SCREEN_W, 1);
    }
  }
}


// === MODULE: src/main.js ===
// Orchestratore Principale v2.0 di "OPERAZIONE EIPASS — IL CASARDI IN 8 BIT"
// Gestisce Ciclo 60Hz deterministico, Menu, Modalità Open Day (7-10 min), Campagna Completa (6 Capitoli),
// Dialoghi Cinematografici 64x64, Postazioni Interattive EIPASS, Minigiochi Passioni, Assist [C], CRT [V] e Audio Chiptune.
class CasardiGameApp {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.ctx.imageSmoothingEnabled = false;

    this.state = new GameStateManager();
    this.audio = new ChiptuneAudioEngine(this.state.audioPrefs);
    this.input = new InputController(() => {
      this.audio.unlock();
      if (!this.audio.currentTrackKey) {
        this.audio.playTrack("main");
      }
    });

    this.sprites = { characters: null, portraits: null, tileset: null, enemiesProps: null };
    this.renderer = new PixelRenderer(this.sprites);
    this.ui = new UIManager(this.sprites);
    this.minigames = new SpecialChallengeManager(this.audio, this.state, this.sprites);

    // Scene: 'title' | 'playing' | 'paused' | 'ending'
    this.scene = "title";
    this.showControlsModal = false;
    // Sotto-menu "Sfide Libere" del menu pausa (greco, latino, storia, calcio, matematica a tempo)
    this.freeChallengeMenu = { open: false, index: 0 };
    this.titleIndex = 0;
    this.pauseIndex = 0;

    this.levels = [];
    this.world = null;
    this.activeDialogue = null;
    this.activeQuiz = null;

    this.lastFrameTime = 0;
    this.accumulator = 0;
  }

  async init() {
    window.__CASARDI_GAME__ = this;
    await this.loadSpriteSheets();
    this.bindCanvasClick();
    this.audio.playTrack("main");
    requestAnimationFrame((ts) => this.loop(ts));
  }

  bindCanvasClick() {
    this.canvas.addEventListener("pointerdown", (ev) => {
      this.audio.unlock();
      const rect = this.canvas.getBoundingClientRect();
      const mx = ((ev.clientX - rect.left) / rect.width) * SCREEN_W;
      const my = ((ev.clientY - rect.top) / rect.height) * SCREEN_H;

      if (this.scene === "title") {
        if (this.showControlsModal) {
          this.showControlsModal = false;
          return;
        }
        const opts = this.getTitleOptions();
        const panelH = opts.length > 3 ? 118 : 90;
        const panelY = 245 - panelH;
        const stepH = 28;
        opts.forEach((opt, idx) => {
          const y = panelY + 5 + idx * stepH;
          if (mx >= 190 && mx <= 464 && my >= y && my <= y + stepH - 2) {
            this.titleIndex = idx;
            this.audio.playSfx("confirm");
            if (opt.id === "openday") this.startMode("openday", false);
            else if (opt.id === "campaign_new") this.startMode("campaign", false);
            else if (opt.id === "campaign_continue") this.startMode("campaign", true);
            else if (opt.id === "team_follow") this.toggleTeamFollow();
            else if (opt.id === "controls") this.showControlsModal = true;
          }
        });
      } else if (this.scene === "paused") {
        if (this.showControlsModal) {
          this.closeControlsModal();
          return;
        }
        // Tocco/Click sulle 7 voci del Menu Pausa & Dossier
        const items = this.getPauseItems();
        items.forEach((it, idx) => {
          const py = 34 + idx * 27;
          if (mx >= 20 && mx <= 232 && my >= py && my <= py + 23) {
            this.pauseIndex = idx;
            if (it.id === "music_vol") {
              const delta = mx > 126 ? 0.1 : -0.1;
              this.audio.setMusicVolume(this.audio.musicVol + delta);
              this.state.audioPrefs.musicVol = this.audio.musicVol;
              this.state.saveAudioPrefs();
              this.audio.playSfx("blip", 390);
            } else if (it.id === "sfx_vol") {
              const delta = mx > 126 ? 0.1 : -0.1;
              this.audio.setSfxVolume(this.audio.sfxVol + delta);
              this.state.audioPrefs.sfxVol = this.audio.sfxVol;
              this.state.saveAudioPrefs();
              this.audio.playSfx("confirm");
            } else if (it.id === "team_follow") {
              this.toggleTeamFollow();
            } else if (it.id === "free_challenges") {
              this.openFreeChallengeMenu();
            } else {
              this.input.justPressed.add("Enter");
            }
          }
        });
        // Tocco su [P] in alto a destra riprende subito la partita
        if (mx >= 435 && my <= 28) {
          this.scene = "playing";
        }
      } else if (this.scene === "playing") {
        // 1. Tocco diretto su tutti e 6 i Minigiochi Arcade!
        if (this.minigames.isActive()) {
          const m = this.minigames.active;
          if (m.type === "piano") {
            // Ritmo di Francesco: quattro corsie in fondo allo schermo (y 204..244)
            const lanes = [44, 134, 224, 314];
            for (let i = 0; i < lanes.length; i++) {
              if (mx >= lanes[i] && mx <= lanes[i] + 88 && my >= 190 && my <= 246) {
                this.input.justPressed.add(`Digit${i + 1}`);
                break;
              }
            }
          } else if (m.type === "filesorter") {
            if (mx >= 44 && mx <= 220 && my >= 120 && my <= 206) {
              this.input.justPressed.add("Digit1");
            } else if (mx >= 260 && mx <= 436 && my >= 120 && my <= 206) {
              this.input.justPressed.add("Digit2");
            }
          } else if (m.type === "firewall") {
            if (my >= 52 && my <= 104) this.input.justPressed.add("Digit1");
            else if (my > 104 && my <= 156) this.input.justPressed.add("Digit2");
            else if (my > 156 && my <= 220) this.input.justPressed.add("Digit3");
          } else if (m.type === "athletics") {
            // Atletica di Ruggero: tap a sinistra = partenza/corsa, tap in alto o a destra = salto ostacolo
            if (m.phase === "ready") {
              this.input.justPressed.add("Space");
            } else if (m.phase === "running" && (my < 120 || mx > 300)) {
              this.input.justPressed.add("Space");
            }
          } else if (m.type === "dance") {
            // Danza di Daniele: le quattro zone del riquadro sono i quattro passi, il resto è Giro/Battito
            if (m.phase === "ready") {
              this.input.justPressed.add("Space");
            } else if (m.phase === "dancing" && m.routines[m.routineIdx] && mx >= 34 && mx <= 414 && my >= 84 && my <= 118) {
              // IL TOCCO SULLA CASELLA ESEGUE QUELLA MOSSA (non quella attesa: niente più "sempre corretto")
              const moves = m.routines[m.routineIdx].moves;
              const stepW = Math.min(42, Math.floor(360 / Math.max(1, moves.length)));
              const totalW = stepW * moves.length;
              const startX = 34 + Math.max(0, Math.floor((380 - totalW) / 2));
              const idx = Math.max(0, Math.min(moves.length - 1, Math.floor((mx - startX) / stepW)));
              const move = moves[idx];
              const keyMap = { fwd: "ArrowUp", back: "ArrowDown", left: "ArrowLeft", right: "ArrowRight", turn: "Space", clap: "KeyE" };
              this.input.justPressed.add(keyMap[move] || "ArrowUp");
            } else if (my < 84) {
              this.input.justPressed.add("Space");
            } else if (my >= 150) {
              this.input.justPressed.add("KeyE");
            }
          } else if (m.type === "basket") {
            if (!m.ball) {
              if (mx >= 330 || my >= 218) {
                this.input.justPressed.add("Enter");
              } else if (my >= 44 && my < 218) {
                const dx = Math.max(24, mx - 92);
                const dy = Math.max(16, 196 - my);
                m.angle = Math.max(32, Math.min(76, Math.round((Math.atan2(dy, dx) * 180) / Math.PI)));
                m.power = Math.max(35, Math.min(100, Math.round(Math.hypot(dx, dy) / 3.0)));
                this.audio.playSfx("blip", 360);
              }
            }
          } else if (m.type === "mathsprint") {
            // Operazioni a tempo: tocco sulle 4 caselle d'angolo della risposta
            const inRect = (x, y, w, h) => mx >= x && mx <= x + w && my >= y && my <= y + h;
            for (let i = 0; i < 4; i++) {
              const ox = 60 + (i % 2) * 190;
              const oy = 112 + Math.floor(i / 2) * 40;
              if (inRect(ox, oy, 170, 30)) {
                this.input.justPressed.add(`Digit${i + 1}`);
                break;
              }
            }
          } else if (m.type === "soccer") {
            // Calcio: SX/DX = dove mirare, SU/GIU = altezza, tocco sul pallone o in basso = tira
            if (!m.ball) {
              const inRect = (x, y, w, h) => mx >= x && mx <= x + w && my >= y && my <= y + h;
              if (inRect(224, 180, 32, 32) || my >= 218) {
                this.input.justPressed.add("Enter");
              } else if (inRect(146, 76, 60, 56)) {
                this.input.justPressed.add("ArrowUp");
              } else if (inRect(274, 76, 62, 56)) {
                this.input.justPressed.add("ArrowDown");
              } else if (inRect(46, 76, 96, 56)) {
                this.input.justPressed.add("ArrowLeft");
              } else if (inRect(338, 76, 96, 56)) {
                this.input.justPressed.add("ArrowRight");
              }
            }
          } else if (m.type === "greek" || m.type === "latin" || m.type === "history") {
            // Sfide culturali: tocco sulla riga della risposta e sul pannello per confermare
            if (!m.answered && !m.doneTimer) {
              const q = m.bank[m.order[m.qIdx]];
              const rows = q ? q.options.length : 4;
              for (let i = 0; i < rows; i++) {
                const oy = 130 + i * 20;
                if (my >= oy && my <= oy + 17 && mx >= 36 && mx <= SCREEN_W - 36) {
                  this.input.justPressed.add(`Digit${i + 1}`);
                  this.input.justPressed.add("Enter");
                  break;
                }
              }
            }
          } else if (m.type === "math") {
            // 1) Pulsanti VERI disegnati nel pannello destro: -a / +a / SU / GIU / VERIFICA
            const inRect = (x, y, w, h) => mx >= x && mx <= x + w && my >= y && my <= y + h;
            if (inRect(362, 154, 84, 26) || my >= 220) {
              this.input.justPressed.add("Enter");
            } else if (inRect(362, 66, 38, 22) || inRect(354, 42, 100, 190) && mx < 404 && my >= 60 && my < 96) {
              this.input.justPressed.add("ArrowLeft");
            } else if (inRect(408, 66, 38, 22)) {
              this.input.justPressed.add("ArrowRight");
            } else if (inRect(362, 116, 38, 22)) {
              this.input.justPressed.add("ArrowUp");
            } else if (inRect(408, 116, 38, 22)) {
              this.input.justPressed.add("ArrowDown");
            } else if (mx >= 36 && mx <= 346 && my >= 42 && my <= 220) {
              // 2) Trascinamento sulla griglia: SX/DX apre, SU/GIU alza/abbassa
              if (Math.abs(mx - 191) > Math.abs(my - 131)) {
                this.input.justPressed.add(mx > 191 ? "ArrowRight" : "ArrowLeft");
              } else {
                this.input.justPressed.add(my > 131 ? "ArrowDown" : "ArrowUp");
              }
            }
          }
          return;
        }

        // 1a. Click sulle pillole eroe dell'HUD (x=94+idx*45, y 3..23): porta in campo quell'eroe
        if (my >= 0 && my <= 26 && mx >= 94) {
          const slots = this.heroSlotOrder();
          const idx = Math.floor((mx - 94) / 45);
          if (idx >= 0 && idx < slots.length && mx <= 94 + idx * 45 + 42) {
            const target = slots[idx];
            if (!this.switchActiveChar(target)) {
              const meta = CHARACTERS[target] || { shortName: `EROE ${idx + 1}` };
              this.world?.addFloatingText(
                this.world.player.x - 20,
                this.world.player.y - 22,
                `${meta.shortName} NON ANCORA IN SQUADRA`,
                "#94a3b8"
              );
              this.audio.playSfx("wrong");
            }
            return;
          }
        }

        // 1b. Tocco/click su un compagno visibile: lo porta in campo
        if (this.world && this.world.companionActors) {
          const hit = this.world.companionActors.find(
            (a) => mx >= a.x - 4 && mx <= a.x + 36 && my >= a.y - 14 && my <= a.y + 40
          );
          if (hit) {
            this.switchActiveChar(hit.charId);
            return;
          }
        }

        // 2. Tocco sui Dialoghi Cinematografici e scelte multiple
        if (this.activeDialogue && this.activeDialogue.currentNode) {
          const node = this.activeDialogue.currentNode;
          if (this.activeDialogue.charCount < node.text.length) {
            this.activeDialogue.charCount = node.text.length;
          } else if (node.choices) {
            // Geometria IDENTICA al disegno: le scelte sono ancorate in basso
            const choiceStep = 18;
            const choiceTop = SCREEN_H - 12 - node.choices.length * choiceStep + 2;
            node.choices.forEach((_, idx) => {
              const cy = choiceTop + idx * choiceStep;
              if (mx >= 12 && mx <= SCREEN_W - 12 && my >= cy && my <= cy + 16) {
                this.commitDialogueChoice(node, idx);
              }
            });
          } else {
            this.input.justPressed.add("Enter");
          }
          return;
        }

        // 3. Tocco sulle opzioni delle Postazioni Interattive EIPASS
        if (this.activeQuiz) {
          if (!this.activeQuiz.answered) {
            let hitOption = false;
            const rects = this.ui.getQuizOptionRects(this.activeQuiz);
            rects.forEach((r, idx) => {
              if (mx >= 18 && mx <= SCREEN_W - 18 && my >= r.y && my <= r.y + r.h) {
                if (this.activeQuiz.selectedIndex === idx) {
                  this.submitQuizAnswer();
                } else {
                  this.activeQuiz.selectedIndex = idx;
                  this.audio.playSfx("blip", 380);
                }
              }
            });
            hitOption = rects.some((r) => my >= r.y && my <= r.y + r.h && mx >= 18 && mx <= SCREEN_W - 18);
            if (!hitOption && my >= 234) {
              this.submitQuizAnswer();
            }
          } else {
            this.activeQuiz = null;
            this.audio.setDucking(false);
          }
          return;
        }

        // 4. Tocco rapido sulla barra HUD superiore (cambio Eroe 1-5, Assist [C], Pausa [P])!
        if (my <= 28) {
          for (let idx = 0; idx < 5; idx++) {
            const sx = 94 + idx * 45;
            if (mx >= sx && mx <= sx + 42) {
              this.input.justPressed.add(`Digit${idx + 1}`);
              return;
            }
          }
          if (mx >= 316 && mx <= 370) {
            this.input.justPressed.add("KeyC");
            return;
          }
          if (mx >= 442) {
            this.input.justPressed.add("KeyP");
            return;
          }
        }

        // 5. Tocco sul fumetto interattivo [E] in mappa (porte, terminali, NPC, postazioni)!
        if (this.world && this.world.interactPrompt) {
          const ip = this.world.interactPrompt;
          const sx = ip.x - this.world.camera.x;
          const sy = ip.y - this.world.camera.y;
          if (mx >= sx - 24 && mx <= sx + 120 && my >= sy - 32 && my <= sy + 44) {
            this.input.justPressed.add("KeyE");
          }
        }
      } else if (this.scene === "ending") {
        this.instantOpenDayVisitorReset();
      }
    });
  }

  /**
   * Stato contestuale in tempo reale per il Gamepad Touch Mobile su Telefono
   */
  getTouchContextState() {
    const d = this.state.data;
    const hasInteract =
      this.scene === "playing" &&
      !this.minigames.isActive() &&
      !this.activeDialogue &&
      !this.activeQuiz &&
      !!(this.world && this.world.interactPrompt);
    const inModal =
      this.scene !== "playing" ||
      !!this.activeDialogue ||
      !!this.activeQuiz ||
      this.minigames.isActive();
    const assistReady =
      this.scene === "playing" &&
      !inModal &&
      this.world &&
      this.world.player.assistCooldown <= 0 &&
      d.unlockedChars.length > 1;
    return {
      scene: this.scene,
      activeChar: d.activeChar,
      unlockedChars: d.unlockedChars,
      hasInteract,
      interactText: hasInteract ? this.world.interactPrompt.text : "",
      inDialogueOrQuiz: !!(this.activeDialogue || this.activeQuiz),
      minigameType: this.minigames.isActive() ? this.minigames.active.type : null,
      assistReady: !!assistReady,
      muted: this.audio.muted,
    };
  }

  loadSpriteSheets() {
    const loadOne = (src) =>
      new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });

    return Promise.all([
      loadOne(EMBEDDED_SPRITES.characters),
      loadOne(EMBEDDED_SPRITES.portraits),
      loadOne(EMBEDDED_SPRITES.tileset),
      loadOne(EMBEDDED_SPRITES.enemiesProps),
    ]).then(([c, p, t, e]) => {
      this.sprites.characters = c;
      this.sprites.portraits = p;
      this.sprites.tileset = t;
      this.sprites.enemiesProps = e;
    });
  }

  /**
   * Chiude la guida comandi riportando il gioco esattamente dov'era:
   * titolo -> titolo, partita -> partita. Unico punto di uscita (§1.5).
   */
  closeControlsModal() {
    this.showControlsModal = false;
    const back = this._helpReturnScene;
    this._helpReturnScene = null;
    if (back && back !== "title" && this.scene === "paused") {
      this.scene = this._helpWasRunning ? "playing" : "paused";
      if (this._helpWasRunning) {
        this.paused = false;
        this.input.keys.clear();
        this.input.justPressed.clear();
      }
    }
    return back;
  }

  getTitleOptions() {
    const opts = [
      {
        id: "openday",
        label: "★ MODALITA OPEN DAY (7-10 MIN)",
        sub: "Demo con tutti e 5 i protagonisti!",
      },
      {
        id: "campaign_new",
        label: "AVVIA CAMPAGNA COMPLETA",
        sub: "6 Capitoli • 18 Mappe • 7 Moduli",
      },
    ];
    if (this.state.hasSavedCampaign()) {
      opts.push({
        id: "campaign_continue",
        label: "CONTINUA CAMPAGNA SALVATA",
        sub: "Riprendi dal checkpoint salvato",
      });
    }
    opts.push({
      id: "team_follow",
      label: `SQUADRA AL SEGUITO: ${this.state.audioPrefs.followTeam ? "SI" : "NO"}`,
      sub: "I compagni ti restano accanto [G]",
    });
    opts.push({
      id: "controls",
      label: "COMANDI & MIXER AUDIO",
      sub: "Tastiera, Gamepad, Volumi e CRT [V]",
    });
    return opts;
  }

  startMode(mode, resumeSaved = false) {
    if (mode === "campaign" && resumeSaved && this.state.loadCampaign()) {
      this.levels = buildCampaignLevels();
    } else {
      this.state.reset(mode);
      this.levels = mode === "openday" ? buildOpenDayLevels() : buildCampaignLevels();
    }
    this.activeDialogue = null;
    this.activeQuiz = null;
    this.minigames.active = null;
    this.scene = "playing";
    this.loadRoom(this.state.data.roomIndex || 0);
  }

  instantOpenDayVisitorReset() {
    this.audio.setDucking(false);
    this.activeDialogue = null;
    this.activeQuiz = null;
    this.minigames.active = null;
    this.showControlsModal = false;
    this.scene = "title";
    this.titleIndex = 0;
    this.audio.playTrack("main");
  }

  loadRoom(index) {
    const safeIdx = Math.max(0, Math.min(this.levels.length - 1, index));
    this.state.data.roomIndex = safeIdx;
    const bp = this.levels[safeIdx];
    this.state.data.chapterIndex = bp.chapter;
    if (!this.state.data.checkpoint || this.state.data.checkpoint.roomId !== bp.id) {
      this.state.data.checkpoint = { roomId: bp.id, x: bp.spawn.x, y: bp.spawn.y };
    }
    this.state.saveCampaign();

    this.world = new WorldRuntime(bp, this.state, this.audio, {
      onStartDialogue: (dlgId) => this.startDialogue(dlgId),
      onStartQuiz: (terminalObj) => this.startQuiz(terminalObj),
      onStartMinigame: (mgEntity) => this.startMinigameEntity(mgEntity),
      onRoomExit: () => this.advanceRoom(),
      onBossDefeated: () => this.triggerVictoryEnding(),
      onSubRoomChange: (subTitle) => this.ui.showRoomBanner(subTitle, "Esplora l'ambiente e premi [E] sulla porta per uscire"),
    });

    this.audio.playTrack(bp.music);
    this.ui.showRoomBanner(bp.name, bp.subtitle);
  }

  advanceRoom() {
    const next = this.state.data.roomIndex + 1;
    if (next >= this.levels.length) {
      this.triggerVictoryEnding();
    } else {
      this.state.data.checkpoint = null;
      this.loadRoom(next);
    }
  }

  triggerVictoryEnding() {
    this.scene = "ending";
    this.audio.setDucking(false);
    this.audio.playTrack("victory");
    if (this.state.data.mode === "campaign") {
      this.state.clearSavedCampaign();
    }
  }

  // ===========================================================================
  // DIALOGHI A SCELTA E POSTAZIONI INTERATTIVE EIPASS
  // ===========================================================================
  startDialogue(dlgId) {
    const script = DIALOGUES[dlgId];
    if (!script) return;
    if (script.unlockChar) {
      this.state.unlockCharacter(script.unlockChar);
      this.state.data.activeChar = script.unlockChar;
    }
    this.audio.setDucking(true);
    this.activeDialogue = {
      script,
      nodeIdx: 0,
      currentNode: script.nodes[0],
      charCount: 0,
      choiceIndex: 0,
      blipTick: 0,
    };
  }

  updateDialogue() {
    const d = this.activeDialogue;
    if (!d || !d.currentNode) return;
    const node = d.currentNode;

    if (d.charCount < node.text.length) {
      d.charCount = Math.min(node.text.length, d.charCount + 2.6); // v3.1: testo un po' più rapido (dialoghi meno "pesanti")
      d.blipTick++;
      if (d.blipTick % 4 === 0) {
        const freq = CHARACTERS[node.speaker]?.blipFreq || 260;
        this.audio.playSfx("blip", freq);
      }
      if (this.input.confirmPressed || this.input.jumpPressed) {
        d.charCount = node.text.length;
      }
      return;
    }

    if (node.choices) {
      if (this.input.upPressed) {
        d.choiceIndex = (d.choiceIndex + node.choices.length - 1) % node.choices.length;
        this.audio.playSfx("blip", 350);
      }
      if (this.input.downPressed) {
        d.choiceIndex = (d.choiceIndex + 1) % node.choices.length;
        this.audio.playSfx("blip", 350);
      }
      if (this.input.numberPressed >= 1 && this.input.numberPressed <= node.choices.length) {
        d.choiceIndex = this.input.numberPressed - 1;
        this.commitDialogueChoice(node, d.choiceIndex);
        return;
      }
      if (this.input.confirmPressed) {
        this.commitDialogueChoice(node, d.choiceIndex);
      }
    } else if (this.input.confirmPressed) {
      if (node.end || d.nodeIdx + 1 >= d.script.nodes.length) {
        this.activeDialogue = null;
        this.audio.setDucking(false);
      } else {
        d.nodeIdx++;
        d.currentNode = d.script.nodes[d.nodeIdx];
        d.charCount = 0;
        d.choiceIndex = 0;
      }
    }
  }

  commitDialogueChoice(node, idx) {
    const ch = node.choices[idx];
    this.audio.playSfx("confirm");
    this.state.recordChoice(node.choiceId || "choice", ch.label, ch.summary, ch.effects || {});
    if (ch.worldAction && this.world) {
      this.world.executeWorldAction(ch.worldAction);
    }
    if (ch.next !== undefined && this.activeDialogue.script.nodes[ch.next]) {
      this.activeDialogue.nodeIdx = ch.next;
      this.activeDialogue.currentNode = this.activeDialogue.script.nodes[ch.next];
      this.activeDialogue.charCount = 0;
      this.activeDialogue.choiceIndex = 0;
    } else {
      this.activeDialogue = null;
      this.audio.setDucking(false);
    }
  }

  startQuiz(terminalEntity) {
    const ch = EIPASS_CHALLENGES[terminalEntity.quizId];
    if (!ch) return;
    this.audio.setDucking(true);
    this.audio.playSfx("interact");
    this.activeQuiz = {
      terminal: terminalEntity,
      challenge: ch,
      selectedIndex: 0,
      answered: false,
      wasCorrect: false,
    };
  }

  updateQuiz() {
    const q = this.activeQuiz;
    if (!q) return;

    if (!q.answered) {
      if (this.input.upPressed || this.input.leftPressed) {
        q.selectedIndex = (q.selectedIndex + q.challenge.options.length - 1) % q.challenge.options.length;
        this.audio.playSfx("blip", 340);
      }
      if (this.input.downPressed || this.input.rightPressed) {
        q.selectedIndex = (q.selectedIndex + 1) % q.challenge.options.length;
        this.audio.playSfx("blip", 340);
      }
      if (this.input.numberPressed >= 1 && this.input.numberPressed <= q.challenge.options.length) {
        q.selectedIndex = this.input.numberPressed - 1;
        this.submitQuizAnswer();
        return;
      }
      if (this.input.confirmPressed) {
        this.submitQuizAnswer();
      }
    }
    // Il pannello si chiude da solo dopo il feedback (INVIO lo chiude prima)
    this.updateQuizFeedback(1);
  }

  submitQuizAnswer() {
    const q = this.activeQuiz;
    if (!q || q.answered) return;
    const chosen = q.challenge.options[q.selectedIndex];
    q.answered = true;
    q.wasCorrect = !!chosen.correct;
    q.terminal.cleared = true;

    this.state.recordQuizOutcome(q.challenge.id, q.challenge.moduleIndex, q.wasCorrect);

    // IL VARCO SI APRE SOLO CON LA RISPOSTA CORRETTA.
    // Con un errore la postazione resta da rifare: si può ritentare subito dopo il feedback.
    if (q.wasCorrect) {
      if (q.terminal.targetGateId && this.world) {
        this.world.openGate(q.terminal.targetGateId, true);
      }
      this.audio.playSfx("correct");
      this.state.data.shield = Math.min(3, this.state.data.shield + 1);
      if (this.world) {
        this.world.addFloatingText(this.world.player.x, this.world.player.y - 16, "EIPASS OK! +SCUDO", "#4ade80");
      }
    } else {
      this.audio.playSfx("wrong");
      // La postazione torna disponibile: nessun voto "superato" con una risposta sbagliata.
      if (this.world) {
        for (const t of this.world.terminals) {
          if (t.quizId === q.challenge.id) t.cleared = false;
        }
        this.world.executeWorldAction("spawn_guard_drone");
      }
    }
    q.closeTimer = q.wasCorrect ? 150 : 190;
  }

  /** Il pannello del quiz si chiude DA SOLO dopo il feedback (o subito con INVIO). */
  updateQuizFeedback(frames) {
    const q = this.activeQuiz;
    if (!q || !q.answered) return;
    q.closeTimer -= frames;
    if (q.closeTimer <= 0 || this.input.confirmPressed) {
      this.activeQuiz = null;
      this.audio.setDucking(false);
      this.input.justPressed.clear();
    }
  }

  startMinigameEntity(mgEntity) {
    this.minigames.start(mgEntity.mgType, mgEntity.mgConfig, () => {
      mgEntity.done = true;
      if (mgEntity.targetGateId && this.world) {
        this.world.openGate(mgEntity.targetGateId, false);
      }
    });
  }

  // ===========================================================================
  // LOOP PRINCIPALE A PASSO FISSO 60 FPS
  // ===========================================================================
  loop(timestamp) {
    if (!this.lastFrameTime) this.lastFrameTime = timestamp;
    const delta = Math.min(64, timestamp - this.lastFrameTime);
    this.lastFrameTime = timestamp;
    this.accumulator += delta;

    const STEP = 1000 / 60;
    while (this.accumulator >= STEP) {
      this.stepSimulation();
      this.accumulator -= STEP;
    }

    this.renderFrame();
    requestAnimationFrame((ts) => this.loop(ts));
  }

  stepSimulation() {
    this.input.poll();

    // Tutto il tempo di gioco avanza QUI (60 Hz fissi), mai nel render.
    this.renderer.stepAnimation();
    this.ui.stepHUD(this.state);

    if (this.input.mutePressed) {
      this.state.audioPrefs.muted = this.audio.toggleMute();
      this.state.saveAudioPrefs();
    }
    if (this.input.crtTogglePressed) {
      this.state.audioPrefs.crt = !this.state.audioPrefs.crt;
      this.state.saveAudioPrefs();
      this.audio.playSfx("blip", 480);
    }
    if (this.input.quickResetPressed) {
      this.instantOpenDayVisitorReset();
      return;
    }
    // [Y] schermo intero (PC): funziona in qualunque scena
    if (this.input.fullscreenPressed) {
      try {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      } catch (e) {
        /* i browser senza fullscreen ignorano: nessun crash */
      }
    }
    // F2 = pausa audio rapida? no: [M] già presente.

    // [G] cambia al volo "Squadra al seguito" (stessa opzione del menu iniziale e della pausa)
    if (this.input.teamTogglePressed) {
      const on = this.toggleTeamFollow();
      this.world?.addFloatingText(
        this.world.player.x - 24,
        this.world.player.y - 26,
        on ? "SQUADRA AL SEGUITO: SI" : "SQUADRA AL SEGUITO: NO",
        on ? "#4ade80" : "#94a3b8"
      );
    }

    // F1 (o "?") apre/CHIUDE la guida comandi da qualsiasi schermata (§1.5, §1.6).
    // Prima: dalla pausa il secondo F1 non chiudeva niente, e sul titolo non faceva nulla.
    if (this.input.helpPressed) {
      if (this.showControlsModal) {
        this.closeControlsModal();
        this.audio.playSfx("confirm");
        return;
      }
      const fromScene = this.scene;
      this.showControlsModal = true;
      this._helpReturnScene = fromScene;
      this._helpWasRunning = !this.paused;
      if (fromScene !== "title") this.scene = "paused";
      this.audio.playSfx("confirm");
      return;
    }

    if (this.scene === "title") {
      this.updateTitleScene();
    } else if (this.scene === "playing") {
      this.updatePlayingScene();
    } else if (this.scene === "paused") {
      this.updatePauseScene();
    } else if (this.scene === "ending") {
      if (this.input.confirmPressed || this.input.pausePressed) {
        this.instantOpenDayVisitorReset();
      }
    }
  }

  updateTitleScene() {
    if (this.showControlsModal) {
      if (this.input.leftPressed) {
        this.audio.setMusicVolume(this.audio.musicVol - 0.1);
        this.state.audioPrefs.musicVol = this.audio.musicVol;
        this.state.saveAudioPrefs();
      }
      if (this.input.rightPressed) {
        this.audio.setMusicVolume(this.audio.musicVol + 0.1);
        this.state.audioPrefs.musicVol = this.audio.musicVol;
        this.state.saveAudioPrefs();
      }
      if (this.input.downPressed) {
        this.audio.setSfxVolume(this.audio.sfxVol - 0.1);
        this.state.audioPrefs.sfxVol = this.audio.sfxVol;
        this.state.saveAudioPrefs();
        this.audio.playSfx("confirm");
      }
      if (this.input.upPressed) {
        this.audio.setSfxVolume(this.audio.sfxVol + 0.1);
        this.state.audioPrefs.sfxVol = this.audio.sfxVol;
        this.state.saveAudioPrefs();
        this.audio.playSfx("confirm");
      }
      if (this.input.confirmPressed || this.input.pausePressed) {
        this.closeControlsModal();
        this.audio.playSfx("confirm");
      }
      return;
    }

    const opts = this.getTitleOptions();
    if (this.titleIndex >= opts.length) this.titleIndex = 0;

    if (this.input.upPressed) {
      this.titleIndex = (this.titleIndex + opts.length - 1) % opts.length;
      this.audio.playSfx("blip", 360);
    }
    if (this.input.downPressed) {
      this.titleIndex = (this.titleIndex + 1) % opts.length;
      this.audio.playSfx("blip", 360);
    }
    if (this.input.confirmPressed) {
      const pick = opts[this.titleIndex];
      this.audio.playSfx("confirm");
      if (pick.id === "openday") this.startMode("openday", false);
      else if (pick.id === "campaign_new") this.startMode("campaign", false);
      else if (pick.id === "campaign_continue") this.startMode("campaign", true);
      else if (pick.id === "team_follow") this.toggleTeamFollow();
      else if (pick.id === "controls") this.showControlsModal = true;
    }
  }

  updatePlayingScene() {
    this.state.data.playTimeSec += 1 / 60;

    // [E] sui compagni nel mondo: cambia eroe direttamente (tocco/click su di loro)
    this.checkCompanionSwitch();

    if (this.input.pausePressed && !this.minigames.isActive()) {
      this.scene = "paused";
      this.pauseIndex = 0;
      this.audio.playSfx("interact");
      return;
    }

    if (this.minigames.isActive()) {
      this.minigames.update(this.input);
      return;
    }

    if (this.activeDialogue) {
      this.updateDialogue();
      return;
    }

    if (this.activeQuiz) {
      this.updateQuiz();
      return;
    }

    // Derivato dall'ordine ufficiale: il tasto coincide sempre con la pillola mostrata
    const slotOrder = this.heroSlotOrder();
    if (this.input.numberPressed >= 1 && this.input.numberPressed <= 5) {
      // fallback su CHAR_ORDER: con 2 soli slot il tasto 4 deve comunque dare un messaggio, mai un crash
      const target = slotOrder[this.input.numberPressed - 1] || CHAR_ORDER[this.input.numberPressed - 1];
      if (!this.switchActiveChar(target)) {
        // Feedback chiaro se l'eroe non è ancora sbloccato (prima non succedeva nulla e sembrava rotto)
        const meta = CHARACTERS[target] || { shortName: `EROE ${this.input.numberPressed}` };
        this.world?.addFloatingText(this.world.player.x - 20, this.world.player.y - 22, `${meta.shortName} NON ANCORA IN SQUADRA`, "#94a3b8");
        this.audio.playSfx("wrong");
      }
    } else if (this.input.switchCyclePressed) {
      const unlocked = this.heroSlotOrder().filter((c) => this.state.data.unlockedChars.includes(c));
      const curIdx = unlocked.indexOf(this.state.data.activeChar);
      const nextChar = unlocked[(curIdx + 1) % unlocked.length];
      this.switchActiveChar(nextChar);
    }

    if (this.world) {
      const syn = this.teamSynergy();
      this.world._synergyJumpBonus = syn.jumpBonus;
      this.world._synergySpeedBonus = syn.speedBonus;
      this.world._synergyDmgBonus = syn.dmgBonus;
      // §1.3: i cuori extra della sinergia vengono applicati davvero (non solo dichiarati)
      this.state.applyTeamSynergyHp(syn.maxHpBonus);
      this.world.update(this.input);
    }
  }

  /** Se il giocatore è accanto a un compagno, [E] lo fa diventare l'eroe attivo. */
  checkCompanionSwitch() {
    const w = this.world;
    if (!w || !w.companionActors) return;
    const p = w.player;
    let nearest = null;
    let bestDist = 46;
    for (const actor of w.companionActors) {
      const d = Math.hypot(actor.x - p.x, actor.y - p.y);
      if (d < bestDist) {
        bestDist = d;
        nearest = actor;
      }
    }
    this.world.nearestCompanion = nearest;
    if (!nearest) return;
    if (!this.input.interactPressed) return;
    if (!this.state.data.unlockedChars.includes(nearest.charId)) return;
    if (this.state.data.activeChar === nearest.charId) return;
    // §1.8: il flag va CONSUMATO, altrimenti lo stesso [E] viene letto anche dal
    // gestore delle interazioni e nella stessa frame cambia eroe E apre la postazione.
    this.input.interactPressed = false;
    this.switchActiveChar(nearest.charId);
  }

  /** Opzione "Squadra al seguito": i compagni restano accanto a distanza invece di vagare. */
  toggleTeamFollow() {
    this.state.audioPrefs.followTeam = !this.state.audioPrefs.followTeam;
    this.state.saveAudioPrefs();
    this.audio.playSfx(this.state.audioPrefs.followTeam ? "confirm" : "blip", 420);
    return this.state.audioPrefs.followTeam;
  }

  /**
   * SINERGIA DI SQUADRA: ogni nuovo membro sbloccato lascia un bonus passivo
   * permanente (così "cambiare personaggio" non è solo cosmetico anche quando
   * si è costretti a restare sui due eroi iniziali).
   */
  teamSynergy() {
    const unlocked = this.state.data.unlockedChars || [];
    return {
      unlockedCount: unlocked.length,
      // §1.3: espresso in CUORI (non in "punti" mai applicati): +1 cuore per ogni
      // compagno oltre il primo, fino al cap di 6 del HUD. Viene applicato davvero
      // da state.applyTeamSynergyHp() a ogni frame.
      maxHpBonus: Math.min(1, Math.max(0, unlocked.length - 2)),
      maxHpPoints: Math.max(0, unlocked.length - 1) * 10, // valore "da manuale" (10 punti/cuore)
      jumpBonus: unlocked.includes("daniele") ? 0.15 : 0,
      dmgBonus: unlocked.includes("ruggero") ? 0.08 : 0,
      speedBonus: unlocked.includes("francesco") ? 0.05 : 0,
    };
  }

  /**
   * Ordine FISSO degli slot eroe: 1=Carlo, 2=Ranaldo, poi gli altri due in ordine
   * di squadra. I tasti 1-5 restano così coerenti con le pillole dell'HUD.
   */
  heroSlotOrder() {
    const base = HERO_BASE_ORDER;
    const extra = (this.state.data.unlockedChars || []).filter((c) => !base.includes(c) && CHARACTERS[c]);
    return base.concat(extra);
  }

  /** Cambio eroe con effetto visivo: usato da tasti 1-5, [Q], pillole HUD e [E] vicino ai compagni. */
  switchActiveChar(charId) {
    if (!charId || this.state.data.activeChar === charId) return false;
    if (!this.state.data.unlockedChars.includes(charId)) return false;
    this.state.data.activeChar = charId;
    this.audio.playCharMotif(charId);
    if (this.world) {
      this.world.player.scaleX = 0.85;
      this.world.player.scaleY = 1.18;
      this.world.addParticles(this.world.player.x + 8, this.world.player.y + 14, CHARACTERS[charId].color, 9);
      this.world.addFloatingText(this.world.player.x - 6, this.world.player.y - 22, `${CHARACTERS[charId].shortName} IN CAMPO!`, CHARACTERS[charId].color);
    }
    return true;
  }

  getPauseItems() {
    const mPct = Math.round(this.audio.musicVol * 100);
    const sPct = Math.round(this.audio.sfxVol * 100);
    return [
      { id: "resume", label: "Riprendi Partita" },
      { id: "music_vol", label: `Volume Musica: ${mPct}% (SX/DX)` },
      { id: "sfx_vol", label: `Volume Effetti: ${sPct}% (SX/DX)` },
      { id: "team_follow", label: `Squadra al Seguito: ${this.state.audioPrefs.followTeam ? "SI" : "NO"}` },
      { id: "free_challenges", label: "Sfide Libere (Greco, Latino, Storia...)" },
      { id: "controls", label: "Guida Comandi Completa" },
      { id: "restart_room", label: "Ricomincia Zona Corrente" },
      { id: "openday_reset", label: "Reset Nuovo Visitatore Open Day" },
      { id: "quit_title", label: "Torna al Menu Principale" },
    ];
  }

  /** Apre l'elenco delle sfide libere (greco, latino, storia, calcio, matematica a tempo). */
  openFreeChallengeMenu() {
    this.freeChallengeMenu.open = true;
    this.freeChallengeMenu.index = 0;
    this.audio.playSfx("confirm");
  }

  /** Lancia una sfida libera dal menu pausa: non serve un eroe, non sblocca cancelli. */
  startFreeChallenge(idx) {
    const ch = FREE_CHALLENGES[idx];
    if (!ch) return;
    this.freeChallengeMenu.open = false;
    this.scene = "playing";
    this.minigames.start(ch.type, { id: `free_${ch.type}`, title: ch.title }, () => {
      this.scene = "playing";
      this.state.pushConsequence(`Sfida libera completata: ${ch.title}`, "#38e2d8");
    });
    this.audio.playSfx("confirm");
  }

  updateFreeChallengeMenu() {
    const n = FREE_CHALLENGES.length;
    if (this.input.upPressed) {
      this.freeChallengeMenu.index = (this.freeChallengeMenu.index + n - 1) % n;
      this.audio.playSfx("blip", 350);
    }
    if (this.input.downPressed) {
      this.freeChallengeMenu.index = (this.freeChallengeMenu.index + 1) % n;
      this.audio.playSfx("blip", 350);
    }
    if (this.input.confirmPressed) {
      this.startFreeChallenge(this.freeChallengeMenu.index);
      return;
    }
    if (this.input.pausePressed) {
      this.freeChallengeMenu.open = false;
      this.audio.playSfx("interact");
    }
  }

  updatePauseScene() {
    if (this.freeChallengeMenu.open) {
      this.updateFreeChallengeMenu();
      return;
    }
    if (this.showControlsModal) {
      // Nella guida: SX/DX e SU/GIU regolano i volumi (prima non succedeva nulla)
      if (this.input.leftPressed) {
        this.audio.setMusicVolume(this.audio.musicVol - 0.1);
        this.state.audioPrefs.musicVol = this.audio.musicVol;
        this.state.saveAudioPrefs();
        this.audio.playSfx("blip", 380);
      }
      if (this.input.rightPressed) {
        this.audio.setMusicVolume(this.audio.musicVol + 0.1);
        this.state.audioPrefs.musicVol = this.audio.musicVol;
        this.state.saveAudioPrefs();
        this.audio.playSfx("blip", 400);
      }
      if (this.input.downPressed) {
        this.audio.setSfxVolume(this.audio.sfxVol - 0.1);
        this.state.audioPrefs.sfxVol = this.audio.sfxVol;
        this.state.saveAudioPrefs();
        this.audio.playSfx("blip", 320);
      }
      if (this.input.upPressed) {
        this.audio.setSfxVolume(this.audio.sfxVol + 0.1);
        this.state.audioPrefs.sfxVol = this.audio.sfxVol;
        this.state.saveAudioPrefs();
        this.audio.playSfx("blip", 340);
      }
      if (this.input.confirmPressed || this.input.pausePressed) {
        this.closeControlsModal();
        this.audio.playSfx("confirm");
      }
      return;
    }

    if (this.input.pausePressed) {
      this.scene = "playing";
      return;
    }

    const items = this.getPauseItems();
    if (this.input.upPressed) {
      this.pauseIndex = (this.pauseIndex + items.length - 1) % items.length;
      this.audio.playSfx("blip", 350);
    }
    if (this.input.downPressed) {
      this.pauseIndex = (this.pauseIndex + 1) % items.length;
      this.audio.playSfx("blip", 350);
    }

    const cur = items[this.pauseIndex];
    if (cur.id === "music_vol" && (this.input.leftPressed || this.input.rightPressed)) {
      const delta = this.input.rightPressed ? 0.1 : -0.1;
      this.audio.setMusicVolume(this.audio.musicVol + delta);
      this.state.audioPrefs.musicVol = this.audio.musicVol;
      this.state.saveAudioPrefs();
    } else if (cur.id === "sfx_vol" && (this.input.leftPressed || this.input.rightPressed)) {
      const delta = this.input.rightPressed ? 0.1 : -0.1;
      this.audio.setSfxVolume(this.audio.sfxVol + delta);
      this.state.audioPrefs.sfxVol = this.audio.sfxVol;
      this.state.saveAudioPrefs();
      this.audio.playSfx("confirm");
    }

    if (this.input.confirmPressed) {
      this.audio.playSfx("confirm");
      if (cur.id === "resume") this.scene = "playing";
      else if (cur.id === "team_follow") this.toggleTeamFollow();
      else if (cur.id === "free_challenges") this.openFreeChallengeMenu();
      else if (cur.id === "controls") this.showControlsModal = true;
      else if (cur.id === "restart_room") {
        this.scene = "playing";
        this.loadRoom(this.state.data.roomIndex);
      } else if (cur.id === "openday_reset") {
        this.startMode("openday", false);
      } else if (cur.id === "quit_title") {
        this.instantOpenDayVisitorReset();
      }
    }
  }

  renderFrame() {
    const ctx = this.ctx;
    ctx.imageSmoothingEnabled = false;
    // I comandi touch sono sopra il canvas solo in orizzontale con deck visibile
    if (typeof document !== "undefined") {
      const deck = document.getElementById("touch-deck");
      const visible = deck && getComputedStyle(deck).display !== "none";
      this.ui.touchSafe = !!visible && document.body.classList.contains("touch-enabled") && window.innerWidth > window.innerHeight;
    }

    if (this.scene === "title") {
      if (this.showControlsModal) {
        this.ui.renderControlsScreen(ctx, this.audio);
      } else {
        this.ui.renderTitleMenu(
          ctx,
