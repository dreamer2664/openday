  // ===========================================================================
  // DISEGNO TILE 16x16 CON TILESET_CASARDI.PNG + OMBRE DI STACCO
  // ===========================================================================
  drawTile(ctx, world, t, c, r, x, y) {
    const ts = this.imgs.tileset;
    const theme = world.bp.theme;
    const harmonicSolid = world.harmonicTimer > 0;

    // Leggera ombra sotto le piattaforme sospese per separarle visivamente dallo sfondo!
    if ((t === 2 || t === 4 || (t === 1 && r + 1 < world.rows && world.grid[r + 1][c] === 0)) && t !== 6) {
      ctx.fillStyle = "rgba(9, 13, 26, 0.28)";
      ctx.fillRect(x, y + (t === 2 || t === 4 ? 7 : 16), 16, 3);
    }

    if (ts) {
      let tx = -1;
      if (t === 1) {
        tx =
          theme === "facade"
            ? 0
            : theme === "corridor" || theme === "aulamagna"
            ? 16
            : theme === "courtyard"
            ? 32
            : theme === "lab"
            ? 48
            : 64;
      } else if (t === 2) {
        tx = theme === "library" || theme === "aulamagna" ? 96 : 80;
      } else if (t === 3) {
        tx = 112;
      } else if (t === 4) {
        tx = harmonicSolid ? 128 : 144;
      } else if (t === 5) {
        tx = 160;
      } else if (t === 6) {
        tx = 176;
      } else if (t === 7) {
        tx = 192;
      }

      if (tx >= 0) {
        ctx.drawImage(ts, tx, 0, 16, 16, x, y, 16, 16);
        if (t === 1 && r > 0 && world.grid[r - 1][c] === 1) {
          ctx.fillStyle = "rgba(9, 13, 26, 0.22)";
          ctx.fillRect(x, y, 16, 3);
        }
        return;
      }
    }

    ctx.fillStyle = t === 1 ? "#94a3b8" : t === 2 ? "#e2e8f0" : t === 3 ? "#dc2626" : "#38bdf8";
    ctx.fillRect(x, y, TILE, t === 2 ? 6 : TILE);
  }

  // ===========================================================================
  // ARREDI SCOLASTICI DI PARETE (DISEGNATI IN SECONDO PIANO PULITO)
  // ===========================================================================
  drawWallProps(ctx, world, camX) {
    for (const dec of world.bp.decorations) {
      if (dec.type !== "arch_prop") continue;
      if (dec.x < camX - 200 || dec.x > camX + SCREEN_W + 100) continue;

      if (dec.propKind === "bust" && this.imgs.enemiesProps) {
        // Colonnina di legno + Busto marmoreo classico
        ctx.fillStyle = "#4a2a19";
        ctx.fillRect(dec.x + 3, dec.y - 18, 18, 18);
        ctx.fillStyle = "#6e4027";
        ctx.fillRect(dec.x + 1, dec.y - 20, 22, 3);
        ctx.drawImage(this.imgs.enemiesProps, 128, 32, 32, 32, dec.x - 4, dec.y - 48, 32, 32);
      } else if (dec.propKind === "lim") {
        // Lavagna Interattiva Multimediale (LIM) ampia e leggibile senza alcun taglio del titolo!
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(dec.x, dec.y - 72, 114, 44);
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(dec.x + 2, dec.y - 70, 110, 40);
        ctx.fillStyle = "#0369a1";
        ctx.fillRect(dec.x + 4, dec.y - 68, 106, 36);
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(dec.x + 4, dec.y - 68, 106, 7);
        drawPixelText(ctx, (dec.label || "LIM CASARDI").slice(0, 17), dec.x + 7, dec.y - 55, "#fef08a", 1, null);
      } else if (dec.propKind === "desk_pc") {
        ctx.fillStyle = "#334155";
        ctx.fillRect(dec.x, dec.y - 16, 40, 16);
        ctx.fillStyle = "#64748b";
        ctx.fillRect(dec.x - 2, dec.y - 18, 44, 3);
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(dec.x + 9, dec.y - 33, 22, 15);
        ctx.fillStyle = "#22d3ee";
        ctx.fillRect(dec.x + 11, dec.y - 31, 18, 11);
      } else if (dec.propKind === "piano_grand") {
        // VERO PIANOFORTE A CODA NERO SCOLPITO AL PIXEL SUL PALCO DELL'AULA MAGNA!
        const px = dec.x;
        const py = dec.y - 44;
        // Coperchio superiore aperto inclinato a gradoni pixel-art + asta in ottone!
        for (let step = 0; step < 18; step++) {
          ctx.fillStyle = "#090d1a";
          ctx.fillRect(px + 12 + step * 2, py + 16 - step, 26 - step, 3);
          ctx.fillStyle = "#334155";
          ctx.fillRect(px + 12 + step * 2, py + 15 - step, 4, 1);
        }
        // Asta reggi-coperchio dorata + arpa interna in bronzo dorato
        for (let b = 0; b < 12; b++) {
          ctx.fillStyle = "#eab308";
          ctx.fillRect(px + 38 - Math.floor(b / 3), py + 6 + b, 2, 1);
        }
        ctx.fillStyle = "#b45309";
        ctx.fillRect(px + 16, py + 16, 36, 3);
        // Cassa armonica nera laccata con riflesso bianco/azzurro
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(px, py + 18, 62, 14);
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(px + 2, py + 19, 58, 3);
        // Leggio spartito + tastiera 88 tasti bianco/nera!
        ctx.fillStyle = "#fef3c7";
        ctx.fillRect(px + 6, py + 13, 10, 5);
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(px - 4, py + 24, 24, 5);
        ctx.fillStyle = "#090d1a";
        for (let k = 0; k < 20; k += 4) {
          ctx.fillRect(px - 2 + k, py + 24, 2, 3);
        }
        // Gambe tornite con rotelle in ottone + panchetta imbottita!
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(px + 4, py + 32, 4, 12);
        ctx.fillRect(px + 28, py + 32, 4, 12);
        ctx.fillRect(px + 52, py + 32, 4, 12);
        ctx.fillStyle = "#eab308";
        ctx.fillRect(px + 4, py + 43, 4, 1);
        ctx.fillRect(px + 52, py + 43, 4, 1);
        // Panchetta pianista a sinistra della tastiera
        ctx.fillStyle = "#7f1d1d";
        ctx.fillRect(px - 16, py + 33, 12, 3);
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(px - 15, py + 36, 3, 8);
        ctx.fillRect(px - 7, py + 36, 3, 8);
      } else if (dec.propKind === "trophy") {
        ctx.fillStyle = "#451a03";
        ctx.fillRect(dec.x, dec.y - 44, 36, 44);
        ctx.fillStyle = "#78350f";
        ctx.fillRect(dec.x + 2, dec.y - 42, 32, 40);
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(dec.x + 4, dec.y - 38, 28, 22);
        ctx.fillStyle = "#facc15";
        ctx.fillRect(dec.x + 8, dec.y - 30, 8, 12);
        ctx.fillRect(dec.x + 20, dec.y - 26, 8, 8);
      }
    }
  }

  drawHintSigns(ctx, world, _camX) {
    if (world.activeBanter) return;
    let best = null;
    let bestDist = 150;
    for (const dec of world.bp.decorations) {
      if (dec.type !== "hint") continue;
      const dist = Math.abs(world.player.x - dec.x);
      if (dist < bestDist) {
        bestDist = dist;
        best = dec;
      }
    }
    if (!best) return;
    const txt = `★ ${best.text}`;
    const w = Math.min(SCREEN_W - 20, measurePixelText(txt, 1) + 16);
    const bx = Math.round((SCREEN_W - w) / 2);
    const by = SCREEN_H - 21;
    drawPixelPanel(ctx, bx, by, w, 17, "rgba(9, 14, 28, 0.94)", "#38bdf8", "#1e3a8a");
    drawPixelText(ctx, txt.slice(0, 74), bx + 8, by + 5, "#fef08a", 1);
  }

  drawInteractiveProps(ctx, world) {
    // Canestri-Relè per Carlo (con asta di supporto ancorata in modo pulito!)
    for (const h of world.hoops) {
      ctx.fillStyle = "#334155";
      ctx.fillRect(h.x + 12, h.y - 8, 4, 24);
      ctx.fillStyle = "#090d1a";
      ctx.fillRect(h.x + 7, h.y - 12, 8, 22);
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(h.x + 8, h.y - 11, 6, 20);
      ctx.fillStyle = "#dc2626";
      ctx.fillRect(h.x + 9, h.y - 4, 4, 6);
      ctx.fillStyle = h.activated ? "#22c55e" : "#f97316";
      ctx.fillRect(h.x - 5, h.y + 2, 16, 3);
      ctx.strokeStyle = "#e2e8f0";
      ctx.strokeRect(h.x - 3, h.y + 5, 12, 8);
    }

    // Checkpoint (Stendardo Casardi oro/verde)
    for (const cp of world.checkpoints) {
      ctx.fillStyle = "#090d1a";
      ctx.fillRect(cp.x + 5, cp.y - 8, 4, 26);
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(cp.x + 6, cp.y - 7, 2, 24);
      ctx.fillStyle = cp.active ? "#16a34a" : "#475569";
      ctx.fillRect(cp.x + 8, cp.y - 7, 15, 10);
      drawPixelText(ctx, cp.active ? "OK" : "CP", cp.x + 10, cp.y - 5, "#ffffff", 1, null);
    }

    // Terminali CRT EIPASS
    for (const tm of world.terminals) {
      if (this.imgs.enemiesProps) {
        ctx.drawImage(this.imgs.enemiesProps, 96, 32, 32, 32, tm.x - 4, tm.y - 14, 32, 32);
      }
      const badgeCol = tm.cleared ? "#4ade80" : this.tick % 30 < 15 ? "#fde047" : "#38bdf8";
      drawPixelText(ctx, tm.cleared ? "OK" : "EIP", tm.x + 3, tm.y - 20, badgeCol, 1);
    }

    // Postazioni Minigioco
    for (const mg of world.minigames) {
      const col =
        mg.mgType === "basket"
          ? "#f97316"
          : mg.mgType === "piano"
          ? "#38e2d8"
          : mg.mgType === "athletics" || mg.mgType === "football"
          ? "#f45565"
          : mg.mgType === "dance" || mg.mgType === "netdiag"
          ? "#f472b6"
          : mg.mgType === "firewall"
          ? "#a855f7"
          : mg.mgType === "filesorter"
          ? "#22d3ee"
          : "#ffd147";
      drawPixelPanel(ctx, mg.x - 3, mg.y - 10, 28, 28, "#0f172a", mg.done ? "#22c55e" : col, "#1e293b");
      const tag =
        mg.mgType === "basket"
          ? "BSK"
          : mg.mgType === "piano"
          ? "KEY"
          : mg.mgType === "athletics" || mg.mgType === "football"
          ? "RUN"
          : mg.mgType === "dance" || mg.mgType === "netdiag"
          ? "DAN"
          : mg.mgType === "firewall"
          ? "FW!"
          : mg.mgType === "filesorter"
          ? "SSD"
          : "MAT";
      drawPixelText(ctx, mg.done ? "OK!" : tag, mg.x + 2, mg.y, mg.done ? "#4ade80" : col, 1);
    }

    // Porte Sotto-Aule / Redazione Pegaso esplorabili (portale in legno con insegna luminosa!)
    for (const sd of world.subDoors) {
      ctx.fillStyle = "#090d1a";
      ctx.fillRect(sd.x - 4, sd.y - 26, 34, 50);
      ctx.fillStyle = "#5c3419";
      ctx.fillRect(sd.x - 3, sd.y - 25, 32, 49);
      ctx.fillStyle = "#b45309";
      ctx.fillRect(sd.x, sd.y - 12, 26, 36);
      ctx.fillStyle = "#92400e";
      ctx.fillRect(sd.x + 3, sd.y - 8, 20, 13);
      ctx.fillRect(sd.x + 3, sd.y + 8, 20, 13);
      ctx.fillStyle = this.tick % 40 < 20 ? "#fde047" : "#38bdf8";
      ctx.fillRect(sd.x, sd.y - 22, 26, 8);
      ctx.fillStyle = "#fbbf24";
      ctx.fillRect(sd.x + 21, sd.y + 6, 3, 3);
    }

    // Porte d'uscita al livello successivo
    for (const ex of world.exits) {
      ctx.fillStyle = "#090d1a";
      ctx.fillRect(ex.x - 2, ex.y - 14, 30, 40);
      ctx.fillStyle = "#7c2529";
      ctx.fillRect(ex.x - 1, ex.y - 13, 28, 38);
      ctx.fillStyle = "#fde047";
      ctx.fillRect(ex.x + 2, ex.y - 10, 22, 35);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(ex.x + 4, ex.y - 8, 18, 33);
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(ex.x + 6, ex.y - 4, 14, 10);
      drawPixelText(ctx, "▶", ex.x + 11, ex.y + 11, "#fde047", 1, null);
    }
  }

  drawCollectibles(ctx, world) {
    const bob = Math.round(Math.sin(this.tick * 0.12) * 2);
    for (const it of world.items) {
      if (it.taken) continue;
      if (it.kind === "token") {
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(it.x - 1, it.y - 1 + bob, 10, 10);
        ctx.fillStyle = "#0ea5e9";
        ctx.fillRect(it.x, it.y + bob, 8, 8);
        ctx.fillStyle = "#fef08a";
        ctx.fillRect(it.x + 2, it.y + 2 + bob, 4, 4);
      } else if (it.kind === "heart" && this.imgs.enemiesProps) {
        ctx.drawImage(this.imgs.enemiesProps, 32, 32, 32, 32, it.x - 7, it.y - 8 + bob, 28, 28);
      } else if (it.kind === "pegaso" && this.imgs.enemiesProps) {
        ctx.drawImage(this.imgs.enemiesProps, 0, 32, 32, 32, it.x - 7, it.y - 8 + bob, 30, 30);
      }
    }
  }

  drawDialogueNPCs(ctx, world) {
    if (!this.imgs.characters) return;
    for (const dg of world.dialogues) {
      if (!dg.npcChar || dg.triggered) continue;
      const meta = CHARACTERS[dg.npcChar];
      if (!meta) continue;
      const pose = Math.floor(this.tick / 14) % 4;
      const dx = Math.round(dg.x) - 8;
      const dy = Math.round(dg.y) - 18;
      ctx.drawImage(
        this.imgs.characters,
        pose * CHAR_SPRITE_W,
        meta.row * CHAR_SPRITE_H,
        CHAR_SPRITE_W,
        CHAR_SPRITE_H,
        dx,
        dy,
        CHAR_SPRITE_W,
        CHAR_SPRITE_H
      );
      const bob = Math.round(Math.sin(this.tick * 0.15) * 2);
      drawPixelPanel(ctx, dx + 10, dy - 13 + bob, 13, 13, "#ffd147", "#090d1a", "#fde047");
      drawPixelText(ctx, "!", dx + 14, dy - 10 + bob, "#090d1a", 1, null);
    }
  }

  drawEnemiesAndBoss(ctx, world) {
    const animF = Math.floor(this.tick / 14) % 2;
    if (!this.imgs.enemiesProps) return;

    for (const e of world.enemies) {
      if (!e.alive) continue;
      const baseSlot =
        e.kind === "spambot"
          ? 0
          : e.kind === "drone"
          ? 2
          : e.kind === "crab"
          ? 4
          : e.kind === "slime"
          ? 6
          : 8;
      const sx = (baseSlot + animF) * 32;
      if (e.stun > 0 && this.tick % 6 < 3) ctx.globalAlpha = 0.55;
      ctx.drawImage(this.imgs.enemiesProps, sx, 0, 32, 32, Math.round(e.x) - 6, Math.round(e.y) - 8, 32, 32);
      ctx.globalAlpha = 1.0;
    }

    // Mid-Boss di Capitolo
    if (world.midBoss && !world.midBoss.defeated) {
      const mb = world.midBoss;
      if (!(mb.invuln > 0 && this.tick % 4 < 2)) {
        const sx = (mb.bossKind === "kraken" ? 208 : 104) + animF * 52;
        ctx.drawImage(this.imgs.enemiesProps, sx, 65, 48, 60, Math.round(mb.x) - 4, Math.round(mb.y) - 6, 48, 60);
      }
    }

    // Il Sofista Digitale 404-Ω con aura energetica olografica!
    if (world.boss && !world.boss.defeated) {
      const b = world.boss;
      if (!(b.invuln > 0 && this.tick % 4 < 2)) {
        const bx = Math.round(b.x) - 5;
        const by = Math.round(b.y) - 6;
        // Aura mistica dietro al Boss
        ctx.fillStyle = b.phase === 3 ? "rgba(244, 63, 94, 0.22)" : "rgba(192, 38, 211, 0.18)";
        ctx.fillRect(bx + 4, by + 6, 40, 48);
        const sx = animF * 52;
        ctx.drawImage(this.imgs.enemiesProps, sx, 65, 48, 60, bx, by, 48, 60);
        if (b.stunTimer > 0) {
          drawPixelText(ctx, "STORDITO!", bx + 2, by - 10, "#38bdf8", 1);
        }
      }
    }
  }

  /** Compagni di squadra visibili: sprite 32x36 con sigla e alone quando sono "prendibili" con [E]. */
  drawCompanions(ctx, world) {
    if (!this.imgs.characters || !world.companionActors) return;
    for (const a of world.companionActors) {
      const meta = CHARACTERS[a.charId];
      if (!meta) continue;
      const bob = Math.round(Math.sin((this.tick + a.bob) * 0.09) * 1.5);
      const px = Math.round(a.x);
      const py = Math.round(a.y) - bob;
      const isNear = world.nearestCompanion && world.nearestCompanion.charId === a.charId;

      // alone luminoso quando [E] è disponibile
      if (isNear) {
        ctx.fillStyle = "rgba(255, 209, 71, 0.20)";
        ctx.fillRect(px - 3, py - 4, 38, 44);
      }

      // ombra a terra
      ctx.fillStyle = "rgba(9, 13, 26, 0.28)";
      ctx.fillRect(px + 8, py + 34, 16, 3);

      const walk = Math.floor((this.tick + a.bob) / 12) % 4;
      ctx.drawImage(this.imgs.characters, walk * 32, meta.row * 36, 32, 36, px, py, 32, 36);

      // sigla sopra la testa
      const sig = meta.shortName;
      const sigW = sig.length * 6 + 6;
      ctx.fillStyle = "rgba(9, 13, 26, 0.82)";
      ctx.fillRect(px + 16 - sigW / 2, py - 12, sigW, 10);
      drawPixelText(ctx, sig, px + 19 - sigW / 2, py - 10, isNear ? "#ffd147" : meta.color, 1);
    }
  }

  drawAssistAndPlayer(ctx, world) {
    if (!this.imgs.characters) return;

    if (world.assistActor) {
      const a = world.assistActor;
      const meta = CHARACTERS[a.charId] || CHARACTERS.carlo;
      ctx.save();
      ctx.globalAlpha = Math.min(1, a.ttl / 12);
      const ax = Math.round(a.x) - 8;
      const ay = Math.round(a.y) - 9;
      if (a.facing < 0) {
        ctx.translate(ax + CHAR_SPRITE_W, ay);
        ctx.scale(-1, 1);
        ctx.drawImage(this.imgs.characters, 10 * 32, meta.row * 36, 32, 36, 0, 0, 32, 36);
      } else {
        ctx.drawImage(this.imgs.characters, 10 * 32, meta.row * 36, 32, 36, ax, ay, 32, 36);
      }
      ctx.restore();
    }

    const p = world.player;
    if (p.invuln > 0 && this.tick % 6 < 3) return;

    const meta = CHARACTERS[world.state.data.activeChar] || CHARACTERS.carlo;
    let pose = 0;
    if (p.invuln > 45) pose = 12;
    else if (p.victoryTimer > 0) pose = 11;
    else if (p.actionAnim > 0) pose = 10;
    else if (!p.onGround) pose = p.vy < 0 ? 8 : 9;
    else if (Math.abs(p.vx) > 0.25) pose = 4 + (Math.floor(p.walkTimer) % 4);
    else pose = Math.floor(this.tick / 14) % 4;

    const footX = Math.round(p.x + p.w / 2);
    const footY = Math.round(p.y + p.h);

    ctx.save();
    ctx.translate(footX, footY);
    ctx.scale(p.facing * p.scaleX, p.scaleY);
    ctx.drawImage(
      this.imgs.characters,
      pose * CHAR_SPRITE_W,
      meta.row * CHAR_SPRITE_H,
      CHAR_SPRITE_W,
      CHAR_SPRITE_H,
      -CHAR_SPRITE_W / 2,
      -CHAR_SPRITE_H + 2,
      CHAR_SPRITE_W,
      CHAR_SPRITE_H
    );
    ctx.restore();

    if (world.state.data.shield > 0) {
      ctx.strokeStyle = "rgba(56, 189, 248, 0.8)";
      ctx.strokeRect(Math.round(p.x) - 3, Math.round(p.y) - 3, p.w + 6, p.h + 5);
    }
  }

  drawProjectiles(ctx, world) {
    for (const pr of world.projectiles) {
      const px = Math.round(pr.x);
      const py = Math.round(pr.y);
      if (pr.kind === "basketball") {
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(px - 5, py - 5, 10, 10);
        ctx.fillStyle = "#f97316";
        ctx.fillRect(px - 4, py - 4, 8, 8);
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(px - 4, py, 8, 1);
      } else if (pr.kind === "salsa_wave") {
        // Passo di Salsa di Daniele: anello rosa ritmico che pulsa a tempo
        const pulse = Math.sin(this.tick * 0.35) * 3;
        ctx.strokeStyle = "rgba(244, 114, 182, 0.7)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, py, (pr.radius || 10) + pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = "rgba(192, 132, 252, 0.45)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(px, py, (pr.radius || 10) + 6 + pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#fbcfe8";
        ctx.fillRect(px - 2, py - 3, 4, 6);
        ctx.fillStyle = "#f472b6";
        ctx.fillRect(px - 1, py - 4, 2, 2);
        ctx.fillRect(px - 1, py + 2, 2, 2);
      } else if (pr.kind === "football") {
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(px - 5, py - 5, 10, 10);
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(px - 4, py - 4, 8, 8);
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(px - 1, py - 1, 3, 3);
      } else if (pr.kind === "music_note") {
        drawPixelText(ctx, "♪", px - 3, py - 4, "#38e2d8", 1);
      } else if (pr.kind === "golden_compass") {
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(px - 5, py - 5, 10, 10);
        ctx.fillStyle = "#fde047";
        ctx.fillRect(px - 4, py - 4, 8, 2);
        ctx.fillRect(px - 4, py - 4, 2, 8);
        ctx.fillRect(px - 2, py - 2, 4, 4);
      } else if (pr.kind === "harmonic_wave") {
        ctx.strokeStyle = "#38e2d8";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, py, pr.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 1;
      } else if (pr.kind === "sound_ring") {
        ctx.strokeStyle = "#f472b6";
        ctx.lineWidth = 2;
        ctx.strokeRect(px - 5, py - 7, 10, 14);
        ctx.lineWidth = 1;
      } else if (pr.kind === "enemy_orb") {
        ctx.fillStyle = "#090d1a";
        ctx.fillRect(px - 5, py - 5, 10, 10);
        ctx.fillStyle = "#e879f9";
        ctx.fillRect(px - 4, py - 4, 8, 8);
        ctx.fillStyle = "#22d3ee";
        ctx.fillRect(px - 2, py - 2, 4, 4);
      }
    }
  }
}


// === MODULE: src/ui/hudAndMenus.js ===
// Interfaccia Utente Pixel-Art v2.0: Font Bitmap 8-Bit, Ritratti 64x64 a 6 Espressioni,
// Notifiche Stile Telltale, Banter in Tempo Reale, Postazioni Interattive EIPASS e Filtro CRT Arcade!


// Ordine righe del portraits_sheet.png (8 righe x 6 espressioni, 64x64):
// generato da tools/generate_assets.py -> ["ranaldo","carlo","francesco","ruggero","daniele","sofista","sofia","mimmo"]
const PORTRAIT_ROWS = {
  ranaldo: 0,
  carlo: 1,
  francesco: 2,
  ruggero: 3,
  daniele: 4,
  sofista: 5,
  sofia: 6,
  mimmo: 7,
};

const SPEAKER_NAMES = {
  ranaldo: "PROF. RANALDO (Matematica)",
  carlo: "CARLO (Basket #23)",
  francesco: "FRANCESCO (Pianoforte)",
  ruggero: "RUGGERO (Atletica Leggera)",
  daniele: "DANIELE (Ballerino Latino-Americano)",
  sofista: "IL SOFISTA DIGITALE 404-Ω",
  sofia: "SOFIA (Caporedattrice Pegaso)",
  mimmo: "MIMMO (Collaboratore Storico)",
};

// L'HUD segue l'ordine ufficiale (CHAR_ORDER): tasto mostrato == tasto che risponde.
const HUD_SLOT_ORDER = CHAR_ORDER;
class UIManager {
  constructor(spriteImages) {
    // true quando il controller touch è visibile sopra il canvas (orizzontale): riserva l'angolo
    this.touchSafe = false;
    this.imgs = spriteImages;
    this.bannerText = "";
    this.bannerSub = "";
    this.bannerTimer = 0;
    this.tick = 0;
  }

  showRoomBanner(title, subtitle = "") {
    this.bannerText = title;
    this.bannerSub = subtitle;
    this.bannerTimer = 185;
  }

  // ===========================================================================
  // MENU PRINCIPALE — FACCIATA VIVA + 4 PROTAGONISTI ANIMATI + PULSANTI ARCADE
  // ===========================================================================
  renderTitleMenu(ctx, renderer, menuIndex, options, audio, _hasSave) {
    // tick del titolo: avanzato in stepHUD (animazione costante a 60 Hz su ogni schermo)
    // Centra perfettamente la vista sulle due grandi colonne bianche e sul portale di Via d'Aragona 100!
    renderer.drawEnvironmentBackground(ctx, "facade", Math.sin(this.tick * 0.007) * 14, 0);

    // 1. Marquee Superiore Compatta: lascia 100% visibili colonne, bandiere IT/UE e portale!
    drawPixelPanel(ctx, 14, 5, SCREEN_W - 28, 49, "rgba(9, 14, 28, 0.93)", "#ffd147", "#1e3a8a");
    drawPixelTextCentered(ctx, "OPERAZIONE EIPASS", SCREEN_W / 2, 11, "#ffd147", 2);
    drawPixelTextCentered(
      ctx,
      "★ IL CASARDI IN 8 BIT • Liceo 'A. Casardi' Barletta ★",
      SCREEN_W / 2,
      30,
      "#38bdf8",
      1
    );
    drawPixelTextCentered(
      ctx,
      "Carlo • Ranaldo • Daniele • Ruggero • Francesco",
      SCREEN_W / 2,
      42,
      "#fde047",
      1
    );

    // 2. Pedana in basso a sinistra con i 5 Protagonisti 32x36 animati
    drawPixelPanel(ctx, 6, 176, 178, 70, "rgba(11, 17, 32, 0.91)", "#ffd147", "#1e293b");
    drawPixelTextCentered(ctx, "SQUADRA DEL CASARDI", 95, 180, "#fde047", 1);
    if (this.imgs.characters) {
      const pose = Math.floor(this.tick / 14) % 4;
      // 5 sprite da 26px dentro un pannello largo 178: 5*26 = 130px, sempre dentro
      const slotW = 26;
      const squadW = CHAR_ORDER.length * slotW;
      const startX = 6 + Math.max(4, Math.round((178 - squadW) / 2));
      CHAR_ORDER.forEach((cid, i) => {
        const meta = CHARACTERS[cid];
        ctx.drawImage(
          this.imgs.characters,
          pose * CHAR_SPRITE_W,
          meta.row * CHAR_SPRITE_H,
          CHAR_SPRITE_W,
          CHAR_SPRITE_H,
          startX + i * slotW,
          190,
          CHAR_SPRITE_W,
          CHAR_SPRITE_H
        );
      });
      // Sigle allineate SOTTO il proprio sprite, nell'ordine reale dei 5 slot
      CHAR_ORDER.forEach((cid, i) => {
        const sig = CHARACTERS[cid].shortName.slice(0, 3).toUpperCase();
        const cx = startX + i * slotW + slotW / 2;
        drawPixelText(ctx, sig, Math.round(cx - measurePixelText(sig, 1) / 2), 230, CHARACTERS[cid].color || "#cbd5e1", 1);
      });
    }

    // 3. Pannello Selezione Modalità compatto in basso a destra (lascia respirare tutta la facciata!)
    // Il pannello si dimensiona sul numero REALE di voci: nessuna voce fuori cornice
    const PANEL_X = 190;
    const PANEL_W = SCREEN_W - PANEL_X - 6;
    const stepH = 27;
    const panelH = Math.min(SCREEN_H - 24, 8 + options.length * stepH + 4);
    const panelY = SCREEN_H - 20 - panelH - 3;
    drawPixelPanel(ctx, PANEL_X - 6, panelY, PANEL_W + 6, panelH, "rgba(11, 17, 32, 0.93)", "#38bdf8", "#1e293b");

    const labelMaxW = PANEL_W - 24;
    const subMaxW = PANEL_W - 32;

    options.forEach((opt, idx) => {
      const y = panelY + 5 + idx * stepH;
      const sel = idx === menuIndex;
      const isOpenDayBtn = opt.id === "openday";

      const bg = sel ? (isOpenDayBtn ? "#c2410c" : "#0369a1") : isOpenDayBtn ? "#431407" : "#162038";
      const brd = sel ? "#ffd147" : isOpenDayBtn ? "#fb923c" : "#475569";
      drawPixelPanel(ctx, PANEL_X, y, PANEL_W - 4, stepH - 2, bg, brd, "#0f172a");

      // Etichetta e sottotitolo si adattano ai pixel disponibili (con "…" se serve)
      const pre = `${sel ? "▶ " : "  "}`;
      const label = `${pre}${opt.label}`;
      const maxChars = Math.max(10, Math.floor((labelMaxW + 1) / 6));
      drawPixelText(
        ctx,

  // ===========================================================================
  // HUD IN PARTITA + NOTIFICHE TELLTALE + BANTER DI SQUADRA
  // ===========================================================================
  /**
   * Avanzamento temporale del HUD: va chiamato SOLO dallo step fisso a 60 Hz.
   * (Prima tick/banner/notifiche avanzavano ad ogni frame: a 120/144 Hz andavano al doppio.)
   */
  stepHUD(state) {
    this.tick++;
    for (let i = state.consequenceQueue.length - 1; i >= 0; i--) {
      state.consequenceQueue[i].ttl--;
      if (state.consequenceQueue[i].ttl <= 0) state.consequenceQueue.splice(i, 1);
    }
    if (this.bannerTimer > 0) this.bannerTimer--;
  }

  renderHUD(ctx, state, world, audio) {
    const d = state.data;

    // Fascia HUD superiore
    ctx.fillStyle = "rgba(9, 13, 26, 0.94)";
    ctx.fillRect(0, 0, SCREEN_W, 27);
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(0, 26, SCREEN_W, 1);

    // Energia (Cuori scolpiti) + Scudo
    for (let i = 0; i < d.maxHp; i++) {
      const hx = 7 + i * 13;
      const full = i < d.hp;
      ctx.fillStyle = "#090d1a";
      ctx.fillRect(hx - 1, 6, 12, 11);
      ctx.fillStyle = full ? "#ef4444" : "#334155";
      ctx.fillRect(hx, 7, 4, 4);
      ctx.fillRect(hx + 6, 7, 4, 4);
      ctx.fillRect(hx, 9, 10, 4);
      ctx.fillRect(hx + 2, 13, 6, 2);
      ctx.fillRect(hx + 4, 15, 2, 1);
      if (full) {
        ctx.fillStyle = "#fecaca";
        ctx.fillRect(hx + 1, 8, 2, 2);
      }
    }
    if (d.shield > 0) {
      drawPixelText(ctx, `+${d.shield}SC`, 8 + d.maxHp * 13, 9, "#38bdf8", 1);
    }

    // Selettore rapido dei Protagonisti: 1=Carlo, 2=Ranaldo, poi gli altri acquisiti.
    // Lo stesso ordine usato dai tasti numerici (main.heroSlotOrder), così non si sfalsano.
    const baseOrder = ["carlo", "ranaldo"];
    const rosterKey = (d.unlockedChars || []).join(",");
    if (this._rosterCacheKey !== rosterKey) {
      this._rosterCacheKey = rosterKey;
      this._rosterOrder = baseOrder.concat(
        (d.unlockedChars || []).filter((c) => !baseOrder.includes(c) && CHARACTERS[c])
      );
    }
    const slotOrder = this._rosterOrder;
    const SLOT_W = 42;
    const SLOT_PITCH = 45;
    const SLOT_X0 = 94;
    slotOrder.forEach((cid, idx) => {
      const unlocked = d.unlockedChars.includes(cid);
      const active = d.activeChar === cid;
      const meta = CHARACTERS[cid];
      const sx = SLOT_X0 + idx * SLOT_PITCH;

      ctx.fillStyle = active ? meta.accent : unlocked ? "#1e293b" : "#0f172a";
      ctx.fillRect(sx, 3, SLOT_W, 20);
      ctx.strokeStyle = active ? meta.color : unlocked ? "#475569" : "#1e293b";
      ctx.strokeRect(sx, 3, SLOT_W, 20);

      const label = unlocked ? `${idx + 1}:${meta.shortName.slice(0, 3)}` : `${idx + 1}:??`;
      drawPixelText(ctx, label, sx + 2, 6, unlocked ? (active ? "#ffffff" : "#cbd5e1") : "#475569", 1);
      if (world && unlocked && !active) {
        // hint discreto: le pillole degli altri compagni si possono cliccare col mouse
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(sx + 3, 21, SLOT_W - 6, 1);
      }

      if (active && world) {
        const ratio = Math.max(0, 1 - world.player.cooldown / meta.cooldownMax);
        ctx.fillStyle = meta.color;
        ctx.fillRect(sx + 2, 18, Math.round((SLOT_W - 4) * ratio), 3);
      }
    });

    // Indicatore Assist [C]
    if (world) {
      const assistReady = world.player.assistCooldown <= 0 && d.unlockedChars.length > 1;
      drawPixelText(ctx, assistReady ? "[C]OK" : "[C]..", 320, 5, assistReady ? "#4ade80" : "#64748b", 1);
    }

    // Indicatori EIPASS, Pegaso e Punti
    const totalPeg = d.mode === "openday" ? 3 : 12;
    drawPixelText(ctx, `PEG:${d.pegasoCollected.length}/${totalPeg}`, 320, 15, "#fde047", 1);
    drawPixelText(ctx, `EIP:${d.eipassScore}%`, 386, 5, "#38bdf8", 1);
    drawPixelText(ctx, `PT:${d.score}`, 386, 15, "#f8fafc", 1);
    drawPixelText(ctx, "[P]", 456, 10, "#ffd147", 1);

    // 1) Notifiche Narrative Stile Telltale ("★ Carlo si ricorderà di questo!") in alto a sinistra!
    //    (i TTL avanzano in stepHUD, non qui: niente velocità doppia sugli schermi 120/144 Hz)
    if (state.consequenceQueue.length > 0) {
      const topNote = state.consequenceQueue[state.consequenceQueue.length - 1];
      const w = Math.min(SCREEN_W - 20, topNote.text.length * 6 + 18);
      drawPixelPanel(ctx, 8, 31, w, 19, "rgba(11, 17, 32, 0.95)", topNote.color, "#1e293b");
      drawPixelText(ctx, topNote.text.slice(0, 74), 15, 37, topNote.color, 1);
    } else if (this.bannerTimer > 0) {
      // 2) Banner ingresso Zona/Capitolo
      const alpha = Math.min(1, this.bannerTimer / 28);
      ctx.save();
      ctx.globalAlpha = alpha;
      drawPixelPanel(ctx, 64, 32, 352, 34, "rgba(11, 17, 32, 0.93)", "#ffd147", "#1e3a8a");
      drawPixelTextCentered(ctx, this.bannerText.slice(0, 54), SCREEN_W / 2, 38, "#ffd147", 1);
      if (this.bannerSub) {
        drawPixelTextCentered(ctx, this.bannerSub.slice(0, 56), SCREEN_W / 2, 51, "#cbd5e1", 1);
      }
      ctx.restore();
    }

    // 3) Fumetto Banter non bloccante mentre si corre nei livelli!
    if (world && world.activeBanter && this.bannerTimer <= 0 && state.consequenceQueue.length === 0) {
      const bn = world.activeBanter;
      const pRow = PORTRAIT_ROWS[bn.speaker] ?? 0;
      drawPixelPanel(ctx, 8, 31, 344, 34, "rgba(11, 17, 32, 0.92)", CHARACTERS[bn.speaker]?.color || "#38bdf8", "#1e293b");
      if (this.imgs.portraits) {
        ctx.drawImage(this.imgs.portraits, 1 * PORTRAIT_SIZE, pRow * PORTRAIT_SIZE, PORTRAIT_SIZE, PORTRAIT_SIZE, 13, 35, 26, 26);
      }
      const lines = wrapPixelText(bn.text, 292, 1);
      lines.slice(0, 2).forEach((ln, li) => {
        drawPixelText(ctx, ln, 45, 37 + li * 11, "#f8fafc", 1);
      });
    }
  }

  // ===========================================================================
  // DIALOGO CINEMATOGRAFICO CON RITRATTI 64x64 A 6 ESPRESSIONI
  // ===========================================================================
  renderDialogue(ctx, dlgState) {
    const node = dlgState.currentNode;
    if (!node) return;

    const hasChoices = !!node.choices;
    const boxY = hasChoices ? 96 : 166;
    const boxH = SCREEN_H - boxY - 6;

    const borderCol = node.speaker === "sofista" ? "#d946ef" : CHARACTERS[node.speaker]?.color || "#ffd147";
    drawPixelPanel(ctx, 8, boxY, SCREEN_W - 16, boxH, "rgba(8, 12, 24, 0.96)", borderCol, "#1e293b");

    // Ritratto nativo 64x64 pixel-perfect!
    const pRow = PORTRAIT_ROWS[node.speaker] ?? 0;
    const expr = Math.max(0, Math.min(5, node.expr ?? 0));
    if (this.imgs.portraits) {
      ctx.drawImage(
        this.imgs.portraits,
        expr * PORTRAIT_SIZE,
        pRow * PORTRAIT_SIZE,
        PORTRAIT_SIZE,
        PORTRAIT_SIZE,
        16,
        boxY + 10,
        PORTRAIT_SIZE,
        PORTRAIT_SIZE
      );
    }

    drawPixelText(
      ctx,
      SPEAKER_NAMES[node.speaker] || node.speaker.toUpperCase(),
      88,
      boxY + 10,
      node.speaker === "sofista" ? "#f0abfc" : "#ffd147",
      1
    );

    // --- TESTO DIALOGO: righe misurate sul pannello reale (niente più testo tagliato) ---
    // Con i comandi touch sopra lo schermo si riserva l'angolo in basso a destra
    const touchReserve = this.touchSafe ? 96 : 0;
    const textMaxW = SCREEN_W - 106 - touchReserve;
    const textTop = boxY + 24;
    const lineH = 11;
    const maxTextLines = hasChoices ? 4 : 9;
    const textBottomLimit = boxY + boxH - 14;
    const maxByHeight = Math.max(2, Math.floor((textBottomLimit - textTop) / lineH) + 1);
    const shownText = node.text.slice(0, Math.floor(dlgState.charCount));
    const allLines = wrapPixelText(shownText, textMaxW, 1, true);
    const usedLines = Math.min(allLines.length, maxTextLines, maxByHeight);
    allLines.slice(0, usedLines).forEach((ln, i) => {
      drawPixelText(ctx, ln, 88, textTop + i * lineH, "#f8fafc", 1);
    });
    // Indicatore di scorrimento se il testo supera lo spazio disponibile
    if (allLines.length > usedLines) {
      drawPixelText(ctx, "▼", SCREEN_W - 24, textTop + (usedLines - 1) * lineH, "#fde047", 1);
    }

    // Nomi "sussurrati" al centro del pannello (stile Telltale) per la voce NON in scena
    if (node.speaker !== node.focus && !hasChoices) {
      const whisper = SPEAKER_NAMES[node.focus] || "";
      if (whisper) {
        drawPixelTextCentered(ctx, whisper.toLowerCase(), SCREEN_W / 2, boxY + 34, "#475569", 1);
      }
    }

    if (hasChoices && dlgState.charCount >= node.text.length) {
      const choiceStep = 18;
      const choiceTop = SCREEN_H - 12 - (node.choices.length * choiceStep) + 2;
      node.choices.forEach((ch, idx) => {
        const cy = choiceTop + idx * choiceStep;
        const sel = idx === dlgState.choiceIndex;
        drawPixelPanel(
          ctx,
          12,
          cy,
          SCREEN_W - 24,
          16,
          sel ? "#0369a1" : "#131c31",
          sel ? "#ffd147" : "#475569",
          "#0f172a"
        );
        // Etichetta scelta: si accorcia con "…" in base alla larghezza REALE del pannello
        const prefix = `${sel ? "▶" : " "} [${idx + 1}] `;
        const availPx = SCREEN_W - 24 - 16 - measurePixelText(prefix, 1) - (this.touchSafe ? 96 : 0);
        const maxChars = Math.max(8, Math.floor((availPx + 1) / 6));
        const label = ch.label.length > maxChars ? `${ch.label.slice(0, maxChars - 1).trimEnd()}…` : ch.label;
        drawPixelText(ctx, `${prefix}${label}`, 18, cy + 5, sel ? "#ffffff" : "#cbd5e1", 1);
      });
    } else {
      drawPixelText(
        ctx,
        "[SPAZIO / INVIO / E] Continua ▶",
        this.touchSafe ? 24 : SCREEN_W - 204,
        SCREEN_H - 18,
        "#fde047",
        1
      );
    }
  }

  /** Geometria UNICA delle opzioni quiz: la usano sia il disegno sia il tocco. */
  getQuizOptionRects(qState) {
    const q = qState.challenge;
    const optTop = 137;
    const optAvail = 240 - optTop;
    const wrapped = q.options.map((opt, idx) =>
      wrapPixelText(`[${idx + 1}] ${opt.label}`, SCREEN_W - 54, 1, false).slice(0, 3)
    );
    const wanted = wrapped.map((ls) => ls.length * 10 + 10);
    const totalWanted = wanted.reduce((a, b) => a + b, 0);
    const scale = totalWanted > optAvail ? optAvail / totalWanted : 1;
    let oy = optTop;
    return q.options.map((_, idx) => {
      const h = Math.max(20, Math.round(wanted[idx] * scale));
      const rect = { y: oy, h, lines: wrapped[idx] };
      oy += h + 3;
      return rect;
    });
  }

  renderQuizLiveSimulator(ctx, q, selIdx) {
    const opt = q.options[selIdx] || q.options[0];
    const sx = 20;
    const sy = 37;
    const sw = SCREEN_W - 40;
    const sh = 74;

    drawPixelPanel(ctx, sx, sy, sw, sh, "#0b1120", "#475569", "#162038");

    if (q.uiMode === "spreadsheet_live" && q.simData) {
      // Griglia Foglio di Calcolo interattiva con calcolo live in B6!
      ctx.fillStyle = "#14532d";
      ctx.fillRect(sx + 6, sy + 5, 200, 12);
      drawPixelText(ctx, `fx: ${opt.label.slice(0, 26)}`, sx + 10, sy + 8, "#bbf7d0", 1);

      q.simData.rows.forEach((r, ri) => {
        const ry = sy + 20 + ri * 12;
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(sx + 6, ry, 116, 11);
        ctx.fillRect(sx + 124, ry, 82, 11);
        drawPixelText(ctx, r[0], sx + 10, ry + 2, "#cbd5e1", 1);
        drawPixelText(ctx, r[1], sx + 128, ry + 2, "#f8fafc", 1);
      });

      // Cella Risultato Live a destra!
      drawPixelPanel(
        ctx,
        sx + 216,
        sy + 6,
        216,
        62,
        opt.correct ? "#0d3b2e" : "#3b1219",
        opt.correct ? "#4ade80" : "#f87171",
        "#090d1a"
      );
      drawPixelText(ctx, q.simData.resultLabel, sx + 224, sy + 12, "#93c5fd", 1);
      drawPixelText(ctx, opt.calcPreview || "---", sx + 224, sy + 24, opt.correct ? "#4ade80" : "#fda4af", 1);
      const tagWrapped = wrapPixelText(opt.previewTag || "", 200, 1);
      tagWrapped.slice(0, 2).forEach((tl, ti) => {
        drawPixelText(ctx, tl, sx + 224, sy + 38 + ti * 10, "#fde047", 1);
      });
    } else if (q.uiMode === "layout_studio" && q.simData) {
      // Anteprima Split-Screen Documento / Slide Aula Magna!
      const clean = opt.layoutState === "clean";
      const pageBg =
        q.simData.docKind === "slide"
          ? clean
            ? "#1e3a8a"
            : "#ffffff"
          : "#fefce8";

      ctx.fillRect(sx + 8, sy + 7, 172, 64);
      ctx.strokeStyle = "#94a3b8";
      ctx.strokeRect(sx + 8, sy + 7, 172, 64);

      if (q.simData.docKind === "slide") {
        if (clean) {
          ctx.fillStyle = "#ffd147";
          ctx.fillRect(sx + 14, sy + 13, 160, 12);
          drawPixelText(ctx, "OPEN DAY CASARDI", sx + 20, sy + 16, "#090d1a", 1, null);
          drawPixelText(ctx, "• Classico & Biomedico", sx + 16, sy + 32, "#ffffff", 1);

          for (let ly = 30; ly < 64; ly += 5) {
            ctx.fillStyle = "#fde047";
            ctx.fillRect(sx + 14, ly, 152, 2);
          }
        }
      } else {
        // Catalogo 8.000 Volumi o Giornale Pegaso
        drawPixelText(
          ctx,

        );

      drawPixelText(ctx, "STATO ANTEPRIMA LIVE:", sx + 192, sy + 16, "#93c5fd", 1);

      tagLines.forEach((ln, i) => {

      drawPixelText(ctx, opt.previewTag || "", sx + 16, sy + 51, "#ffffff", 1);
    } else {
      // Browser HTTPS o Centralina Hardware
      const topLine = q.simData?.url || (q.simData?.nodes || []).join("  |  ");
      drawPixelText(ctx, fitPixelText(topLine, sw - 24, 1, 1)[0], sx + 10, sy + 12, "#38bdf8", 1);

    }
  }
